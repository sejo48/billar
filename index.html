        .video-container {

        }

        .bar {
            width: 4px;
            background-color: #E50914;
            border-radius: 2px;
            animation: equalize 1s infinite alternate;

        .bar:nth-child(2) { animation-delay: -0.4s; }
        .bar:nth-child(3) { animation-delay: -0.6s; }
        .bar:nth-child(4) { animation-delay: -0.8s; }
        .bar:nth-child(5) { animation-delay: -1.0s; }

        @keyframes equalize {

        .paused-bar { transform: scaleY(0.2) !important; animation: none !important; opacity: 0.5; }

        const safeStorage = {

        };

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('youtube.com/watch')) {
                const videoId = url.split('v=')[1]?.split('&')[0];
                if (videoId) return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }
            if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                if (videoId) return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }
            return url;
        };

        const VideoPlayer = ({ src, onFullscreenChange }) => {
            const iframeRef = useRef(null);
            const containerRef = useRef(null);
            const [isFullscreen, setIsFullscreen] = useState(false);

            useEffect(() => {
                const handleFullscreenChange = () => {
                    const fullscreen = document.fullscreenElement || document.webkitFullscreenElement;
                    const isFS = !!fullscreen;
                    setIsFullscreen(isFS);
                    if (onFullscreenChange) onFullscreenChange(isFS);
                };

                document.addEventListener('fullscreenchange', handleFullscreenChange);
                document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
                
                return () => {
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
                };
            }, [onFullscreenChange]);

            useEffect(() => {
                const handleOrientationChange = () => {
                    if (iframeRef.current) {
                        const iframe = iframeRef.current;
                        const src = iframe.src;
                        iframe.src = '';
                        setTimeout(() => { iframe.src = src; }, 100);
                    }
                };

                if (screen.orientation) {
                    screen.orientation.addEventListener('change', handleOrientationChange);
                }
                window.addEventListener('resize', handleOrientationChange);

                return () => {
                    if (screen.orientation) {
                        screen.orientation.removeEventListener('change', handleOrientationChange);
                    }
                    window.removeEventListener('resize', handleOrientationChange);
                };
            }, []);

            const toggleFullscreen = useCallback(() => {
                const container = containerRef.current;
                if (container) {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (container.requestFullscreen) {
                            container.requestFullscreen();
                        } else if (container.webkitRequestFullscreen) {
                            container.webkitRequestFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                }
            }, []);

            useEffect(() => {
                if (iframeRef.current && src) {
                    iframeRef.current.src = src;
                }
            }, [src]);

            return (
                <div ref={containerRef} className="video-container" style={{ width: '100%', height: '100%', position: 'relative', background: '#000', overflow: 'hidden' }}>
                    <iframe
                        ref={iframeRef}
                        src={src}
                        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                        allowFullScreen
                        webkitallowfullscreen="true"
                        mozallowfullscreen="true"
                        style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', border: 'none', display: 'block' }}
                        title="Video Player"
                    />
                    <button onClick={toggleFullscreen} className="absolute bottom-4 right-4 z-20 bg-black/60 hover:bg-black/80 text-white p-2.5 rounded-full backdrop-blur-md border border-white/20 transition-all shadow-lg" style={{ touchAction: 'manipulation' }} aria-label="Pantalla completa">

                                <>

                                    <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
                                    <path d="M3 16h3a2 2 0 0 1 2 2v3" />
                                    <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
                                </>
                            ) : (
                                <>
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                                    <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                                    <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                                    <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
                                </>
                            )}
                        </svg>
                    </button>
                </div>
            );
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [expandedSeason, setExpandedSeason] = useState(0);
            const [showQrModal, setShowQrModal] = useState(false);
            const [tvGroupFilter, setTvGroupFilter] = useState('ALL');
            const [radioFavorites, setRadioFavorites] = useState([]);
            const [radioSearch, setRadioSearch] = useState('');
            const [isFullscreen, setIsFullscreen] = useState(false);

            const [currentRadioStation, setCurrentRadioStation] = useState(null);
            const [isRadioPlaying, setIsRadioPlaying] = useState(false);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [streamError, setStreamError] = useState(false);
            const [isLoadingRadio, setIsLoadingRadio] = useState(false);
            const audioRef = useRef(null);

            const navTabs = [
                { id: 'home', icon: 'home', label: 'Inicio' },
                { id: 'movies', icon: 'clapperboard', label: 'Cine' },
                { id: 'series', icon: 'film', label: 'Series' },
                { id: 'animados', icon: 'smile', label: 'Animados' },
                { id: 'tv', icon: 'tv', label: 'TV' },
                { id: 'radio', icon: 'radio', label: 'Radio' },
                { id: 'community', icon: 'chat', label: 'Comunidad' },
                { id: 'favorites', icon: 'heart', label: 'Favs' }
            ];

            // Cargar favoritos
            useEffect(() => {
                const storedFavs = safeStorage.getItem('magistube_favs');
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                const storedRadioFavs = safeStorage.getItem('magis_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(JSON.parse(storedRadioFavs)); } catch(e) {} }
            }, []);

            useEffect(() => {
                if (activeTab === 'tv' && CANALES_TV.length > 0) {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = CANALES_TV.find(c => 
                            (c.title || '').toLowerCase().includes('telerred')
                        ) || CANALES_TV[0];
                        if (telerredChannel) setSelectedItem(telerredChannel);
                    }
                }
            }, [activeTab]);

            // Audio para radio
            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.crossOrigin = "anonymous";
                    audioRef.current.addEventListener('error', () => {
                        setIsRadioPlaying(false);
                        setStreamError(true);
                        setIsLoadingRadio(false);
                    });
                    audioRef.current.addEventListener('playing', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    });
                }

                const audio = audioRef.current;
                audio.volume = radioVolume;

                if (currentRadioStation) {
                    if (audio.dataset.currentUrl !== currentRadioStation.url) {
                        setIsLoadingRadio(true);
                        setStreamError(false);
                        audio.dataset.currentUrl = currentRadioStation.url;
                        audio.src = currentRadioStation.url;
                        audio.load();
                        if (isRadioPlaying) {
                            audio.play().catch(() => {
                                setIsRadioPlaying(false);
                                setStreamError(true);
                                setIsLoadingRadio(false);
                            });
                        }
                    } else {
                        if (isRadioPlaying) {
                            audio.play().catch(() => {
                                setIsRadioPlaying(false);
                                setStreamError(true);
                            });
                        } else {
                            audio.pause();
                        }
                    }
                }
            }, [currentRadioStation, isRadioPlaying, radioVolume]);

            const toggleFavorite = (item) => {
                if (!item) return;
                const itemId = item.id || item.title;
                const isFav = favorites.some(f => (f.id || f.title) === itemId);
                const newFavs = isFav ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites];
                setFavorites(newFavs);
                safeStorage.setItem('magistube_favs', JSON.stringify(newFavs));
            };

            const toggleRadioFavorite = (station, e) => {
                if (e) e.stopPropagation();
                if (!station) return;
                const isFav = radioFavorites.some(f => f.id === station.id);
                const newFavs = isFav ? radioFavorites.filter(f => f.id !== station.id) : [station, ...radioFavorites];
                setRadioFavorites(newFavs);
                safeStorage.setItem('magis_radio_favs', JSON.stringify(newFavs));
            };

            const handlePlay = (item) => {
                if (!item) return;
                const code = item.codigo || item.password || item.pin;
                if (code) { setSelectedItem(item); setIsLocked(true); }
                else { setSelectedItem(item); setIsLocked(false); }
                setExpandedSeason(0);
                if (item.type === 'series' || item.type === 'animados') {
                    const seasons = item.seasons || [];
                    const episodes = seasons[0]?.episodes || [];
                    setSelectedEpisode(episodes[0] || null);
                } else {
                    setSelectedEpisode(null);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePlayRadioStation = (station) => {
                if (!station) return;
                if (currentRadioStation?.id === station.id) {
                    setIsRadioPlaying(!isRadioPlaying);
                } else {
                    setCurrentRadioStation(station);
                    setIsRadioPlaying(true);
                }
            };

            const handleTabClick = (tab) => {
                if (!tab) return;
                setActiveTab(tab.id);
                setSearch('');
                setIsLocked(false);
                if (tab.id === 'tv') {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = CANALES_TV.find(c => 
                            (c.title || '').toLowerCase().includes('telerred')
                        ) || CANALES_TV[0];
                        if (telerredChannel) setSelectedItem(telerredChannel);
                    }
                } else if (tab.id !== 'community') {
                    setSelectedItem(null);
                }
            };

            const toggleFullscreenPlayer = () => {
                const container = document.querySelector('.video-container');
                if (container) {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (container.requestFullscreen) container.requestFullscreen();
                        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                }
            };

            const getDisplayContent = () => {
                let list = [];
                if (activeTab === 'home') {
                    list = [...PELICULAS, ...SERIES, ...ANIMADOS, ...CANALES_TV.slice(0, 10)];
                } else if (activeTab === 'favorites') {
                    list = favorites;
                } else if (activeTab === 'movies') {
                    list = PELICULAS;
                } else if (activeTab === 'series') {
                    list = SERIES;
                } else if (activeTab === 'animados') {
                    list = ANIMADOS;
                } else if (activeTab === 'tv') {
                    list = CANALES_TV;
                } else {
                    list = [];
                }

                if (search && activeTab !== 'tv' && activeTab !== 'community') {
                    const searchLower = search.toLowerCase();
                    return list.filter(i => {
                        const title = i.title || i.name || i.titulo || '';
                        return title.toLowerCase().includes(searchLower);
                    });
                }
                return list;
            };

            const displayedItems = getDisplayContent();
            const heroItem = PELICULAS.length ? PELICULAS[Math.floor(Math.random() * PELICULAS.length)] : null;

            const tvGroups = useMemo(() => {
                const groups = new Set(CANALES_TV.map(c => c.group || 'General'));
                return ['ALL', ...Array.from(groups)];
            }, []);

            if (showIntro) {
                return (
                    <div className="fixed inset-0 z-[100] bg-[#111827] flex items-center justify-center overflow-hidden font-sans p-4">
                        <div className="absolute inset-0"><img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1000&auto=format&fit=crop" className="w-full h-full object-cover opacity-10" /><div className="absolute inset-0 bg-gradient-to-b from-[#111827] via-[#111827]/90 to-[#111827]"></div></div>
                        <div className="relative z-10 text-center max-w-sm w-full animate-slide-up">
                            <div className="mb-3 inline-block bg-[#E50914] px-2.5 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase text-white">Premium Access</div>
                            <h1 className="text-5xl font-black text-white mb-2 tracking-tighter">MAGIS<span className="text-[#E50914]">Tube</span></h1>
                            <p className="text-sm text-gray-400 font-light mb-6 italic">"Donde la nostalgia se encuentra con la tecnología."</p>
                            <button onClick={() => setShowIntro(false)} className="w-full bg-white text-black py-3.5 rounded-full font-bold text-base shadow-lg flex items-center justify-center gap-2 mb-8 active:scale-95 transition-transform">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="black" stroke="black" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span>Comenzar a Ver</span>
                            </button>
                            <div className="opacity-80">
                                <p className="text-[9px] text-gray-500 uppercase tracking-widest mb-0.5">DISEÑADO Y PROGRAMADO POR</p>
                                <h3 className="text-base font-serif text-gold-gradient font-bold mb-1">JORGE ARTURO HERNÁNDEZ MÉNDEZ</h3>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#111827] text-white font-sans flex flex-col md:flex-row relative">
                    {/* Sidebar Desktop */}
                    <aside className="hidden md:flex w-24 flex-col items-center py-6 bg-[#0f1115] border-r border-[#1f2937] fixed h-full z-50">
                        <div className="mb-6 p-2 bg-[#E50914] rounded-xl shadow-lg cursor-pointer" onClick={() => handleTabClick(navTabs[0])}>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </div>
                        <div className="flex flex-col gap-1 w-full items-center">
                            {navTabs.map(tab => (
                                <button key={tab.id} onClick={() => handleTabClick(tab)} className={`flex flex-col items-center gap-1 transition-all w-full py-2.5 ${activeTab === tab.id ? 'text-[#E50914] bg-white/5 font-bold border-l-4 border-[#E50914]' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                                    <Icon name={tab.icon} size={20} className={activeTab === tab.id ? 'text-[#E50914]' : 'text-gray-400'}/>
                                    <span className="text-[10px] tracking-tight">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="mt-auto flex flex-col items-center gap-3 mb-4">
                            <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 to-yellow-600 flex items-center justify-center font-serif font-bold text-black text-xs border border-white/20">J</div>
                        </div>
                    </aside>

                    {/* Mobile Header */}
                    <div className="md:hidden fixed top-0 w-full bg-[#111827]/95 backdrop-blur z-50 px-3 py-2.5 flex items-center justify-between border-b border-[#1f2937] gap-2">
                        <div className="flex items-center gap-1.5 font-black text-base tracking-tighter cursor-pointer flex-shrink-0" onClick={() => handleTabClick(navTabs[0])}>
                            <span className="text-[#E50914]">MAGIS</span> TUBE
                        </div>
                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                            <button onClick={() => handleTabClick(navTabs.find(t=>t.id==='radio'))} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs font-bold flex-shrink-0 ${activeTab === 'radio' ? 'bg-[#E50914] text-white border-[#E50914]' : 'bg-[#1f2937] text-gray-300 border-white/10'}`}>
                                <Icon name="radio" size={15}/><span>Radio</span>
                            </button>
                            <button onClick={() => handleTabClick(navTabs.find(t=>t.id==='community'))} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs font-bold flex-shrink-0 ${activeTab === 'community' ? 'bg-[#E50914] text-white border-[#E50914]' : 'bg-[#1f2937] text-gray-300 border-white/10'}`}>
                                <Icon name="chat" size={15}/><span>Chat</span>
                            </button>
                        </div>
                        <button onClick={() => handleTabClick(navTabs.find(t=>t.id==='favorites'))} className={`flex-shrink-0 transition-colors active:scale-90 p-1 ${activeTab === 'favorites' ? 'text-[#E50914]' : 'text-gray-400 hover:text-white'}`}>
                            <Icon name="heart" size={22} fill={activeTab === 'favorites' ? 'currentColor' : 'none'}/>
                        </button>
                    </div>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 w-full bg-[#0f1115] border-t border-[#1f2937] z-50 flex py-2 pb-safe px-2 overflow-x-auto no-scrollbar snap-x items-center justify-around shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                        {navTabs.filter(t => !['favorites', 'radio', 'community'].includes(t.id)).map(tab => (
                            <button key={tab.id} onClick={() => handleTabClick(tab)} className={`flex flex-col items-center justify-center flex-shrink-0 min-w-[56px] py-1 gap-1 snap-start transition-all active:scale-95 rounded-lg ${activeTab === tab.id ? 'text-[#E50914] bg-white/5' : 'text-gray-400 hover:text-white'}`}>
                                <Icon name={tab.icon} size={18}/>
                                <span className="text-[9px] font-medium tracking-wide">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    <main className="flex-1 md:ml-24 min-h-screen pt-14 md:pt-0 pb-36 md:pb-0 relative z-10">
                        {activeTab === 'radio' ? (
                            <div className="max-w-7xl mx-auto p-4 sm:p-8 animate-fade-in text-white pb-32">
                                <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 gap-4 border-b border-white/10 pb-4">
                                    <div>
                                        <h1 className="text-2xl sm:text-3xl font-black flex items-center gap-2.5">
                                            <span className="p-2 bg-[#E50914]/20 rounded-xl text-[#E50914]"><Icon name="radio" size={24}/></span>
                                            MAGIS <span className="text-[#E50914]">RADIO</span>
                                        </h1>
                                        <p className="text-xs sm:text-sm text-gray-400 mt-1">Disfruta de las mejores emisoras de Costa Rica en vivo.</p>
                                    </div>
                                </div>
                                <div className="mb-6">
                                    <div className="flex bg-[#1f2937] border border-[#374151] rounded-full px-4 py-2.5 w-full max-w-md items-center focus-within:border-[#E50914] transition-colors">
                                        <Icon className="text-gray-400 w-4 h-4 mr-3" name="search"/>
                                        <input type="text" placeholder="Buscar emisora..." className="bg-transparent w-full outline-none text-xs sm:text-sm placeholder-gray-500 text-white" value={radioSearch} onChange={(e) => setRadioSearch(e.target.value)}/>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                    {RADIOS.filter(s => (s.title || '').toLowerCase().includes(radioSearch.toLowerCase()) || (s.group || '').toLowerCase().includes(radioSearch.toLowerCase())).map(station => {
                                        const isCurrentPlaying = currentRadioStation?.id === station.id && isRadioPlaying;
                                        const isFav = radioFavorites.some(f => f.id === station.id);
                                        return (
                                            <div key={station.id} onClick={() => handlePlayRadioStation(station)} className={`group bg-[#1f2937]/80 hover:bg-[#273244] border rounded-2xl p-4 cursor-pointer transition-all ${currentRadioStation?.id === station.id ? 'border-[#E50914] shadow-[0_0_15px_rgba(229,9,20,0.25)]' : 'border-white/5'}`}>
                                                <div className="relative aspect-square rounded-xl overflow-hidden mb-3 bg-black">
                                                    <img src={station.image} alt={station.title} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x300/111827/ffffff?text=Radio'}/>
                                                    <button onClick={(e) => toggleRadioFavorite(station, e)} className="absolute top-2 right-2 p-1.5 bg-black/60 rounded-full text-white backdrop-blur-sm z-20">
                                                        <Icon name="heart" size={16} fill={isFav ? '#E50914' : 'none'} className={isFav ? 'text-[#E50914]' : 'text-white'}/>
                                                    </button>
                                                    <div className={`absolute inset-0 flex items-center justify-center bg-black/40 transition-opacity z-10 ${isCurrentPlaying ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>
                                                        <div className={`w-12 h-12 rounded-full flex items-center justify-center text-white ${isCurrentPlaying ? 'bg-[#E50914] shadow-[0_0_15px_#E50914]' : 'bg-white/20 backdrop-blur-md border border-white/40'}`}>
                                                            <Icon name={isCurrentPlaying ? "pause" : "play"} size={22} fill="currentColor"/>
                                                        </div>
                                                    </div>
                                                </div>
                                                <h3 className="font-bold text-sm text-white truncate">{station.title}</h3>
                                                <p className="text-xs text-gray-400 truncate mt-0.5">{station.group}</p>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : activeTab === 'community' ? (
                            <div className="max-w-5xl mx-auto p-4 sm:p-8 animate-fade-in text-white pb-28">
                                <div className="mb-6 border-b border-white/10 pb-4">
                                    <h1 className="text-2xl sm:text-3xl font-black flex items-center gap-2.5">
                                        <span className="p-2 bg-[#E50914]/20 rounded-xl text-[#E50914]"><Icon name="chat" size={24}/></span>
                                        Comunidad <span className="text-[#E50914]">MAGISTUBE</span>
                                    </h1>
                                </div>
                                <div className="bg-[#171c26] border border-white/10 rounded-2xl p-4 shadow-2xl flex flex-col items-center">
                                    <div className="w-full h-[550px] rounded-xl overflow-hidden bg-black/40 border border-white/10">
                                        <iframe src="https://sejoflix.chatango.com/" width="100%" height="100%" frameBorder="0" scrolling="auto" className="w-full h-full bg-transparent"></iframe>
                                    </div>
                                </div>
                            </div>
                        ) : activeTab === 'favorites' && !selectedItem ? (
                            <div className="p-4 sm:p-8 animate-fade-in">
                                <div className="mb-6 flex items-center gap-3 border-b border-white/10 pb-3">
                                    <div className="p-2 bg-[#E50914]/20 rounded-lg text-[#E50914]"><Icon fill="currentColor" name="heart" size={20}/></div>
                                    <h2 className="text-xl font-bold text-white">Tus Favoritos</h2>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
                                    {favorites.map((item, i) => (
                                        <div key={i} className="group relative flex flex-col gap-1.5 cursor-pointer active:scale-95 transition-transform" onClick={() => handlePlay(item)}>
                                            <div className="relative overflow-hidden rounded-lg bg-[#1f2937] shadow-md aspect-[2/3]">
                                                <img src={item.image || 'https://placehold.co/300x450/1f2937/ffffff?text=Movie'} loading="lazy" className="w-full h-full object-cover" alt={item.title} />
                                                <button onClick={(e) => { e.stopPropagation(); toggleFavorite(item); }} className="absolute top-1.5 right-1.5 p-1.5 bg-black/60 rounded-full text-white">
                                                    <Icon name="heart" size={14} fill="#E50914" className="text-[#E50914]"/>
                                                </button>
                                            </div>
                                            <h3 className="text-xs font-bold text-gray-200 truncate">{item.title || 'Sin título'}</h3>
                                        </div>
                                    ))}
                                </div>
                                {favorites.length === 0 && <div className="text-center py-20 text-gray-500 text-sm"><p>No tienes favoritos guardados aún.</p></div>}
                            </div>
                        ) : activeTab === 'tv' || (selectedItem && selectedItem.type === 'tv') ? (
                            <div className="flex flex-col lg:flex-row min-h-[calc(100vh-3.5rem)] lg:h-screen lg:overflow-hidden bg-[#090b10]">
                                <div className="w-full lg:w-96 bg-[#0f1117] border-r border-white/10 flex flex-col order-2 lg:order-1 h-auto lg:h-full z-20 shadow-2xl">
                                    <div className="p-4 border-b border-white/10 bg-[#161a24] flex flex-col gap-3">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <div className="p-1.5 bg-[#E50914]/20 text-[#E50914] rounded-lg border border-[#E50914]/30"><Icon name="tv" size={18}/></div>
                                                <h2 className="font-extrabold text-sm text-white tracking-wide">Canales TV</h2>
                                            </div>
                                            <span className="text-[10px] font-mono text-gray-400 bg-white/5 border border-white/10 px-2 py-0.5 rounded-full">{CANALES_TV.length} en vivo</span>
                                        </div>
                                        <div className="relative">
                                            <input type="text" placeholder="Buscar canal..." className="w-full bg-[#0a0d13] border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white focus:border-[#E50914] outline-none pl-9 transition-colors placeholder-gray-500" value={search} onChange={(e) => setSearch(e.target.value)}/>
                                            <Icon className="absolute left-3 top-2.5 text-gray-400" name="search" size={15}/>
                                            {search && <button onClick={() => setSearch('')} className="absolute right-3 top-2.5 text-gray-400 hover:text-white"><Icon name="x" size={14}/></button>}
                                        </div>
                                        <select value={tvGroupFilter} onChange={(e) => setTvGroupFilter(e.target.value)} className="w-full bg-[#0a0d13] border border-white/10 rounded-xl px-3 py-1.5 text-xs text-gray-200 outline-none focus:border-[#E50914] cursor-pointer">
                                            <option value="ALL">🌐 Todos los géneros</option>
                                            {tvGroups.filter(g => g !== 'ALL').map((group, idx) => (<option key={idx} value={group}>{group}</option>))}
                                        </select>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1.5 max-h-[50vh] lg:max-h-none">
                                        {CANALES_TV.filter(c => {
                                            const matchesSearch = !search || (c.title || '').toLowerCase().includes(search.toLowerCase());
                                            const matchesGroup = tvGroupFilter === 'ALL' || c.group === tvGroupFilter;
                                            return matchesSearch && matchesGroup;
                                        }).map((channel, idx) => {
                                            const isActive = selectedItem?.id === channel.id;
                                            const isFav = favorites.some(f => f.id === channel.id);
                                            return (
                                                <div key={channel.id || idx} onClick={() => handlePlay(channel)} className={`group relative flex items-center gap-3 p-2.5 rounded-xl border cursor-pointer transition-all duration-200 ${isActive ? 'bg-[#E50914]/15 border-[#E50914] shadow-[0_0_15px_rgba(229,9,20,0.3)] border-l-4' : 'bg-[#141822]/80 hover:bg-[#1c2230] border-white/5 hover:border-white/15'}`}>
                                                    <div className="w-12 h-9 rounded-lg bg-black/80 flex items-center justify-center overflow-hidden flex-shrink-0 border border-white/10 relative">
                                                        {channel.image ? (<img src={channel.image} alt={channel.title} loading="lazy" className="w-full h-full object-contain p-0.5" />) : (<Icon className="text-gray-500" name="tv" size={16}/>)}
                                                        {isActive && <div className="absolute inset-0 bg-[#E50914]/20 flex items-center justify-center"><div className="w-2 h-2 rounded-full bg-[#E50914] animate-ping"></div></div>}
                                                    </div>

            return (

        };

        // Iniciar la aplicación
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App/>);
        } catch (error) {
            console.error('Error al iniciar la aplicación:', error);
            document.getElementById('root').innerHTML = `
                <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#111827;color:white;flex-direction:column;font-family:sans-serif;padding:20px;text-align:center;">
                    <div style="font-size:48px;margin-bottom:16px;">⚠️</div>

                    <p style="color:#9ca3af;font-size:14px;max-width:400px;">${error.message || 'Error desconocido'}</p>
                    <button onclick="window.location.reload()" style="margin-top:20px;background:#E50914;border:none;color:white;padding:10px 32px;border-radius:8px;cursor:pointer;font-weight:bold;">Reintentar</button>
