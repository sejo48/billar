<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic TV 2.0 Z-Gen Ultimate - Jorge Arturo Hernández Méndez</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zdark: '#0a0b10',
                        zcard: '#121420',
                        zpink: '#ff2d55',
                        zpinkHover: '#e02446',
                        zborder: 'rgba(255, 255, 255, 0.08)'
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0b10;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .font-outfit { font-family: 'Outfit', sans-serif; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0b10; }
        ::-webkit-scrollbar-thumb { background: #ff2d55; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #e02446; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-z-fade { animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes softFloat {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }
        .animate-soft-float { animation: softFloat 4s ease-in-out infinite; }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }
        .animate-pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }

        @keyframes attentionBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-attention { animation: attentionBounce 2s ease-in-out infinite; }

        .glass-z {
            background: rgba(18, 20, 32, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .led-equalizer-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 28px;
            flex-shrink: 0;
        }

        .led-column {
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            width: 5px;
            height: 100%;
        }

        .led-block {
            width: 100%;
            height: 3px;
            background-color: rgba(255, 45, 85, 0.15);
            border-radius: 1px;
            transition: background-color 0.15s ease;
        }

        .led-column.active .led-block:nth-child(1) { animation: ledPulse 0.6s infinite alternate; }
        .led-column.active .led-block:nth-child(2) { animation: ledPulse 0.5s infinite alternate 0.1s; }
        .led-column.active .led-block:nth-child(3) { animation: ledPulse 0.7s infinite alternate 0.2s; }
        .led-column.active .led-block:nth-child(4) { animation: ledPulse 0.4s infinite alternate 0.15s; }
        .led-column.active .led-block:nth-child(5) { animation: ledPulse 0.65s infinite alternate 0.25s; }
        .led-column.active .led-block:nth-child(6) { animation: ledPulse 0.55s infinite alternate 0.05s; }
        .led-column.active .led-block:nth-child(7) { animation: ledPulse 0.45s infinite alternate 0.3s; }

        @keyframes ledPulse {
            0% { background-color: rgba(255, 45, 85, 0.2); }
            50% { background-color: #ff7396; }
            100% { background-color: #ff2d55; box-shadow: 0 0 6px #ff2d55; }
        }

        .z-grid-bg {
            background-image: radial-gradient(rgba(255, 45, 85, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-zdark text-white min-h-screen z-grid-bg selection:bg-zpink selection:text-white">

    <div id="root">
        <div class="flex h-screen w-screen items-center justify-center bg-zdark flex-col">
            <div class="relative w-20 h-20 mb-6">
                <div class="absolute inset-0 rounded-3xl border-2 border-zpink animate-ping opacity-40"></div>
                <div class="absolute inset-0 rounded-3xl border-2 border-zpink border-t-transparent animate-spin"></div>
                <div class="absolute inset-2 rounded-2xl bg-zcard flex items-center justify-center text-zpink font-outfit font-black text-xl">2.0</div>
            </div>
            <h2 class="font-outfit text-lg font-extrabold tracking-wider text-white">MAGIC TV <span class="text-zpink">2.0 ULTIMATE</span></h2>
            <p class="text-xs text-gray-400 mt-2 font-mono tracking-wide">CARGANDO EXPERIENCIA MULTIMEDIA...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: ['./peliculas.json', './peliculas2.json'],
            ANIMADOS: './animados.json',
            RADIOS: './radios.json'
        };

        const RAW_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/playlist.json',
            MOVIES: ['https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas.json', 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas2.json'],
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/billar/refs/heads/main/animados.json',
            RADIOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/radios.json'
        };

        const QR_IMAGE_URL = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgsPiFVGiGuwJ3smwIQGJ-25kEkpEZpmR4PNZLdRF0_3LVfWAj2xhWSHiK7pY-C3jera3PD_XpmEtNy0kaCW1m8dayT9ebTV3YNBmbzMZeHF_oIf2XlniVGt6pj6BqtTyWEaUts1Ll_vYx2RuJvlrF9rqIwWcYcwMkTcdLCI-bShcR_KhhoILWEkdJ4Z4w/s1600/mi-qr-pro.png';

        const DEFAULT_RADIO_STATIONS = [
            { id: 'cr-sinfonola', title: 'Radio Sinfonola 90.3 FM', group: 'Romántica / Clásicos', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://live.turadio.stream:7006/;' },
            { id: 'cr-hit', title: 'Hit 104.7 FM', group: 'Juvenil / Pop', image: 'https://static.mytuner.mobi/media/tvos_radios/164/radio-hit-1047-fm.1180f4a3.jpg', url: 'https://live.turadio.stream:7004/stream?nocache=596&type=http' },
            { id: 'cr-crc', title: 'CRC 94.7 FM', group: 'Alternativo / Rock', image: 'https://static.mytuner.mobi/media/tvos_radios/nAwNLxJbnm.png', url: 'https://23263.live.streamtheworld.com/CRC_947AAC_SC' },
            { id: 'cr-zeta', title: 'Zeta FM 95.1', group: 'Tropical / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/879/zeta-fm.feb3fb70.png', url: 'https://d5g44yionyslb.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-monumental', title: 'Radio Monumental 93.5 FM', group: 'Noticias / Deportes', image: 'https://static.mytuner.mobi/media/tvos_radios/574/radio-monumental.7303764d.png', url: 'https://d26gdpbozqq700.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-mejor', title: 'La Mejor 99.1 FM', group: 'Regional / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/575/la-mejor-991.95c72890.png', url: 'https://d3svz5xnvdysyz.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-r2', title: 'Radio Dos 99.5 FM', group: 'Clásicos / Rock', image: 'https://placehold.co/300x300/0033a0/ffffff?text=R2', url: 'https://icecasthd.teletica.com/radiodos' },
            { id: 'cr-los40', title: 'Los 40 Costa Rica 104.3 FM', group: 'Éxitos / Urbano', image: 'https://placehold.co/300x300/ffcc00/000000?text=Los40', url: 'https://icecasthd.teletica.com/los40' },
            { id: 'cr-disney', title: 'Radio Disney 101.1 FM', group: 'Pop / Éxitos', image: 'https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg', url: 'https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8' },
            { id: 'cr-wao', title: 'WAO 92.3 FM', group: 'Urbano / Reggaeton', image: 'https://placehold.co/300x300/fd7e14/ffffff?text=WAO', url: 'https://icecasthd.teletica.com/wao' },
            { id: 'cr-musical', title: 'Radio Musical 97.5 FM', group: 'Romántica / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/085/radio-musical.fea3e089.jpg', url: 'https://live.turadio.stream:7005/stream/1/' }
        ];

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}

            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) {
                    return isJson ? await resRaw.json() : await resRaw.text();
                }
            } catch (e) {}

            return null;
        };

        const parseM3U = (data) => {
            const lines = data.split('\n');
            const channels = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let title = 'Canal en Vivo';
                    const url = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (url && url.startsWith('http')) {
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                        const logo = logoMatch ? logoMatch[1] : '';
                        const groupMatch = line.match(/group-title="([^"]*)"/);
                        const group = groupMatch ? groupMatch[1] : 'Nacionales';
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                        channels.push({ 
                            id: `tv-${i}`, 
                            title, 
                            image: logo || 'https://placehold.co/300x200/121420/ff2d55?text=Magic+TV', 
                            group, 
                            url, 
                            type: 'tv' 
                        });
                    }
                }
            }
            return channels;
        };

        const LedEqualizer = ({ isPlaying }) => (
            <div className="led-equalizer-container">
                {[1, 2, 3].map(col => (
                    <div key={col} className={`led-column ${isPlaying ? 'active' : ''}`}>
                        {[1, 2, 3, 4, 5, 6, 7].map(block => (
                            <div key={block} className="led-block"></div>
                        ))}
                    </div>
                ))}
            </div>
        );

        const App = () => {
            const [currentTab, setCurrentTab] = useState('home');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeMedia, setActiveMedia] = useState(null);
            const [favorites, setFavorites] = useState([]);
            const [activeRadio, setActiveRadio] = useState(null);
            const [isPlayingRadio, setIsPlayingRadio] = useState(false);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showAuthorModal, setShowAuthorModal] = useState(false);
            const [showCtrlDTooltip, setShowCtrlDTooltip] = useState(false);
            const [loading, setLoading] = useState(true);

            const [content, setContent] = useState({
                tv: [],
                movies: [],
                series: [],
                animados: [],
                radios: DEFAULT_RADIO_STATIONS
            });

            const audioRef = useRef(null);
            const hlsRef = useRef(null);

            useEffect(() => {
                const loadData = async () => {
                    const startTime = Date.now();
                    try {
                        const moviePromises = URLS.MOVIES.map((localPath, idx) => 
                            fetchSmart(localPath, RAW_URLS.MOVIES[idx], true)
                        );

                        const [dataTV, dataSeries, dataAnimados, dataRadios, ...moviesResults] = await Promise.all([
                            fetchSmart(URLS.TV, RAW_URLS.TV, false),
                            fetchSmart(URLS.SERIES, RAW_URLS.SERIES, true),
                            fetchSmart(URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                            fetchSmart(URLS.RADIOS, RAW_URLS.RADIOS, true),
                            ...moviePromises
                        ]);

                        let tvChannels = dataTV ? parseM3U(dataTV) : [];
                        
                        let moviesList = [];
                        moviesResults.forEach((dataMovies, fileIdx) => {
                            if (dataMovies) {
                                const rawMovies = Array.isArray(dataMovies) ? dataMovies : (dataMovies.peliculas || dataMovies.content || []);
                                const mapped = rawMovies.map((m, idx) => ({
                                    ...m,
                                    id: `mov-${fileIdx}-${idx}`,
                                    type: 'movies',
                                    title: m.titulo || m.title || m.name,
                                    description: m.descripcion || m.sinopsis || m.plot,
                                    image: m.imagen || m.poster || m.image,
                                    url: convertUrl(m.urlDrive || m.url || m.urlOkRu),
                                    group: 'Cine Z-Gen',
                                    rating: m.rating || '9.4'
                                }));
                                moviesList = [...moviesList, ...mapped];
                            }
                        });

                        let seriesList = [];
                        if (dataSeries) {
                            const rawSeries = Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || dataSeries.content || []);
                            seriesList = rawSeries.map((s, idx) => ({
                                ...s,
                                id: `serie-${idx}`,
                                type: 'series',
                                title: s.tituloSerie || s.titulo || s.title || s.name,
                                description: s.descripcion || s.sinopsis,
                                image: s.imagen || s.poster || s.image,
                                group: 'Series',
                                seasons: (s.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        let animadosList = [];
                        if (dataAnimados) {
                            const rawAnimados = Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || dataAnimados.series || dataAnimados.content || []);
                            animadosList = rawAnimados.map((a, idx) => {
                                const seasonsData = (a.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-anim-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }));

                                const hasSeasons = seasonsData.length > 0 && seasonsData.some(s => s.episodes.length > 0);
                                const singleUrl = convertUrl(a.urlDrive || a.url || a.urlOkRu);

                                return {
                                    ...a,
                                    id: `anim-${idx}`,
                                    type: 'animados',
                                    title: a.titulo || a.tituloSerie || a.title || a.name,
                                    description: a.descripcion || a.sinopsis,
                                    image: a.imagen || a.poster || a.image,
                                    group: 'Animados & Kids',
                                    url: singleUrl,
                                    seasons: hasSeasons ? seasonsData : [{
                                        seasonNumber: 1,
                                        episodes: [{
                                            id: `ep-anim-single-${idx}`,
                                            title: a.titulo || a.title || 'Reproducir Animado',
                                            url: singleUrl
                                        }]
                                    }]
                                };
                            });
                        }

                        let radioList = DEFAULT_RADIO_STATIONS;
                        if (dataRadios) {
                            const list = Array.isArray(dataRadios) ? dataRadios : (dataRadios.radios || dataRadios.emisoras || []);
                            if (list.length > 0) radioList = list;
                        }

                        setContent({
                            tv: tvChannels,
                            movies: moviesList,
                            series: seriesList,
                            animados: animadosList,
                            radios: radioList
                        });
                    } catch (e) {
                        console.error("Error loading Magic TV 2.0 content", e);
                    } finally {
                        const elapsed = Date.now() - startTime;
                        const remaining = Math.max(0, 3000 - elapsed);
                        setTimeout(() => {
                            setLoading(false);
                        }, remaining);
                    }
                };

                loadData();

                const savedFavs = safeStorage.getItem('magistv2_zgen_favs');
                if (savedFavs) {
                    try { setFavorites(JSON.parse(savedFavs)); } catch(e) {}
                }
            }, []);

            const toggleFavorite = (item) => {
                const itemId = item.id || item.title;
                const updated = favorites.some(f => (f.id || f.title) === itemId) 
                    ? favorites.filter(f => (f.id || f.title) !== itemId) 
                    : [...favorites, item];
                setFavorites(updated);
                safeStorage.setItem('magistv2_zgen_favs', JSON.stringify(updated));
            };

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.crossOrigin = "anonymous";
                    
                    audioRef.current.addEventListener('error', () => {
                        setIsPlayingRadio(false);
                    });
                }

                const audio = audioRef.current;
                audio.volume = radioVolume;

                if (activeRadio) {
                    const playAudio = () => {
                        audio.play().catch(() => {
                            setIsPlayingRadio(false);
                        });
                    };

                    if (audio.dataset.currentUrl !== activeRadio.url) {
                        audio.dataset.currentUrl = activeRadio.url;

                        if (hlsRef.current) {
                            hlsRef.current.destroy();
                            hlsRef.current = null;
                        }

                        if (activeRadio.url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls();
                            hlsRef.current = hls;
                            hls.loadSource(activeRadio.url);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                if (isPlayingRadio) playAudio();
                            });
                        } else {
                            audio.src = activeRadio.url;
                            audio.load();
                            if (isPlayingRadio) playAudio();
                        }
                    } else {
                        if (isPlayingRadio) playAudio();
                        else audio.pause();
                    }
                }
            }, [activeRadio, isPlayingRadio]);

            useEffect(() => {
                if (audioRef.current) audioRef.current.volume = radioVolume;
            }, [radioVolume]);

            const handlePlayStation = (station) => {
                if (activeRadio?.id === station.id) {
                    setIsPlayingRadio(!isPlayingRadio);
                } else {
                    setActiveRadio(station);
                    setIsPlayingRadio(true);
                }
            };

            if (loading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-zdark flex-col animate-z-fade">
                        <div className="relative w-20 h-20 mb-6">
                            <div className="absolute inset-0 rounded-3xl border-2 border-zpink animate-ping opacity-40"></div>
                            <div className="absolute inset-0 rounded-3xl border-2 border-zpink border-t-transparent animate-spin"></div>
                            <div className="absolute inset-2 rounded-2xl bg-zcard flex items-center justify-center text-zpink font-outfit font-black text-xl">2.0</div>
                        </div>
                        <h2 className="font-outfit text-lg font-extrabold tracking-wider text-white">MAGIC TV <span className="text-zpink">2.0 ULTIMATE</span></h2>
                        <p className="text-xs text-gray-400 mt-2 font-mono tracking-wide">CARGANDO EXPERIENCIA MULTIMEDIA...</p>
                    </div>
                );
            }

            return (
                <div className="flex flex-col min-h-screen bg-zdark relative">
                    
                    {/* Header */}
                    <header className="fixed top-0 w-full glass-z z-50 px-4 sm:px-6 py-4 flex items-center justify-between border-b border-white/10 shadow-lg">
                        <div className="flex items-center gap-4 sm:gap-8">
                            <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => { setCurrentTab('home'); setActiveMedia(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
                                <div className="w-9 h-9 bg-zpink rounded-xl flex items-center justify-center font-outfit font-black text-white shadow-[0_0_15px_rgba(255,45,85,0.4)]">
                                    <i className="ph-fill ph-play text-base ml-0.5"></i>
                                </div>
                                <span className="font-outfit font-extrabold text-base sm:text-lg tracking-tight text-white hidden xs:inline">Magic TV</span>
                            </div>
                            <nav className="hidden lg:flex items-center gap-5 text-sm font-semibold text-gray-300">
                                {[
                                    { id: 'home', label: 'Home' },
                                    { id: 'movies', label: 'Cine' },
                                    { id: 'series', label: 'Series' },

                                isEmbed ? (
                                    <iframe src={selectedChannel.url} className="w-full h-full border-0 absolute inset-0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen></iframe>
                                ) : (
                                    <video src={selectedChannel.url} controls autoPlay playsInline className="w-full h-full object-contain absolute inset-0"></video>
                                )
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-gray-400 space-y-2">
                                    <i className="ph ph-television-simple text-4xl opacity-40"></i>
                                    <p className="text-xs font-medium">Selecciona un canal para comenzar la transmisión</p>
                                </div>
                            )}
                        </div>
                        {selectedChannel && (
                            <div className="glass-z rounded-3xl p-5 border border-white/10 shadow-xl flex items-center justify-between">
                                <div className="flex items-center gap-3 truncate">
                                    <img src={selectedChannel.image} alt={selectedChannel.title} className="w-12 h-12 rounded-xl object-contain bg-black/60 border border-white/10 p-1" />
                                    <div>
                                        <h3 className="font-outfit font-black text-sm text-white truncate">{selectedChannel.title}</h3>
                                        <span className="text-[11px] text-zpink font-semibold flex items-center gap-1.5 mt-0.5">
                                            <span className="w-2 h-2 rounded-full bg-zpink animate-pulse"></span> TRANSMITIENDO EN DIRECTO HD
                                        </span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => onToggleFav(selectedChannel)} className="p-3 rounded-xl glass-z hover:bg-white/15 text-white transition-all">
                                        <i className={`ph-fill ph-heart-straight text-lg ${favorites.some(f => f.id === selectedChannel.id) ? 'text-zpink' : 'text-gray-300'}`}></i>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="glass-z rounded-3xl p-4 flex flex-col border border-white/10 shadow-2xl overflow-hidden order-2 lg:order-1 h-[550px] lg:h-[calc(100vh-120px)]">
                        <div className="p-2 border-b border-white/10 space-y-3">
                            <div className="flex items-center justify-between">
                                <h2 className="font-outfit font-black text-sm text-white flex items-center gap-2">
                                    <i className="ph ph-television-simple text-zpink text-base"></i> Canales TV
                                </h2>
                                <span className="text-[10px] font-mono text-gray-400 bg-white/5 px-2.5 py-1 rounded-full border border-white/10">{channels.length} en vivo</span>
                            </div>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Buscar canal..."
                                    className="w-full bg-zcard border border-white/15 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 outline-none focus:border-zpink shadow-inner pl-9"
                                />
                                <i className="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                            </div>
                            <select 
                                value={filterGroup} 
                                onChange={(e) => setFilterGroup(e.target.value)}
                                className="w-full bg-zcard border border-white/15 rounded-xl px-3 py-2 text-xs text-white font-bold outline-none focus:border-zpink shadow-inner cursor-pointer"
                            >
                                {groups.map(g => <option key={g} value={g}>{g === 'ALL' ? 'Todos los géneros / categorías' : g}</option>)}
                            </select>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 mt-3 pr-1">
                            {filtered.map(channel => {
                                const isActive = selectedChannel?.id === channel.id;
                                const isFav = favorites.some(f => f.id === channel.id);
                                return (
                                    <div 
                                        key={channel.id} 
                                        onClick={() => handleSelectChannel(channel)} 
                                        className={`group relative flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all border ${isActive ? 'bg-zpink/20 border-zpink shadow-[0_0_15px_rgba(255,45,85,0.3)] border-l-4' : 'glass-z hover:bg-white/5 border-white/5'}`}
                                    >
                                        <div className="w-12 h-10 rounded-xl bg-black/80 flex items-center justify-center overflow-hidden flex-shrink-0 border border-white/10 relative">
                                            <img src={channel.image} alt={channel.title} className="w-full h-full object-contain p-0.5" onError={(e) => e.target.src='https://placehold.co/300x300/121420/ff2d55?text=TV'} />
                                            {isActive && <div className="absolute inset-0 bg-zpink/20 flex items-center justify-center"><div className="w-2 h-2 rounded-full bg-zpink animate-ping"></div></div>}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <h4 className={`text-xs font-bold truncate transition-colors ${isActive ? 'text-zpink font-black' : 'text-white'}`}>{channel.title}</h4>
                                            <span className="text-[10px] text-gray-400 truncate block mt-0.5">{channel.group || 'Nacionales'}</span>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); onToggleFav(channel); }} className="p-1.5 rounded-lg text-gray-400 hover:text-white transition-colors">
                                            <i className={`ph-fill ph-heart-straight text-sm ${isFav ? 'text-zpink' : 'text-gray-500'}`}></i>
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const CategoryGridSection = ({ title, subtitle, items, onSelect, favorites, onToggleFav }) => (
            <div className="space-y-6 animate-z-fade">
                <div>
                    <h1 className="font-outfit text-2xl sm:text-3xl font-black text-white">{title}</h1>
                    <p className="text-xs sm:text-sm text-gray-400 mt-1">{subtitle}</p>
                </div>
                {items.length === 0 ? (
                    <div className="text-center py-24 text-gray-400">
                        <i className="ph ph-film-slate text-5xl mb-3 opacity-50"></i>
                        <p className="text-sm font-medium">No hay contenido disponible en esta categoría.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {items.map(item => {
                            const isFav = favorites.some(f => (f.id || f.title) === (item.id || item.title));
                            return (
                                <div key={item.id || item.title} onClick={() => onSelect(item)} className="group glass-z rounded-2xl p-3 cursor-pointer hover:border-zpink transition-all shadow-xl flex flex-col justify-between">
                                    <div className="aspect-[2/3] rounded-xl bg-black/80 overflow-hidden relative mb-2.5 border border-white/10 flex items-center justify-center">
                                        <img src={item.image} alt={item.title} className="w-full h-full object-contain p-0 group-hover:scale-105 transition-transform duration-300" onError={(e) => e.target.src='https://placehold.co/300x450/121420/ffffff?text=Poster'} />
                                        <button onClick={(e) => { e.stopPropagation(); onToggleFav(item); }} className="absolute top-2 right-2 p-1.5 rounded-full bg-black/70 text-white backdrop-blur-md shadow z-10">
                                            <i className={`ph-fill ph-heart-straight ${isFav ? 'text-zpink' : 'text-white'}`}></i>
                                        </button>
                                        {item.rating && (
                                            <div className="absolute bottom-2 left-2 px-2 py-0.5 rounded bg-yellow-400 text-black text-[9px] font-black uppercase shadow">
                                                ★ {item.rating}
                                            </div>
                                        )}
                                    </div>
                                    <div className="min-w-0">
                                        <h3 className="font-bold text-xs text-white truncate">{item.title}</h3>
                                        <span className="text-[11px] text-gray-400 block mt-0.5 truncate">{item.group || 'Estreno'}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        );

        const RadioSection = ({ stations, activeRadio, isPlaying, onPlayStation, favorites }) => {
            const [tab, setTab] = useState('all');
            const list = tab === 'favs' ? favorites.filter(f => stations.some(s => s.id === f.id)) : stations;

            return (
                <div className="space-y-6 animate-z-fade">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h1 className="font-outfit text-2xl sm:text-3xl font-black text-white">Radio HD Costa Rica</h1>
                            <p className="text-xs sm:text-sm text-gray-400 mt-1">Emisoras nacionales en directo con calidad cristalina.</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setTab('all')} className={`px-4 py-2 rounded-xl text-xs font-bold shadow ${tab === 'all' ? 'bg-zpink text-white' : 'bg-white/5 text-gray-400 hover:text-white'}`}>Todas</button>
                            <button onClick={() => setTab('favs')} className={`px-4 py-2 rounded-xl text-xs font-bold shadow ${tab === 'favs' ? 'bg-zpink text-white' : 'bg-white/5 text-gray-400 hover:text-white'}`}>Favoritas</button>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {list.map(station => {
                            const active = activeRadio?.id === station.id && isPlaying;
                            return (
                                <div key={station.id} onClick={() => onPlayStation(station)} className={`group glass-z rounded-2xl p-4 cursor-pointer hover:border-zpink transition-all flex items-center justify-between shadow-xl ${active ? 'border-zpink shadow-[0_0_20px_rgba(255,45,85,0.3)] bg-zpink/10' : ''}`}>
                                    <div className="flex items-center gap-3.5 min-w-0 flex-1 pr-2">
                                        <div className="w-14 h-14 rounded-xl overflow-hidden bg-black border border-white/10 relative flex items-center justify-center flex-shrink-0">
                                            <img src={station.image} alt={station.title} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x300/121420/ffffff?text=Radio'} />
                                            {active && (
                                                <div className="absolute inset-0 bg-zpink/30 flex items-center justify-center">
                                                    <LedEqualizer isPlaying={true} />
                                                </div>
                                            )}
                                        </div>
                                        <div className="min-w-0 flex-1">
                                            <h3 className="font-bold text-xs sm:text-sm text-white truncate">{station.title}</h3>
                                            <span className="text-[11px] text-gray-400 block truncate mt-0.5">{station.group}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 flex-shrink-0">
                                        {active && (
                                            <div className="flex items-center">
                                                <LedEqualizer isPlaying={true} />
                                            </div>
                                        )}
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center text-white bg-white/10 group-hover:bg-zpink transition-all shadow">
                                            <i className={`ph-fill ${active ? 'ph-pause' : 'ph-play ml-0.5 text-base'}`}></i>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const FavoritesSection = ({ favorites, onSelect, onToggleFav }) => (
            <div className="space-y-6 animate-z-fade">
                <div>
                    <h1 className="font-outfit text-2xl sm:text-3xl font-black text-white">Tus Favoritos</h1>
                    <p className="text-xs sm:text-sm text-gray-400 mt-1">Contenido guardado en tu dispositivo.</p>
                </div>
                {favorites.length === 0 ? (
                    <div className="text-center py-24 text-gray-400">
                        <i className="ph ph-heart-straight text-5xl mb-3 opacity-50"></i>
                        <p className="text-sm font-medium">No tienes favoritos guardados aún.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {favorites.map(item => (
                            <div key={item.id || item.title} onClick={() => onSelect(item)} className="glass-z rounded-2xl p-3 cursor-pointer hover:border-zpink transition-all relative shadow-xl">
                                <div className="aspect-[2/3] rounded-xl bg-black/80 overflow-hidden relative mb-2.5 flex items-center justify-center border border-white/10">
                                    <img src={item.image} alt={item.title} className="w-full h-full object-contain p-0" onError={(e) => e.target.src='https://placehold.co/300x450/121420/ff2d55?text=Magic'} />
                                    <button onClick={(e) => { e.stopPropagation(); onToggleFav(item); }} className="absolute top-2 right-2 p-1.5 rounded-full bg-black/70 text-white backdrop-blur-md shadow z-10">
                                        <i className={`ph-fill ph-heart-straight text-zpink`}></i>
                                    </button>
                                </div>
                                <h3 className="font-bold text-xs text-white truncate">{item.title}</h3>
                                <span className="text-[11px] text-gray-400 block mt-0.5 truncate">{item.group || 'Favorito'}</span>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const MediaViewer = ({ media, onBack }) => {
            const videoRef = useRef(null);
            const [selectedSeason, setSelectedSeason] = useState(0);
            const [selectedEpisode, setSelectedEpisode] = useState(
                media.seasons?.[0]?.episodes?.[0] || null
            );

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const targetUrl = (media.type === 'series' || media.type === 'animados') && selectedEpisode 
                    ? selectedEpisode.url 
                    : media.url;

                if (!targetUrl) return;

                if (targetUrl.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(targetUrl);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = targetUrl;
                    }
                } else {
                    video.src = targetUrl;
                }
            }, [media, selectedEpisode]);

            const isSeriesOrAnim = (media.type === 'series' || media.type === 'animados') && media.seasons && media.seasons.length > 0;
            const activeUrl = isSeriesOrAnim && selectedEpisode ? selectedEpisode.url : media.url;
            const isEmbed = activeUrl && (activeUrl.includes('drive.google.com') || activeUrl.includes('ok.ru'));

            return (
                <div className="space-y-6 animate-z-fade pb-32">
                    <button onClick={onBack} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-full glass-z hover:bg-white/10 text-white text-xs font-bold border border-white/20 transition-all shadow">
                        <i className="ph ph-arrow-left text-base"></i> Volver al Inicio
                    </button>

                    <div className="w-full aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl border border-white/10 relative">
                        {isEmbed ? (
                            <iframe 
                                src={activeUrl} 
                                className="w-full h-full border-0 absolute inset-0" 
                                allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
                                allowFullScreen
                            ></iframe>
                        ) : (
                            <video 
                                ref={videoRef}
                                controls 
                                autoPlay 
                                playsInline
                                className="w-full h-full object-contain"
                            ></video>
                        )}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 glass-z rounded-3xl p-6 sm:p-8 space-y-4 border border-white/10 shadow-xl">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <span className="px-3 py-1 rounded-full bg-zpink/20 text-zpink text-[11px] font-bold uppercase tracking-wider border border-zpink/30">{media.group || media.type}</span>
                                    {media.year && <span className="text-xs text-gray-400">{media.year}</span>}
                                </div>
                            </div>
                            <h1 className="font-outfit text-2xl sm:text-4xl font-black text-white">{media.title}</h1>
                            <p className="text-xs sm:text-sm text-gray-300 leading-relaxed">{media.description || media.sinopsis || "Disfruta de esta transmisión exclusiva en Magic TV 2.0."}</p>
                            
                            <div className="pt-2 flex items-center gap-3 bg-zpink/15 border border-zpink/30 px-4 py-3 rounded-2xl shadow-lg mt-4">
                                <i className="ph-fill ph-cast text-zpink text-xl animate-pulse-glow flex-shrink-0"></i>
                                <span className="text-xs sm:text-sm text-gray-200 font-medium leading-snug">
                                    💡 Recuerda que puedes transmitir y ver esta película en tu televisor usando <strong className="text-white font-bold underline decoration-zpink decoration-2">Smart View</strong>.
                                </span>
                            </div>
                        </div>

                        {isSeriesOrAnim && (
                            <div className="glass-z rounded-3xl p-6 space-y-4 border border-white/10 flex flex-col h-[420px] shadow-xl">
                                <h3 className="font-outfit font-bold text-sm text-white uppercase tracking-wider">Temporadas y Episodios</h3>
                                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                    {media.seasons.map((season, sIdx) => (
                                        <button 
                                            key={sIdx} 
                                            onClick={() => setSelectedSeason(sIdx)} 
                                            className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${selectedSeason === sIdx ? 'bg-zpink text-white shadow-md' : 'bg-white/5 text-gray-400 hover:text-white hover:bg-white/10'}`}
                                        >
                                            Temporada {season.seasonNumber}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                    {media.seasons[selectedSeason]?.episodes?.map((ep, eIdx) => (
                                        <div 
                                            key={eIdx} 
                                            onClick={() => setSelectedEpisode(ep)} 
                                            className={`p-3 rounded-xl cursor-pointer flex items-center justify-between text-xs transition-all ${selectedEpisode?.url === ep.url ? 'bg-zpink/25 text-white border border-zpink/50 shadow font-bold' : 'bg-white/5 hover:bg-white/10 text-gray-300'}`}
                                        >
                                            <div className="flex items-center gap-3 truncate">
                                                <span className="text-zpink font-bold">{eIdx + 1}.</span>
                                                <span className="truncate">{ep.title}</span>
                                            </div>
                                            <i className="ph-fill ph-play text-zpink text-sm"></i>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
