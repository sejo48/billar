<body>
    <!-- STREAMING_CHUNK:Initializing loading view... -->
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#111827;color:white;flex-direction:column;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:4px solid #E50914;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;"></div>
            <h2>Cargando MAGIS Tube Ultimate...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        // STREAMING_CHUNK:Setting up app environment and database handlers...
        const envConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        const firebaseConfig = JSON.parse(envConfig);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'magis-tube-local';

        let db = null; let auth = null; let currentUser = null;
        
        if (Object.keys(firebaseConfig).length > 0 && window.firebase) {
            try {
                const app = window.firebase.initializeApp(firebaseConfig);
                auth = window.firebase.auth();
                db = window.firebase.firestore();
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else { await auth.signInAnonymously(); }
                    } catch (e) { console.warn(e); }
                };
                initAuth();
                auth.onAuthStateChanged((user) => { currentUser = user; });
            } catch (e) { console.warn(e); }
        }

        window.DB_API = {
            saveVisitor: async (name) => {
                if (!name) return;
                if (db && auth && currentUser) {
                    try {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('app_visitors').add({
                            name: name,
                            timestamp: window.firebase.firestore.FieldValue.serverTimestamp(),
                            uid: currentUser.uid
                        });
                        return;
                    } catch (e) {}
                }
                try {
                    const localData = JSON.parse(localStorage.getItem('magis_local_visitors') || '[]');
                    const isDuplicate = localData.some(v => v.name === name && (Date.now()/1000 - (v.timestamp?.seconds || 0)) < 60);
                    if (!isDuplicate) {
                        localData.push({ name: name, timestamp: { seconds: Date.now() / 1000 }, uid: 'local-user' });
                        localStorage.setItem('magis_local_visitors', JSON.stringify(localData));
                    }
                } catch (e) {}
            },
            subscribeToVisitors: (callback) => {
                if (db) {
                    try {
                        return db.collection('artifacts').doc(appId).collection('public').doc('data').collection('app_visitors')
                            .onSnapshot((snapshot) => {
                                const visitors = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                visitors.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                                callback(visitors);
                            }, () => { loadLocal(callback); });
                    } catch (e) { loadLocal(callback); }
                } else { loadLocal(callback); }
                return () => {}; 
            }
        };

        function loadLocal(callback) {
            try {
                const localData = JSON.parse(localStorage.getItem('magis_local_visitors') || '[]');
                localData.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                callback(localData);
            } catch(e) { callback([]); }
        }

        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const NTFY_TOPIC = 'magistube_jorge_avisos'; 

        const URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/retrom3u/refs/heads/main/listaoficial.m3u',
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/animados./refs/heads/main/animados.json'
        };

        // Función infalible para convertir cualquier enlace de Google Drive en un reproductor de vista previa limpio y directo
        const cleanDriveUrl = (url) => { 
            if (!url) return ''; 
            if (url.includes('drive.google.com')) { 
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match) {
                    return `https://drive.google.com/file/d/${match[1]}/preview?usp=sharing&rm=minimal&autoplay=1`;
                }
            } 
            return url; 
        };

        // Lista de películas suministrada directamente por el usuario
        const STATIC_MOVIES = [
            { "titulo": "1923 - El Hombre Mosca", "descripcion": "Un joven de campo recién llegado a la ciudad debe tratar de escalar un edificio de 12 pisos, cuando su plan para ganar dinero acaba resultando contraproducente.", "imagen": "https://m.media-amazon.com/images/M/MV5BM2EzYzA2NTgtODQzYy00N2UwLWE0ZGYtMDU3YmYwZTFlOTA5XkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1y9OJY2Se0PJdiUjIL-fcA32TszqwDaRd/view?usp=sharing", "codigo": null },
            { "titulo": "La Laguna Azul (1980)", "descripcion": "Dos niños que sobreviven a un naufragio, llegan a una isla tropical y con el paso de los años, crecen y se enamoran.", "imagen": "https://m.media-amazon.com/images/M/MV5BMTQ4ZjJlMjktYzA4My00MzJjLWIxNTAtZjhjYWQwYmNlNjE3XkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1eSZglGEJgj_lQtBkuC4FrnywqLFJUTvG/view?usp=sharing", "codigo": "8384" },
            { "titulo": "Caligula (1979)", "descripcion": "Fue producida por la revista para adultos \"Penthouse\". Se trata de un drama de muy alto contenido erótico que narra el ascenso y caída del emperador romano Calígula...", "imagen": "https://m.media-amazon.com/images/M/MV5BYjllZjhiZWUtMTM1OC00YWJkLWJkOWUtMWZlNzBhNjM2M2QxXkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1ITEdxgIrOSNHTCjUgqAFnsIiVRl_sm1G/view?usp=sharing", "codigo": "8384" },
            { "titulo": "Tiburón 1975", "descripcion": "En la costa de un pequeño pueblo del este de Estados Unidos, un enorme tiburón blanco ataca a varias personas.", "imagen": "https://m.media-amazon.com/images/S/pv-target-images/db9eb3024ee3109c0345bdac8575df43989b81e457d26ab7895dbadee66a2b99.jpg", "urlDrive": "https://drive.google.com/file/d/1tGa2AjZYx8neW6e6z5wgc-zC5g0geQkP/view?usp=sharing", "codigo": null },
            { "titulo": "Naranja mecánica (1971)", "descripcion": "Gran Bretaña, en un futuro indeterminado. Alex es un joven muy agresivo que tiene dos pasiones: la violencia desaforada y Beethoven.", "imagen": "https://m.media-amazon.com/images/M/MV5BYjFiN2E5N2ItZjc1Yy00MzZmLThmZGQtNGIyYjljMzk1NmU4XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", "urlDrive": "https://drive.google.com/file/d/1ZJ2L0x5EzI3_lJ3c13Q2hBRNa5Askza2/view?usp=sharing", "codigo": "8384" },
            { "titulo": "Machete", "descripcion": "Machete es un ex federal mexicano que posee extraordinarias habilidades.", "imagen": "https://m.media-amazon.com/images/M/MV5BZTY0OTZmYTMtMjhmOC00NzM3LTk2Y2MtMDg1ODNlOTkyNTcwXkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1oB1Um9GJK8mM2apNqa9tFgNtVY1H5RyI/view?usp=sharing", "codigo": null },
            { "titulo": "La mosca (1986)", "descripcion": "Un científico se utiliza a sí mismo como cobaya en la realización de un complejo experimento de teletransportación.", "imagen": "https://image.tmdb.org/t/p/original/mmJLkVX8CVRFVFnfRvjirzX16Oy.jpg", "urlDrive": "https://drive.google.com/file/d/1fJbsO9h6AnXf653IWHEilv249BugOPKD/view?usp=sharing", "codigo": null },
            { "titulo": "Escalofríos (Pesadillas) Cap No Te Duermas", "descripcion": "Constituida como una serie antológica de terror dirigida a la audiencia juvenil e infantil.", "imagen": "https://m.media-amazon.com/images/M/MV5BMmY0YzU1M2QtYjdiYy00M2QzLTk3OTEtNzI1YjAxNTA4ZmEyXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", "urlDrive": "https://drive.google.com/file/d/10YWg29ZGYITqsp2vZqXJIJ7kP38LNllT/view?usp=sharing", "codigo": null },
            { "titulo": "Volver al Futuro III", "descripcion": "Aventura en el lejano oeste con Marty y Doc.", "imagen": "https://es.web.img3.acsta.net/c_310_420/pictures/14/04/28/11/11/012699.jpg", "urlDrive": "https://drive.google.com/file/d/1jgTK5lvRCQSMIDX9qggCb1ljXnjBMB9_/view?usp=sharing", "codigo": null },
            { "titulo": "Regreso al futuro II", "descripcion": "Viajes al futuro con la máquina del tiempo de Doc.", "imagen": "https://es.web.img3.acsta.net/pictures/14/04/03/13/45/034916.jpg", "urlDrive": "https://drive.google.com/file/d/15Ry4HLCGMQHr50JMtv2Ar3QgmJ2D9a_q/view?usp=sharing", "codigo": null },
            { "titulo": "Volver al futuro (1985)", "descripcion": "El inicio de la gran aventura en 1955.", "imagen": "https://mx.web.img3.acsta.net/pictures/18/06/19/03/59/0330518.jpg", "urlDrive": "https://drive.google.com/file/d/1q82yUlxny8geuVOIzXPbjc51O4WcBMsO/view?usp=sharing", "codigo": null },
            { "titulo": "Beethoven", "descripcion": "Las divertidas travesuras de un adorable San Bernardo.", "imagen": "https://m.media-amazon.com/images/S/pv-target-images/ea33ee6c4e992664576e028c27e07c28600a91c9d996a6cc2fae0aafc578e0a4.jpg", "urlDrive": "https://drive.google.com/file/d/1KFZ3glXggcoAUYnyimY4f1lOGenhVwkC/view?usp=sharing", "codigo": null },
            { "titulo": "Misión Imposible ( 1966 )", "descripcion": "Un clásico de la televisión con la Fuerza de Misiones Imposibles.", "imagen": "https://s3.opensubtitles.com/features/4/0/2/8204.jpg", "urlDrive": "https://drive.google.com/file/d/15h74amMWOgxKqoCdsXl80ibEF7z2cw99/view?usp=sharing", "codigo": null }
        ];

        // STREAMING_CHUNK:Rendering SVG Icon library...
        const Icon = ({ name, size = 22, className, fill = "none" }) => {
            const icons = {
                search: <path d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 111.414-1.414 7.5 7.5 0 01-1.414 1.414z" />,
                x: <path d="M6 18L18 6M6 6l12 12" />,
                tv: <path d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />,
                film: <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />,
                arrowLeft: <path d="M19 12H5m7 7l-7-7 7-7" />,
                chevronDown: <path d="M6 9l6 6 6-6" />,
                chevronUp: <path d="M18 15l-6-6-6 6" />,
                clapperboard: <g><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.3 1.3-2.8l3.2-1.4c1.1-.5 2.3.2 2.8 1.3l.9 2.4l7.9-3l2 4.5Z"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></g>,
                lock: <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a7 7 0 00-14 0v2" />,
                share: <g><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></g>,
                bell: <path d="M12.02 2.909c-.381 0-.743.088-1.076.246a4.78 4.78 0 0 1 .589 2.228v2.793a4.33 4.33 0 0 1-1.285 3.05 4.33 4.33 0 0 1-3.05 1.285H4.209a2.33 2.33 0 0 0-2.33 2.33v.033c0 1.285 1.045 2.33 2.33 2.33h15.582a2.33 2.33 0 0 0 2.33-2.33V14.84c0-1.285-1.045-2.33-2.33-2.33h-2.989a4.33 4.33 0 0 1-3.05-1.285 4.33 4.33 0 0 1-1.285-3.05V5.383a4.81 4.81 0 0 1 .585-2.23 2.5 2.5 0 0 0-1.032-.244zm-2.02 16.59h4a2 2 0 0 1-4 0z" />,
                users: <g><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></g>,
                crown: <g><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/></g>,
                smile: <g><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.search}
                </svg>
            );
        };

        // STREAMING_CHUNK:Rendering modal panels...
        const UserListModal = ({ onClose }) => {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            useEffect(() => { const unsubscribe = window.DB_API?.subscribeToVisitors((data) => { setUsers(data); setLoading(false); }); return () => unsubscribe && unsubscribe(); }, []);
            return (
                <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-[#1f2937] w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl border border-white/10" onClick={e => e.stopPropagation()}>
                        <div className="p-4 bg-gradient-to-r from-blue-900/50 to-[#1f2937] border-b border-white/10 flex justify-between items-center">
                            <h3 className="font-bold text-white flex items-center gap-2"><Icon name="users" size={18} className="text-blue-400"/> Libro de Visitas</h3>
                            <button onClick={onClose}><Icon name="x" size={18} className="text-gray-400"/></button>
                        </div>
                        <div className="p-0 max-h-[60vh] overflow-y-auto custom-scrollbar">
                            {loading ? (<div className="p-8 text-center text-gray-500 text-sm">Cargando...</div>) : users.length === 0 ? (<div className="p-8 text-center text-gray-500 text-sm">Nadie ha firmado aún.</div>) : (
                                <table className="w-full text-xs text-left">
                                    <thead className="text-[10px] text-gray-400 uppercase bg-black/20"><tr><th className="px-4 py-2.5">Nombre</th><th className="px-4 py-2.5 text-right">Fecha</th></tr></thead>
                                    <tbody className="divide-y divide-white/5">
                                        {users.map((u, i) => (
                                            <tr key={i} className="hover:bg-white/5">
                                                <td className="px-4 py-2.5 font-medium text-white">{u.name}</td>
                                                <td className="px-4 py-2.5 text-right text-gray-500">{u.timestamp ? new Date(u.timestamp.seconds * 1000).toLocaleDateString() : 'Reciente'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminModal = ({ onClose, onSent }) => {
            const [title, setTitle] = useState('');
            const [message, setMessage] = useState('');
            const [type, setType] = useState('default');
            const [sending, setSending] = useState(false);
            const [successMsg, setSuccessMsg] = useState(false);

            const handleSend = async (e) => {
                e.preventDefault();
                setSending(true);
                let tags = [];
                if (type === 'success') tags.push('success');
                if (type === 'alert') tags.push('warning');
                try {
                    await fetch(`https://ntfy.sh/${NTFY_TOPIC}?t=${Date.now()}`, {
                        method: 'POST', body: message, headers: { 'Title': title, 'Tags': tags.join(',') }
                    });
                    if(onSent) onSent(); 
                    setSuccessMsg(true);
                    setTimeout(() => { setSuccessMsg(false); onClose(); }, 2000);
                } catch (e) {} finally { setSending(false); }
            };

            return (
                <div className="fixed inset-0 z-[70] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-[#1f2937] p-5 rounded-2xl max-w-xs w-full border border-white/10 relative" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" size={20} /></button>
                        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Icon name="crown" size={20} className="text-[#E50914]"/> Enviar Aviso</h3>
                        {successMsg ? (
                            <div className="py-6 text-center animate-fade-in"><h4 className="text-sm font-bold text-white">Notificación enviada</h4></div>
                        ) : (
                            <form onSubmit={handleSend} className="space-y-3">
                                <div><label className="block text-[10px] text-gray-400 mb-1 uppercase font-bold">Título</label><input type="text" className="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] outline-none" value={title} onChange={e => setTitle(e.target.value)} required /></div>
                                <div><label className="block text-[10px] text-gray-400 mb-1 uppercase font-bold">Mensaje</label><textarea className="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] outline-none h-20 resize-none" value={message} onChange={e => setMessage(e.target.value)} required></textarea></div>
                                <div><label className="block text-[10px] text-gray-400 mb-1 uppercase font-bold">Tipo</label><select className="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none" value={type} onChange={e => setType(e.target.value)}><option value="default">Información</option><option value="success">Éxito</option><option value="alert">Alerta</option></select></div>
                                <button type="submit" disabled={sending} className="w-full bg-[#E50914] hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors disabled:opacity-50">{sending ? 'Enviando...' : 'Enviar a Todos'}</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const LockScreen = ({ onUnlock, correctCode, onCancel }) => {
            const [input, setInput] = useState(''); const [error, setError] = useState(false);
            const handleSubmit = (e) => { e.preventDefault(); if (input === String(correctCode)) onUnlock(); else { setError(true); setInput(''); } };
            return (<div className="absolute inset-0 z-50 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 animate-fade-in"><div className="bg-[#1f2937] p-6 rounded-xl max-w-xs w-full text-center border border-white/10 shadow-2xl"><div className="mb-4 flex justify-center"><div className="p-3 bg-red-500/20 rounded-full text-red-500 border border-red-500/30"><Icon name="lock" size={28} /></div></div><h2 className="text-base font-bold text-white mb-2">Contenido Protegido</h2><form onSubmit={handleSubmit}><input type="password" maxLength="4" className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-2.5 text-center text-xl tracking-[0.4em] text-white focus:border-[#E50914] outline-none mb-3" value={input} onChange={(e) => { setInput(e.target.value); setError(false); }} placeholder="••••" autoFocus />{error && <p className="text-red-500 text-xs mb-3 font-bold">Código incorrecto</p>}<div className="flex gap-2"><button type="button" onClick={onCancel} className="flex-1 py-2 rounded-lg border border-white/10 text-gray-300 hover:bg-white/5 text-xs">Cancelar</button><button type="submit" className="flex-1 py-2 rounded-lg bg-[#E50914] text-white font-bold hover:bg-red-700 text-xs">Acceder</button></div></form></div></div>);
        };

        const QRModal = ({ onClose }) => { const currentUrl = window.location.href; const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(currentUrl)}`; return (<div className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={onClose}><div className="bg-white p-5 rounded-2xl max-w-xs w-full text-center relative" onClick={e => e.stopPropagation()}><button onClick={onClose} className="absolute top-3 right-3 text-gray-400 hover:text-black"><Icon name="x" size={20} stroke="currentColor" /></button><h3 className="text-lg font-bold text-black mb-2">¡Comparte la App!</h3><div className="bg-white p-2 rounded-lg shadow-inner border border-gray-200 inline-block mb-2"><img src={qrUrl} className="w-40 h-40 object-contain mx-auto" /></div></div></div>); };
        
        const NotificationsModal = ({ onClose, items, loading }) => (
            <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-start justify-end p-0 animate-fade-in" onClick={onClose}>
                <div className="h-full w-full sm:w-80 bg-[#1f2937] border-l border-white/10 shadow-2xl p-5 overflow-y-auto" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center mb-6"><h2 className="text-lg font-bold text-white flex items-center gap-2"><Icon name="bell" size={20} className="text-[#E50914]"/> Novedades</h2><button onClick={onClose} className="p-1.5 bg-black/20 rounded-full text-gray-400 hover:text-white"><Icon name="x" size={18}/></button></div>
                    <div className="space-y-3">{loading ? <p className="text-gray-500 text-center py-8 text-xs">Cargando...</p> : items.length === 0 ? <p className="text-gray-500 text-center py-8 text-xs">No hay avisos.</p> : items.map(note => (<div key={note.id} className="bg-black/40 border border-white/5 rounded-xl p-3"><div className="flex justify-between items-start mb-1"><span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400">{note.date}</span></div><h3 className="font-bold text-white text-xs mb-1">{note.title}</h3><p className="text-xs text-gray-400">{note.message}</p></div>))}</div>
                </div>
            </div>
        );

        const IntroScreen = ({ onEnter }) => (
            <div className="fixed inset-0 z-[100] bg-[#111827] flex items-center justify-center overflow-hidden font-sans p-4">
                <div className="absolute inset-0"><img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1000&auto=format&fit=crop" className="w-full h-full object-cover opacity-10" /><div className="absolute inset-0 bg-gradient-to-b from-[#111827] via-[#111827]/90 to-[#111827]"></div></div>
                <div className="relative z-10 text-center max-w-sm w-full animate-slide-up">
                    <div className="mb-3 inline-block bg-[#E50914] px-2.5 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase text-white">Premium Access</div>
                    <h1 className="text-5xl font-black text-white mb-2 tracking-tighter">MAGIS<span className="text-[#E50914]">Tube</span></h1>
                    <p className="text-sm text-gray-400 font-light mb-6 italic">"Donde la nostalgia se encuentra con la tecnología."</p>
                    <button onClick={onEnter} className="w-full bg-white text-black py-3.5 rounded-full font-bold text-base shadow-lg flex items-center justify-center gap-2 mb-8 active:scale-95 transition-transform"><span>Comenzar a Ver</span> <Icon name="play" size={18} fill="black" /></button>
                    <div className="opacity-80"><p className="text-[9px] text-gray-500 uppercase tracking-widest mb-0.5">DISEÑADO Y PROGRAMADO POR</p><h3 className="text-base font-serif text-gold-gradient font-bold mb-1">JORGE ARTURO HERNÁNDEZ MÉNDEZ</h3><p className="text-[9px] text-gray-600">Potenciado por <span className="text-blue-400">Gemini AI</span></p></div>
                </div>
            </div>
        );

        const HeroSection = ({ item, onPlay, isFavorite, onToggleFavorite }) => {
            if (!item) return null;
            return (
                <div className="relative w-full h-[40vh] sm:h-[50vh] overflow-hidden mb-6 group animate-fade-in">
                    <div className="absolute inset-0">
                        <img src={item.image || item.poster} alt="Hero" className="w-full h-full object-cover opacity-50" onError={(e) => e.target.src = 'https://placehold.co/800x600/111827/ffffff?text=Stream'} />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#111827] via-[#111827]/30 to-transparent"></div>
                    </div>
                    <div className="absolute inset-0 flex items-end p-4 sm:p-8 max-w-7xl mx-auto">
                        <div className="flex flex-col gap-2 items-start w-full">
                            <span className="bg-[#E50914] text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Película Destacada</span>

                            <p className="text-gray-300 text-xs sm:text-sm max-w-lg line-clamp-2">{item.description || item.plot || "Disfruta del mejor contenido seleccionado para ti."}</p>
                            <div className="flex gap-3 mt-2 w-full sm:w-auto">
                                <button onClick={() => onPlay(item)} className="flex-1 sm:flex-none bg-white text-black px-6 py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition-transform"><Icon name="play" size={16} fill="black"/> Reproducir</button>
                                <button onClick={() => onToggleFavorite(item)} className="bg-white/10 text-white p-2.5 rounded-lg flex items-center justify-center backdrop-blur-sm border border-white/10"><Icon name="heart" size={18} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : "text-white"} fill={isFavorite ? "#E50914" : "none"} /></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TvListItem = ({ channel, isActive, onClick, isFavorite, onToggleFavorite }) => (
            <div tabIndex="0" onClick={() => onClick(channel)} className={`group flex items-center gap-3 p-3 border-b border-white/5 cursor-pointer transition-colors ${isActive ? 'bg-[#1f2937] border-l-4 border-l-[#E50914]' : 'hover:bg-white/5'}`} > 
                <div className="w-10 h-7 rounded bg-black flex items-center justify-center overflow-hidden flex-shrink-0 border border-white/10"> 
                    {channel.image ? ( <img src={channel.image} alt={channel.title} loading="lazy" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} /> ) : ( <Icon name="tv" size={14} className="text-gray-400"/> )} 
                </div> 
                <div className="flex-1 min-w-0"> 
                    <p className={`text-xs sm:text-sm font-medium truncate ${isActive ? 'text-[#E50914]' : 'text-white'}`}>{channel.title}</p> 
                    <p className="text-[10px] text-gray-500 truncate">{channel.group || 'General'}</p> 
                </div> 
                <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(channel); }} className="p-2 rounded-full text-gray-400 hover:text-white"> 
                    <Icon name="heart" size={16} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : ""} fill={isFavorite ? "#E50914" : "none"} /> 
                </button> 
            </div> 
        );

        const Card = ({ item, onClick, isFavorite, onToggleFavorite }) => { 
            const isTv = item.type === 'tv'; 
            const hasLock = item.codigo || item.password || item.pin || item.clave; 
            const isKids = item.isKids;
            return ( 
                <div tabIndex="0" className="group relative flex flex-col gap-1.5 cursor-pointer active:scale-95 transition-transform" onClick={() => onClick(item)}> 
                    <div className={`relative overflow-hidden rounded-lg bg-[#1f2937] shadow-md ${isTv ? 'aspect-video' : 'aspect-[2/3]'}`}> 
                        <img src={item.image || item.poster || item.logo} loading="lazy" className={`w-full h-full ${isTv ? 'object-contain p-3' : 'object-cover'}`} onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/300x450/1f2937/ffffff?text=X`; }} alt={item.title || item.name} /> 
                        <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(item); }} className="absolute top-1.5 right-1.5 p-1.5 bg-black/60 rounded-full text-white"> 
                            <Icon name="heart" size={14} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : ""} fill={isFavorite ? "#E50914" : "none"} /> 
                        </button> 
                        <div className="absolute bottom-1.5 left-1.5 flex gap-1"> 
                            {isTv && <span className="bg-[#E50914] text-white text-[8px] font-bold px-1.5 py-0.5 rounded">LIVE</span>} 
                            {isKids && <span className="bg-blue-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded">KIDS</span>}
                            {hasLock && <span className="bg-yellow-500 text-black text-[8px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5"><Icon name="lock" size={7}/> PIN</span>} 
                        </div> 
                    </div> 
                    <h3 className="text-xs font-bold text-gray-200 truncate">{item.title || item.name}</h3> 
                </div> 
            ); 
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [showQR, setShowQR] = useState(false);
            const [showNotif, setShowNotif] = useState(false);
            const [showUserList, setShowUserList] = useState(false);
            const [showAdmin, setShowAdmin] = useState(false); 
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], animados: [] });
            const [search, setSearch] = useState('');
            const [notifications, setNotifications] = useState([]);
            const [notifLoading, setNotifLoading] = useState(true);
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false); 
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);

            const fetchNotifs = async () => {
                setNotifLoading(true);
                try {
                    const res = await fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=all&t=${Date.now()}`);
                    const text = await res.text();
                    const lines = text.trim().split('\n');
                    const parsed = lines.map((line, idx) => {
                        try {
                            const d = JSON.parse(line);
                            if(d.event !== 'message') return null;
                            return { id: d.id || idx, date: new Date(d.time * 1000).toLocaleDateString('es-ES', {day: 'numeric', month: 'short'}), title: d.title || 'Aviso', message: d.message, type: 'info' };
                        } catch(e) { return null; }
                    }).filter(Boolean).reverse();
                    setNotifications(parsed);
                } catch (e) {} finally { setNotifLoading(false); }
            };

            useEffect(() => { fetchNotifs(); }, []);

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo, group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            useEffect(() => {
                const init = async () => {
                    if (window.DB_API && window.DB_API.saveVisitor) window.DB_API.saveVisitor('Visitante');
                    try {
                        setLoading(true);
                        const [resTV, resAnimados] = await Promise.all([ 
                            fetch(URLS.TV), fetch(URLS.ANIMADOS).catch(() => ({ text: () => '[]' })) 
                        ]);
                        const textTV = await resTV.text(); 
                        const jsonAnimados = safeParseJSON(await resAnimados.text(), []);
                        
                        const tvChannels = parseM3U(textTV);
                        
                        // Procesar las películas estáticas utilizando el limpiador de URLs de Drive
                        const moviesList = STATIC_MOVIES.map((m, idx) => ({
                            id: `mov-${idx}`,
                            ...m,
                            type: 'movie',
                            url: cleanDriveUrl(m.urlDrive)
                        }));

                        const animadosList = (Array.isArray(jsonAnimados) ? jsonAnimados : []).map((a, i) => {
                            const hasSeasons = a.temporadas && a.temporadas.length > 0;
                            return {
                                id: `anim-${i}`,
                                title: a.titulo || a.tituloSerie || a.name,
                                description: a.descripcion || a.sinopsis,
                                image: a.imagen || a.image || a.poster,
                                type: hasSeasons ? 'series' : 'movie',
                                isKids: true,
                                codigo: a.codigo || a.pin,
                                url: cleanDriveUrl(a.urlDrive || a.url),
                                seasons: hasSeasons ? a.temporadas.map(t => ({ season_number: t.numeroTemporada || 1, episodes: (t.episodios || []).map(e => ({ title: e.tituloEpisodio || e.title, url: cleanDriveUrl(e.urlDrive || e.url), image: a.imagen })) })) : []
                            };
                        });

                        setContent({ tv: tvChannels, series: [], movies: moviesList, animados: animadosList });
                    } catch (err) { } finally { setLoading(false); }
                };

                const storedFavs = safeStorage.getItem('magistube_favs'); if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                init();
            }, []);

            const safeParseJSON = (text, fallback) => {
                if (!text || text.trim() === '') return fallback;
                try { return JSON.parse(text); } 
                catch (e) {
                    try { return JSON.parse(text.replace(/,\s*([\]}])/g, '$1')); } 
                    catch (e2) { return fallback; }
                }
            };

            const toggleFavorite = (item) => { const itemId = item.id || item.titulo || item.title; const newFavs = favorites.some(f => (f.id || f.titulo || f.title) === itemId) ? favorites.filter(f => (f.id || f.titulo || f.title) !== itemId) : [item, ...favorites]; setFavorites(newFavs); safeStorage.setItem('magistube_favs', JSON.stringify(newFavs)); };
            const handlePlay = (item) => { 
                const code = item.codigo || item.password || item.pin || item.clave; 
                if (code) { setSelectedItem(item); setIsLocked(true); } 
                else { setSelectedItem(item); setIsLocked(false); } 
                setExpandedSeason(0); 
                if (item.type === 'series') setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null); 
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' ? [...content.movies, ...content.animados, ...content.tv.slice(0,20)] : activeTab === 'favorites' ? favorites : content[activeTab] || []; 
                if (search) return list.filter(i => (i.titulo || i.title || i.name).toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            const heroItem = useMemo(() => (content.movies.length ? content.movies[Math.floor(Math.random() * content.movies.length)] : null), [content]);

            if (showIntro) return <IntroScreen onEnter={() => { setShowIntro(false); if(window.DB_API) window.DB_API.saveVisitor('Visitante'); }} />;

            return (
                <div className="min-h-screen bg-[#111827] text-white font-sans flex flex-col md:flex-row relative">
                    <aside className="hidden md:flex w-20 flex-col items-center py-6 bg-[#0f1115] border-r border-[#1f2937] fixed h-full z-50">
                        <div className="mb-8 p-2 bg-[#E50914] rounded-lg shadow-lg cursor-pointer" onClick={() => {setActiveTab('home'); setSelectedItem(null); setIsLocked(false);}}><Icon name="play" size={22} fill="white" className="text-white"/></div>
                        <div className="flex flex-col gap-6 w-full">
                            {[
                                { id: 'home', icon: 'search', label: 'Inicio' }, 
                                { id: 'animados', icon: 'smile', label: 'Animados' },
                                { id: 'movies', icon: 'clapperboard', label: 'Cine' }, 
                                { id: 'tv', icon: 'tv', label: 'TV' }, 
                                { id: 'favorites', icon: 'heart', label: 'Favs' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setSearch(''); setIsLocked(false); }} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === tab.id ? 'text-[#E50914]' : 'text-gray-500 hover:text-white'}`}>
                                    <Icon name={tab.icon} size={22} fill={activeTab === tab.id && tab.id === 'favorites' ? 'currentColor' : 'none'} className={activeTab === tab.id && tab.id === 'favorites' ? 'fill-current' : ''} /><span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            ))}
                            <button onClick={() => setShowUserList(true)} className="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors"><Icon name="users" size={22} /><span className="text-[10px] font-medium">Usuarios</span></button>
                        </div>
                        <div className="mt-auto flex flex-col items-center gap-4 mb-4 relative w-full">
                            <button onClick={() => setShowAdmin(true)} className="text-[#E50914] hover:text-white transition-colors relative" title="Admin"><Icon name="crown" size={18} /></button>
                            <button onClick={() => setShowNotif(true)} className="text-gray-500 hover:text-white transition-colors relative" title="Novedades"><Icon name="bell" size={18} />{notifications.length > 0 && <span className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>}</button>
                            <button onClick={() => setShowQR(true)} className="flex flex-col items-center gap-1 text-blue-400 hover:text-white transition-colors mb-2" title="Compartir App"><Icon name="share" size={18} /><span className="text-[9px]">QR</span></button>
                            <div className="w-7 h-7 rounded-full bg-gradient-to-tr from-yellow-400 to-yellow-600 flex items-center justify-center font-serif font-bold text-black text-xs border border-white/20">J</div>
                        </div>
                    </aside>

                    <div className="md:hidden fixed top-0 w-full bg-[#111827]/95 backdrop-blur z-50 px-4 py-3 flex items-center justify-between border-b border-[#1f2937]">
                        <div className="flex items-center gap-2 font-black text-lg tracking-tighter"><span className="text-[#E50914]">MAGIS</span> TUBE</div>
                        <div className="flex gap-2.5 items-center">
                            <button onClick={() => setShowAdmin(true)} className="text-[#E50914]"><Icon name="crown" size={20} /></button>
                            <button onClick={() => setShowUserList(true)} className="text-gray-300"><Icon name="users" size={20} /></button>
                            <button onClick={() => setShowNotif(true)} className="text-gray-300 relative"><Icon name="bell" size={20} />{notifications.length > 0 && <span className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full border border-[#111827]"></span>}</button>
                            <button onClick={() => setShowQR(true)} className="text-blue-400 bg-blue-400/10 p-1.5 rounded-full border border-blue-400/20"><Icon name="share" size={16} /></button>
                        </div>
                    </div>

                    <div className="md:hidden fixed bottom-0 w-full bg-[#0f1115] border-t border-[#1f2937] z-50 flex justify-around py-2.5 pb-safe">
                        {[
                            { id: 'home', icon: 'search', label: 'Inicio' }, 
                            { id: 'animados', icon: 'smile', label: 'Anim' },
                            { id: 'movies', icon: 'clapperboard', label: 'Cine' }, 
                            { id: 'tv', icon: 'tv', label: 'TV' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setIsLocked(false); }} className={`flex flex-col items-center gap-0.5 ${activeTab === tab.id ? 'text-[#E50914]' : 'text-gray-500'}`}>
                                <Icon name={tab.icon} size={20} /><span className="text-[9px] font-medium">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    {showUserList && <UserListModal onClose={() => setShowUserList(false)} />}
                    {showQR && <QRModal onClose={() => setShowQR(false)} />}
                    {showNotif && <NotificationsModal onClose={() => setShowNotif(false)} items={notifications} loading={notifLoading} />}
                    {showAdmin && <AdminModal onClose={() => setShowAdmin(false)} onSent={fetchNotifs} />}

                    <main className="flex-1 md:ml-20 min-h-screen pt-14 md:pt-0 pb-20 md:pb-0 relative z-10">
                        {activeTab === 'favorites' && !selectedItem ? (
                            <div className="p-4 sm:p-8 animate-fade-in">
                                <div className="mb-6 flex items-center gap-3 border-b border-white/10 pb-3">
                                    <div className="p-2 bg-[#E50914]/20 rounded-lg text-[#E50914]"><Icon name="heart" size={20} fill="currentColor" /></div>
                                    <h2 className="text-xl font-bold text-white">Tus Favoritos</h2>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
                                    {favorites.map((item, i) => (<Card key={i} item={item} onClick={handlePlay} isFavorite={true} onToggleFavorite={toggleFavorite} />))}
                                </div>
                                {favorites.length === 0 && <div className="text-center py-20 text-gray-500 text-sm"><p>No tienes favoritos guardados aún.</p></div>}
                            </div>
                        ) : activeTab === 'tv' || (selectedItem && selectedItem.type === 'tv') ? (
                            <div className="flex flex-col lg:flex-row h-full lg:h-screen lg:overflow-hidden">
                                <div className="flex-1 bg-[#111827] relative flex flex-col lg:h-full">
                                    {selectedItem && selectedItem.type === 'tv' ? (
                                        <div className="relative aspect-video w-full bg-[#111827] lg:flex-1 overflow-hidden flex items-center justify-center">
                                            <button onClick={() => setSelectedItem(null)} className="absolute top-3 left-3 z-30 bg-black/60 p-2 rounded-full text-white lg:hidden"><Icon name="arrowLeft" size={18} /></button>
                                            <iframe src={selectedItem.url} className="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                        </div>
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-gray-500 text-sm"><p>Selecciona un canal de TV</p></div>
                                    )}
                                </div>
                                <div className="w-full lg:w-80 bg-[#111827] lg:border-l border-white/10 flex flex-col lg:h-full lg:overflow-hidden">
                                    <div className="p-3 sticky top-14 lg:top-0 bg-[#111827] z-20 border-b border-white/5">
                                        <div className="relative"><input type="text" placeholder="Buscar canal..." className="w-full bg-[#1f2937] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:border-[#E50914] outline-none pl-9" value={search} onChange={(e) => setSearch(e.target.value)}/><Icon name="search" size={16} className="absolute left-3 top-2.5 text-gray-400"/></div>
                                    </div>
                                    <div className="p-2 space-y-1 lg:overflow-y-auto lg:h-full">
                                        {content.tv.filter(c => !search || c.title.toLowerCase().includes(search.toLowerCase())).map(channel => (
                                            <TvListItem key={channel.id} channel={channel} isActive={selectedItem?.id === channel.id} isFavorite={favorites.some(f => f.id === channel.id)} onToggleFavorite={toggleFavorite} onClick={handlePlay} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : selectedItem ? (
                            <div className="animate-fade-in">
                                <div className="w-full bg-[#111827] relative aspect-video md:h-[65vh] flex items-center justify-center overflow-hidden">
                                    <div className="absolute top-3 left-3 z-30">
                                        <button onClick={() => {setSelectedItem(null); setIsLocked(false);}} className="bg-black/60 hover:bg-[#E50914] text-white px-3.5 py-1.5 rounded-full backdrop-blur-md flex items-center gap-1.5 text-xs transition-colors border border-white/10">
                                            <Icon name="arrowLeft" size={16} /> <span>Volver</span>
                                        </button>
                                    </div>
                                    {isLocked ? (
                                        <LockScreen correctCode={selectedItem.codigo || selectedItem.password || selectedItem.pin || selectedItem.clave} onUnlock={() => setIsLocked(false)} onCancel={() => {setSelectedItem(null); setIsLocked(false);}} />
                                    ) : (
                                        <div className="iframe-container">
                                            <iframe src={selectedItem.type === 'series' && selectedEpisode ? selectedEpisode.url : selectedItem.url} allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                        </div>
                                    )}
                                </div>
                                {!isLocked && (
                                    <div className="p-4 sm:p-8 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-2">
                                            <div className="flex items-start justify-between mb-3">
                                                <div>
                                                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-1">{selectedItem.titulo || selectedItem.title || selectedItem.name}</h1>
                                                    <div className="flex items-center gap-2.5 text-xs text-gray-400">
                                                        <span className="bg-[#1f2937] px-2 py-0.5 rounded text-white">{selectedItem.type.toUpperCase()}</span>
                                                        {selectedItem.type === 'series' && selectedEpisode && <span className="text-[#E50914] font-medium">{selectedEpisode.title}</span>}
                                                    </div>
                                                </div>
                                                <button onClick={() => toggleFavorite(selectedItem)} className="p-2.5 bg-[#1f2937] rounded-full hover:bg-[#2d3748]">
                                                    <Icon name="heart" size={20} className={favorites.some(f => (f.id||f.titulo||f.title) === (selectedItem.id||selectedItem.titulo||selectedItem.title)) ? "text-[#E50914] fill-[#E50914]" : "text-gray-400"} fill={favorites.some(f => (f.id||f.titulo||f.title) === (selectedItem.id||selectedItem.titulo||selectedItem.title)) ? "#E50914" : "none"} />
                                                </button>
                                            </div>
                                            <p className="text-gray-300 text-xs sm:text-sm leading-relaxed">{selectedItem.descripcion || selectedItem.description || "Sin descripción disponible."}</p>
                                        </div>
                                        {selectedItem.type === 'series' && selectedItem.seasons && selectedItem.seasons.length > 0 && (
                                            <div className="bg-[#1f2937] rounded-xl p-3.5 h-fit border border-white/5">
                                                <h3 className="font-bold text-sm mb-2 flex items-center gap-2"><Icon name="film" size={16} className="text-[#E50914]"/> Temporadas</h3>
                                                {selectedItem.seasons.map((season, idx) => (
                                                    <div key={idx} className="border-b border-gray-700/50 last:border-0 pb-2 mb-2 last:mb-0">
                                                        <button type="button" onClick={() => setExpandedSeason(expandedSeason === idx ? null : idx)} className="w-full flex justify-between items-center py-1.5 text-xs font-bold hover:text-[#E50914]">
                                                            <span>Temporada {season.season_number}</span>
                                                            {expandedSeason === idx ? <Icon name="chevronUp" size={14}/> : <Icon name="chevronDown" size={14}/>}
                                                        </button>
                                                        {expandedSeason === idx && (
                                                            <div className="flex flex-col gap-1 mt-1 pl-1 max-h-48 overflow-y-auto custom-scrollbar">
                                                                {season.episodes.map((ep, eIdx) => (
                                                                    <div key={eIdx} onClick={() => { setSelectedEpisode(ep); window.scrollTo({top:0, behavior:'smooth'}); }} className={`text-xs p-2 rounded cursor-pointer truncate flex items-center gap-2 ${selectedEpisode?.url === ep.url ? 'bg-[#E50914] text-white' : 'text-gray-400 hover:bg-gray-700/50'}`}>
                                                                        <Icon name="play" size={10} fill="currentColor" /> {eIdx + 1}. {ep.title}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="sticky top-14 md:top-0 z-40 bg-[#111827]/95 backdrop-blur py-3 px-4 sm:px-8 flex items-center justify-between border-b border-[#1f2937]">
                                    <div className="flex bg-[#1f2937] border border-[#374151] rounded-full px-3 py-1.5 w-full max-w-md items-center focus-within:border-[#E50914] transition-colors">
                                        <Icon name="search" className="text-gray-400 w-4 h-4 mr-2.5" />
                                        <input type="text" placeholder={`Buscar en ${activeTab === 'home' ? 'todo' : activeTab}...`} className="bg-transparent w-full outline-none text-xs sm:text-sm placeholder-gray-500 text-white" value={search} onChange={(e) => setSearch(e.target.value)}/>
                                    </div>
                                </div>
                                {activeTab === 'home' && !search && heroItem && <HeroSection item={heroItem} onPlay={handlePlay} isFavorite={favorites.some(f=>(f.id||f.titulo||f.title)===(heroItem.id||heroItem.titulo||heroItem.title))} onToggleFavorite={toggleFavorite}/>}
                                <div className="p-4 sm:p-8">
                                    <div className="mb-4 flex items-center gap-2">
                                        <div className="w-1 h-5 bg-[#E50914] rounded-full"></div>
                                        <h2 className="text-base sm:text-lg font-bold uppercase tracking-wide">{activeTab === 'home' ? 'Tendencias' : activeTab}</h2>
                                    </div>
                                    {loading ? (
                                        <div className="flex justify-center py-16"><div className="animate-spin rounded-full h-10 w-10 border-3 border-[#E50914] border-t-transparent"></div></div>
                                    ) : displayedItems.length === 0 ? (
                                        <div className="text-center py-16 text-gray-500 text-xs"><p>No hay contenido disponible.</p></div>
                                    ) : (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 animate-slide-up">
                                            {displayedItems.map((item, i) => (
                                                <Card key={i} item={item} onClick={handlePlay} isFavorite={favorites.some(f => (f.id||f.titulo||f.title) === (item.id||item.titulo||item.title))} onToggleFavorite={toggleFavorite} />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
