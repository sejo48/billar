<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic TV 2.0 Ultimate - Jorge Arturo Hernández Méndez</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        magis: {
                            50: '#fef2f2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            900: '#7f1d1d',
                            dark: '#030712',
                            card: '#0f172a',
                            border: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .brand-font { font-family: 'Outfit', sans-serif; }
        .gold-font { font-family: 'Cinzel', serif; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.7); }
        }
        .glow-effect { animation: pulseGlow 3s infinite ease-in-out; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .text-gold-gradient {
            background: linear-gradient(to right, #FFD700, #FFF8DC, #DAA520, #FFFACD, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(218, 165, 32, 0.3);
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(12px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-float { animation: floatAnim 4s infinite ease-in-out; }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .equalizer-bar {
            width: 3px;
            background-color: #ef4444;
            border-radius: 2px;
            animation: equalize 1s infinite alternate;
            transform-origin: bottom;
        }
        .equalizer-bar:nth-child(1) { animation-delay: -0.2s; }
        .equalizer-bar:nth-child(2) { animation-delay: -0.4s; }
        .equalizer-bar:nth-child(3) { animation-delay: -0.6s; }
        .equalizer-bar:nth-child(4) { animation-delay: -0.8s; }
        
        @keyframes equalize {
            0% { transform: scaleY(0.2); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* High contrast text utilities for maximum visibility */
        .text-high-contrast {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .text-subtitle-contrast {
            color: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="bg-magis-dark text-white min-h-screen selection:bg-magis-500 selection:text-white">

    <div id="root">
        <div class="flex h-screen w-screen items-center justify-center bg-magis-dark flex-col">
            <div class="relative w-16 h-16 mb-4">
                <div class="absolute inset-0 rounded-full border-4 border-magis-500/20 animate-ping"></div>
                <div class="absolute inset-0 rounded-full border-4 border-magis-500 border-t-transparent animate-spin"></div>
            </div>
            <h2 class="brand-font text-xl font-black tracking-wider text-white">MAGIC TV <span class="text-magis-500">2.0</span></h2>
            <p class="text-xs text-gray-300 mt-1 font-semibold">Cargando experiencia definitiva...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: ['./peliculas.json', './peliculas2.json'],
            ANIMADOS: './animados.json',
            RADIOS: './radios.json'
        };

        const RAW_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/playlist.json',
            MOVIES: ['https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas.json', 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas2.json'],
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/animados.json',
            RADIOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/radios.json'
        };

        const QR_IMAGE_URL = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgsPiFVGiGuwJ3smwIQGJ-25kEkpEZpmR4PNZLdRF0_3LVfWAj2xhWSHiK7pY-C3jera3PD_XpmEtNy0kaCW1m8dayT9ebTV3YNBmbzMZeHF_oIf2XlniVGt6pj6BqtTyWEaUts1Ll_vYx2RuJvlrF9rqIwWcYcwMkTcdLCI-bShcR_KhhoILWEkdJ4Z4w/s1600/mi-qr-pro.png';

        const DEFAULT_RADIO_STATIONS = [
            { id: 'cr-sinfonola', title: 'Radio Sinfonola 90.3 FM', group: 'Romántica / Clásicos', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://live.turadio.stream:7006/;' },
            { id: 'cr-hit', title: 'Hit 104.7 FM', group: 'Juvenil / Pop', image: 'https://static.mytuner.mobi/media/tvos_radios/164/radio-hit-1047-fm.1180f4a3.jpg', url: 'https://live.turadio.stream:7004/stream?nocache=596&type=http' },
            { id: 'cr-crc', title: 'CRC 94.7 FM', group: 'Alternativo / Rock', image: 'https://static.mytuner.mobi/media/tvos_radios/nAwNLxJbnm.png', url: 'https://23263.live.streamtheworld.com/CRC_947AAC_SC' },
            { id: 'cr-zeta', title: 'Zeta FM 95.1', group: 'Tropical / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/879/zeta-fm.feb3fb70.png', url: 'https://d5g44yionyslb.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-monumental', title: 'Radio Monumental 93.5 FM', group: 'Noticias / Deportes', image: 'https://static.mytuner.mobi/media/tvos_radios/574/radio-monumental.7303764d.png', url: 'https://d26gdpbozqq700.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-mejor', title: 'La Mejor 99.1 FM', group: 'Regional / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/575/la-mejor-991.95c72890.png', url: 'https://d3svz5xnvdysyz.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-r2', title: 'Radio Dos 99.5 FM', group: 'Clásicos / Rock', image: 'https://placehold.co/300x300/0033a0/ffffff?text=R2', url: 'https://icecasthd.teletica.com/radiodos' },
            { id: 'cr-los40', title: 'Los 40 Costa Rica 104.3 FM', group: 'Éxitos / Urbano', image: 'https://placehold.co/300x300/ffcc00/000000?text=Los40', url: 'https://icecasthd.teletica.com/los40' },
            { id: 'cr-disney', title: 'Radio Disney 101.1 FM', group: 'Pop / Éxitos', image: 'https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg', url: 'https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8' },
            { id: 'cr-wao', title: 'WAO 92.3 FM', group: 'Urbano / Reggaeton', image: 'https://placehold.co/300x300/fd7e14/ffffff?text=WAO', url: 'https://icecasthd.teletica.com/wao' },
            { id: 'cr-musical', title: 'Radio Musical 97.5 FM', group: 'Romántica / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/085/radio-musical.fea3e089.jpg', url: 'https://live.turadio.stream:7005/stream/1/' }
        ];

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}

            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) {
                    return isJson ? await resRaw.json() : await resRaw.text();
                }
            } catch (e) {}

            return null;
        };

        const parseM3U = (data) => {
            const lines = data.split('\n');
            const channels = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let title = 'Canal en Vivo';
                    const url = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (url && url.startsWith('http')) {
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                        const logo = logoMatch ? logoMatch[1] : '';
                        const groupMatch = line.match(/group-title="([^"]*)"/);
                        const group = groupMatch ? groupMatch[1] : 'Nacionales';
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                        channels.push({ 
                            id: `tv-${i}`, 
                            title, 
                            image: logo || 'https://placehold.co/300x200/ef4444/ffffff?text=Magic+Live', 
                            group, 
                            url, 
                            type: 'tv' 
                        });
                    }
                }
            }
            return channels;
        };

        const App = () => {
            const [currentTab, setCurrentTab] = useState('home');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeMedia, setActiveMedia] = useState(null);
            const [favorites, setFavorites] = useState([]);
            const [activeRadio, setActiveRadio] = useState(null);
            const [isPlayingRadio, setIsPlayingRadio] = useState(false);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [streamError, setStreamError] = useState(false);
            const [isLoadingRadio, setIsLoadingRadio] = useState(false);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showAuthorModal, setShowAuthorModal] = useState(false);
            const [loading, setLoading] = useState(true);

            const [content, setContent] = useState({
                tv: [],
                movies: [],
                series: [],
                animados: [],
                radios: DEFAULT_RADIO_STATIONS
            });

            const audioRef = useRef(null);
            const hlsRef = useRef(null);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        setLoading(true);
                        const moviePromises = URLS.MOVIES.map((localPath, idx) => 
                            fetchSmart(localPath, RAW_URLS.MOVIES[idx], true)
                        );

                        const [dataTV, dataSeries, dataAnimados, dataRadios, ...moviesResults] = await Promise.all([
                            fetchSmart(URLS.TV, RAW_URLS.TV, false),
                            fetchSmart(URLS.SERIES, RAW_URLS.SERIES, true),
                            fetchSmart(URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                            fetchSmart(URLS.RADIOS, RAW_URLS.RADIOS, true),
                            ...moviePromises
                        ]);

                        let tvChannels = dataTV ? parseM3U(dataTV) : [];
                        
                        let moviesList = [];
                        moviesResults.forEach((dataMovies, fileIdx) => {
                            if (dataMovies) {
                                const rawMovies = Array.isArray(dataMovies) ? dataMovies : (dataMovies.peliculas || dataMovies.content || []);
                                const mapped = rawMovies.map((m, idx) => ({
                                    ...m,
                                    id: `mov-${fileIdx}-${idx}`,
                                    type: 'movies',
                                    title: m.titulo || m.title || m.name,
                                    description: m.descripcion || m.sinopsis || m.plot,
                                    image: m.imagen || m.poster || m.image,
                                    url: convertUrl(m.urlDrive || m.url || m.urlOkRu),
                                    group: 'Cine y Estrenos',
                                    rating: m.rating || '8.9'
                                }));
                                moviesList = [...moviesList, ...mapped];
                            }
                        });

                        let seriesList = [];
                        if (dataSeries) {
                            const rawSeries = Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || []);
                            seriesList = rawSeries.map((s, idx) => ({
                                ...s,
                                id: `serie-${idx}`,
                                type: 'series',
                                title: s.tituloSerie || s.titulo || s.title || s.name,
                                description: s.descripcion || s.sinopsis,
                                image: s.imagen || s.poster || s.image,
                                group: 'Series TV',
                                seasons: (s.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        let animadosList = [];
                        if (dataAnimados) {
                            const rawAnimados = Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || []);
                            animadosList = rawAnimados.map((a, idx) => ({
                                ...a,
                                id: `anim-${idx}`,
                                type: 'animados',
                                title: a.titulo || a.tituloSerie || a.title || a.name,
                                description: a.descripcion || a.sinopsis,
                                image: a.imagen || a.poster || a.image,
                                group: 'Animados / Kids',
                                seasons: (a.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-anim-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        let radioList = DEFAULT_RADIO_STATIONS;
                        if (dataRadios) {
                            const list = Array.isArray(dataRadios) ? dataRadios : (dataRadios.radios || dataRadios.emisoras || []);
                            if (list.length > 0) radioList = list;
                        }

                        setContent({
                            tv: tvChannels,
                            movies: moviesList,
                            series: seriesList,
                            animados: animadosList,
                            radios: radioList
                        });
                    } catch (e) {
                        console.error("Error loading Magic TV 2.0 content", e);
                    } finally {
                        setLoading(false);
                    }
                };

                loadData();

                const savedFavs = safeStorage.getItem('magistv2_favs');
                if (savedFavs) {
                    try { setFavorites(JSON.parse(savedFavs)); } catch(e) {}
                }
            }, []);

            const toggleFavorite = (item) => {
                const itemId = item.id || item.title;
                const updated = favorites.some(f => (f.id || f.title) === itemId) 
                    ? favorites.filter(f => (f.id || f.title) !== itemId) 
                    : [...favorites, item];
                setFavorites(updated);
                safeStorage.setItem('magistv2_favs', JSON.stringify(updated));
            };

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.crossOrigin = "anonymous";
                    
                    audioRef.current.addEventListener('error', () => {
                        setIsPlayingRadio(false);
                        setStreamError(true);
                        setIsLoadingRadio(false);
                    });
                    audioRef.current.addEventListener('waiting', () => setIsLoadingRadio(true));
                    audioRef.current.addEventListener('playing', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    });
                    audioRef.current.addEventListener('canplay', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    });
                }

                const audio = audioRef.current;
                audio.volume = radioVolume;

                if (activeRadio) {
                    const playAudio = () => {
                        audio.play().catch(() => {
                            setIsPlayingRadio(false);
                            setStreamError(true);
                            setIsLoadingRadio(false);
                        });
                    };

                    if (audio.dataset.currentUrl !== activeRadio.url) {
                        setIsLoadingRadio(true);
                        setStreamError(false);
                        audio.dataset.currentUrl = activeRadio.url;

                        if (hlsRef.current) {
                            hlsRef.current.destroy();
                            hlsRef.current = null;
                        }

                        if (activeRadio.url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls();
                            hlsRef.current = hls;
                            hls.loadSource(activeRadio.url);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                if (isPlayingRadio) playAudio();
                            });
                        } else {
                            audio.src = activeRadio.url;
                            audio.load();
                            if (isPlayingRadio) playAudio();
                        }
                    } else {
                        if (isPlayingRadio) playAudio();
                        else audio.pause();
                    }
                }
            }, [activeRadio, isPlayingRadio]);

            useEffect(() => {
                if (audioRef.current) audioRef.current.volume = radioVolume;
            }, [radioVolume]);

            const handlePlayStation = (station) => {
                if (activeRadio?.id === station.id) {
                    setIsPlayingRadio(!isPlayingRadio);
                } else {
                    setActiveRadio(station);
                    setIsPlayingRadio(true);
                }
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-[#030712] relative">
                    
                    <aside className="hidden md:flex w-24 flex-col items-center py-8 glass-panel border-r border-white/10 fixed h-full z-45 shadow-2xl">
                        <div className="mb-6 p-3 bg-gradient-to-tr from-magis-600 to-red-500 rounded-2xl shadow-xl glow-effect cursor-pointer transform hover:scale-105 transition-all" onClick={() => { setCurrentTab('home'); setActiveMedia(null); }}>
                            <i className="ph-fill ph-magic-wand text-2xl text-white"></i>
                        </div>
                        
                        <div className="flex flex-col gap-2.5 w-full items-center">
                            {[
                                { id: 'home', icon: 'ph-house', label: 'Inicio' },
                                { id: 'tv', icon: 'ph-television', label: 'TV Live' },
                                { id: 'movies', icon: 'ph-film-strip', label: 'Cine' },
                                { id: 'series', icon: 'ph-video', label: 'Series' },
                                { id: 'animados', icon: 'ph-smiley', label: 'Kids' },
                                { id: 'radio', icon: 'ph-radio', label: 'Radio' },
                                { id: 'favorites', icon: 'ph-heart', label: 'Favs' }
                            ].map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => { setCurrentTab(tab.id); setActiveMedia(null); }}
                                    className={`flex flex-col items-center gap-1 py-3 w-full transition-all relative group ${currentTab === tab.id ? 'text-magis-500 font-extrabold bg-white/10' : 'text-gray-300 hover:text-white hover:bg-white/5'}`}
                                >
                                    {currentTab === tab.id && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-7 bg-magis-500 rounded-r-full shadow-lg shadow-red-500/50"></div>}
                                    <i className={`${tab.icon} text-xl group-hover:scale-125 transition-transform`}></i>
                                    <span className="text-[10px] tracking-tight font-semibold">{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        <div className="mt-auto pb-4 flex flex-col items-center gap-3">
                            <div onClick={() => setShowQrModal(true)} className="group cursor-pointer flex flex-col items-center p-2 bg-slate-900/90 hover:bg-slate-800 rounded-2xl border border-white/15 transition-all shadow-lg text-center transform hover:scale-105" title="Compartir App">
                                <img src={QR_IMAGE_URL} alt="QR" className="w-10 h-10 rounded-lg object-contain bg-white p-0.5 shadow" />
                                <span className="text-[9px] font-black text-white mt-1">QR</span>
                            </div>
                            <div onClick={() => setShowAuthorModal(true)} className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center gold-font font-black text-black text-sm shadow-xl border border-white/30 cursor-pointer hover:scale-110 transition-transform" title="Créditos del Autor">
                                J
                            </div>
                        </div>
                    </aside>

                    <header className="md:hidden fixed top-0 w-full glass-panel z-40 px-4 py-3 flex items-center justify-between border-b border-white/10 shadow-lg">
                        <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => { setCurrentTab('home'); setActiveMedia(null); }}>
                            <div className="p-2 bg-magis-500 rounded-xl text-white shadow-lg shadow-red-500/40">
                                <i className="ph-fill ph-magic-wand text-lg"></i>
                            </div>

                    </div>
                </div>
            );
        };

        const FavoritesSection = ({ favorites, onSelect, onToggleFav }) => (
            <div className="max-w-7xl mx-auto py-6 space-y-6 animate-fade-in">
                <div>
                    <h1 className="brand-font text-2xl sm:text-3xl font-black text-high-contrast">Tus Favoritos</h1>
                    <p className="text-xs sm:text-sm text-subtitle-contrast mt-1 font-medium">Acceso rápido a tus canales, series y películas guardadas.</p>
                </div>
                {favorites.length === 0 ? (
                    <div className="text-center py-24 text-gray-400">
                        <i className="ph ph-heart text-5xl mb-3 opacity-40"></i>
                        <p className="text-sm font-semibold">No tienes favoritos guardados aún.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {favorites.map(item => (
                            <div key={item.id || item.title} onClick={() => onSelect(item)} className="glass-panel rounded-2xl p-3 cursor-pointer hover:border-magis-500 transition-all relative shadow-xl">
                                <div className="aspect-video rounded-xl bg-black overflow-hidden relative mb-2.5 flex items-center justify-center border border-white/10">
                                    <img src={item.image} alt={item.title} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x200/ef4444/ffffff?text=Magic'} />
                                    <button onClick={(e) => { e.stopPropagation(); onToggleFav(item); }} className="absolute top-2 right-2 p-1.5 rounded-full bg-black/70 text-white backdrop-blur-md shadow">
                                        <i className="ph-fill ph-heart text-magis-500"></i>
                                    </button>
                                </div>
                                <h3 className="font-extrabold text-xs text-high-contrast truncate">{item.title}</h3>
                                <span className="text-[11px] text-gray-300 font-semibold block mt-0.5 truncate">{item.group || 'Favorito'}</span>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const MediaViewer = ({ media, onBack }) => {
            const videoRef = useRef(null);
            const [selectedSeason, setSelectedSeason] = useState(0);
            const [selectedEpisode, setSelectedEpisode] = useState(
                media.seasons?.[0]?.episodes?.[0] || null
            );

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const targetUrl = (media.type === 'series' || media.type === 'animados') && selectedEpisode 
                    ? selectedEpisode.url 
                    : media.url;

                if (!targetUrl) return;

                if (targetUrl.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(targetUrl);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = targetUrl;
                    }
                } else {
                    video.src = targetUrl;
                }
            }, [media, selectedEpisode]);

            const isSeriesOrAnim = (media.type === 'series' || media.type === 'animados') && media.seasons && media.seasons.length > 0;
            const activeUrl = isSeriesOrAnim && selectedEpisode ? selectedEpisode.url : media.url;
            const isEmbed = activeUrl && (activeUrl.includes('drive.google.com') || activeUrl.includes('ok.ru'));

            return (
                <div className="max-w-6xl mx-auto py-4 space-y-6 animate-fade-in pb-32">
                    <button onClick={onBack} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold border border-white/20 transition-all shadow">
                        <i className="ph ph-arrow-left text-base"></i> Volver al Catálogo
                    </button>

                    <div className="w-full aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl border border-white/20 relative">
                        {isEmbed ? (
                            <iframe 
                                src={activeUrl} 
                                className="w-full h-full border-0 absolute inset-0" 
                                allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
                                allowFullScreen
                            ></iframe>
                        ) : (
                            <video 
                                ref={videoRef}
                                controls 
                                autoPlay 
                                playsInline
                                className="w-full h-full object-contain"
                            ></video>
                        )}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 glass-panel rounded-3xl p-6 sm:p-8 space-y-3.5 border border-white/20 shadow-xl">
                            <div className="flex items-center gap-2.5">
                                <span className="px-3 py-1 rounded-full bg-magis-500/25 text-magis-500 text-[11px] font-black uppercase tracking-widest border border-magis-500/40">{media.group || media.type}</span>
                                {media.year && <span className="text-xs text-gray-300 font-bold">{media.year}</span>}
                            </div>
                            <h1 className="brand-font text-2xl sm:text-4xl font-black text-high-contrast">{media.title}</h1>
                            <p className="text-xs sm:text-sm text-subtitle-contrast leading-relaxed font-medium">{media.description || media.sinopsis || "Disfruta de esta transmisión exclusiva en alta definición desde Magic TV 2.0."}</p>
                        </div>

                        {isSeriesOrAnim && (
                            <div className="glass-panel rounded-3xl p-6 space-y-4 border border-white/20 flex flex-col h-[420px] shadow-xl">
                                <h3 className="brand-font font-black text-sm text-high-contrast uppercase tracking-wide">Temporadas y Episodios</h3>
                                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                    {media.seasons.map((season, sIdx) => (
                                        <button 
                                            key={sIdx} 
                                            onClick={() => setSelectedSeason(sIdx)} 
                                            className={`px-3 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all ${selectedSeason === sIdx ? 'bg-magis-500 text-white shadow-lg shadow-red-500/30' : 'bg-white/10 text-gray-300 hover:text-white hover:bg-white/20'}`}
                                        >
                                            Temporada {season.seasonNumber}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                                    {media.seasons[selectedSeason]?.episodes?.map((ep, eIdx) => (
                                        <div 
                                            key={eIdx} 
                                            onClick={() => setSelectedEpisode(ep)} 
                                            className={`p-3 rounded-xl cursor-pointer flex items-center justify-between text-xs transition-all ${selectedEpisode?.url === ep.url ? 'bg-magis-500/25 text-white border border-magis-500/60 shadow-md font-bold' : 'bg-white/5 hover:bg-white/10 text-gray-200'}`}
                                        >
                                            <div className="flex items-center gap-3 truncate">
                                                <span className="text-magis-500 font-black">{eIdx + 1}.</span>
                                                <span className="truncate">{ep.title}</span>
                                            </div>
                                            <i className="ph-fill ph-play text-magis-500 text-sm"></i>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
