<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salidas - Asignación de Asientos</title>
<style>
:root{
  --bg:#04070d;
  --panel:#0a101d;
  --header:#010306;
  --border:#1e293b;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --seat:#0a101d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#010306;color:var(--text)}
body{padding:0}
.app{
  width:100%;
  max-width:680px;
  min-height:100vh;
  margin:0 auto;
  background:var(--bg);
  padding:20px 24px 28px;
  border-radius:0 0 12px 12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06);
}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.title{margin:0;color:#60a5fa;font-size:24px;font-weight:700}
.top-actions{display:flex;gap:8px;align-items:center}
.theme, .export-btn{
  width:38px;height:38px;border:0;border-radius:50%;
  background:#1e293b;color:#fbbf24;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s;
}
.export-btn{color:#fff;background:#2563eb;font-size:14px}
.theme:hover, .export-btn:hover{filter:brightness(1.15)}

.reference{
  display:flex;justify-content:center;margin:0 0 20px;
}
.reference img{
  width:100%;max-width:580px;height:380px;object-fit:cover;
  border-radius:10px;display:block;background:#000;box-shadow:0 10px 30px rgba(0,0,0,0.95);
  border:1px solid #1e293b;
}

.board{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  margin-bottom:22px;
}
.board th{
  height:40px;background:var(--header);color:#fff;
  font-size:14px;font-weight:700;border:0;
}
.board td{
  height:52px;padding:0;border:1px solid var(--border);
  background:var(--seat);text-align:center;vertical-align:middle;
  cursor:pointer;transition:.12s;
  position:relative;
}
.board td:hover{filter:brightness(1.2)}
.seat{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;overflow:hidden;padding:4px;
}
.seat.empty{color:transparent}
.seat .seat-content{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.2;max-width:100%;
}
.seat .seat-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.controls-title{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.controls-title h2{font-size:16px;margin:0;font-weight:700}
button{font-family:inherit}
.primary{
  border:0;border-radius:6px;background:var(--blue);color:#fff;
  padding:7px 14px;font-size:13px;cursor:pointer;
  transition:background .2s;
}
.primary:hover{background:#1d4ed8}
label{display:block;font-size:12px;color:#d1d5db;margin:0 0 6px}
select,input{
  width:100%;height:40px;border:1px solid #334155;border-radius:6px;
  background:#0a101d;color:#f3f4f6;padding:0 12px;font-size:14px;
  outline:none;
}
select:focus,input:focus{border-color:#60a5fa}
.field{margin-bottom:16px}
.add-row{display:flex;gap:0}
.add-row input{border-radius:6px 0 0 6px;border-right:0;height:40px}
.add-row button{
  width:80px;border:0;border-radius:0 6px 6px 0;
  background:var(--green);color:#fff;font-size:13px;cursor:pointer;
  transition:background .2s;
}
.add-row button:hover{background:#15803d}
.actions-row{display:flex;gap:12px;margin-top:18px}
.danger{
  flex:1;border:0;border-radius:6px;background:var(--red);color:#fff;
  padding:12px 14px;font-size:13px;cursor:pointer;transition:background .2s;
}
.danger:hover{background:#b91c1c}
.secondary-action{
  flex:1;border:0;border-radius:6px;background:#334155;color:#fff;
  padding:12px 14px;font-size:13px;cursor:pointer;transition:background .2s;
}
.secondary-action:hover{background:#475569}
.hint{font-size:12px;color:#9ca3af;margin:12px 0 0;line-height:1.4}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
}
.modal-backdrop.show{display:flex}
.modal{
  width:100%;max-width:440px;background:#0a101d;border:1px solid #334155;
  border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.7);padding:22px;color:#f3f4f6;
}
.modal h3{margin:0 0 14px;font-size:17px}
.modal p{font-size:13px;color:#9ca3af;margin:0 0 16px;line-height:1.4}
.name-list{max-height:260px;overflow:auto;border:1px solid #334155;border-radius:6px}
.name-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-bottom:1px solid #1e293b;font-size:13px;
}
.name-item:last-child{border-bottom:0}
.name-item button{
  border:0;background:#b91c1c;color:white;border-radius:4px;padding:5px 9px;font-size:11px;cursor:pointer;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.close{border:0;background:#334155;color:#fff;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:13px}
.modal-confirm{border:0;background:#2563eb;color:#fff;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:13px}

.light{--bg:#f0f2f5;--panel:#fff;--border:#cbd5e1;--text:#172033;--muted:#475569;--seat:#f8fafc}
.light .title{color:#2563eb}
.light .board td{background:#f8fafc}
.light label,.light .controls-title h2{color:#172033}
.light select,.light input{background:#fff;color:#172033}
.light .modal{background:#ffffff;border-color:#cbd5e1;color:#172033}
.light .name-list{border-color:#cbd5e1}
.light .name-item{border-bottom-color:#e2e8f0}

@media(max-width:480px){
  .app{padding:14px 10px}
  .reference img{height:280px}
  .board th{font-size:13px}
  .board td{height:48px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <h1 class="title">Salidas</h1>
    <div class="top-actions">
      <button class="export-btn" id="exportBtn" title="Exportar Resumen">📋</button>
      <button class="theme" id="themeBtn" title="Cambiar tema">☀</button>
    </div>
  </div>

  <div class="reference">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjwVUHtc7K1nqnPnTqO6do4jkR6bm9WNT0YVy46dlpmKkkJGcH25eI_5EwacesPK_0wrt29OCymXhkVLw23QWNUzGPN4ufaPjYS8ZQqM0xmSGNxgCc-W6xn1hPN9x0xH3HuNfmOkH1dslLFFF0eys6V8IIvvIrCBAdCZs-5IBKF6yYaBNg8muix6KLp_o0/s320/WhatsApp%20Image%202026-09-30%20at%201.41.30%20PM.jpeg" alt="Asignación de asientos">
  </div>

  <table class="board" aria-label="Asignación de asientos">
    <thead>
      <tr>
        <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
      </tr>
    </thead>
    <tbody id="seatBoard"></tbody>
  </table>

  <section>
    <div class="controls-title">
      <h2>Controles</h2>
      <button class="primary" id="manageBtn">Administrar nombres</button>
    </div>

    <div class="field">
      <label for="nameSelect">Seleccionar nombre disponible:</label>
      <select id="nameSelect"></select>
    </div>

    <div class="field">
      <label for="colorSelect">Seleccionar color:</label>
      <select id="colorSelect">
        <option value="">Seleccionar color</option>
        <option value="#2563eb">Azul</option>
        <option value="#dc2626">Rojo</option>
        <option value="#facc15">Amarillo</option>
        <option value="#16a34a">Verde</option>
      </select>
    </div>

    <div class="field">
      <label for="newName">Nuevo nombre:</label>
      <div class="add-row">
        <input id="newName" type="text" maxlength="40" placeholder="Ingrese nuevo nombre">
        <button id="addBtn">Agregar</button>
      </div>
    </div>

    <div class="actions-row">
      <button class="secondary-action" id="clearSeatBtn">Liberar asiento</button>
      <button class="danger" id="clearBtn">Borrar todo</button>
    </div>
    <p class="hint">Seleccione un nombre disponible y un color, luego haga clic en el asiento. Todo se guarda localmente en su dispositivo (móvil o PC).</p>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Administrar nombres</h3>
    <div id="modalBody">
      <div class="name-list" id="nameList"></div>
    </div>
    <div class="modal-actions" id="modalActions">
      <button class="close" id="closeModal">Cerrar</button>
    </div>
  </div>
</div>

<script>
const NAME_KEY='salidas_nombres_v9';
const SEAT_KEY='salidas_asientos_v9';
const THEME_KEY='salidas_tema_v9';

let names = JSON.parse(localStorage.getItem(NAME_KEY) || '[]');
let seats = JSON.parse(localStorage.getItem(SEAT_KEY) || '[]');

const board = document.getElementById('seatBoard');
const nameSelect = document.getElementById('nameSelect');
const colorSelect = document.getElementById('colorSelect');
const newName = document.getElementById('newName');
const modal = document.getElementById('modalBackdrop');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalActions = document.getElementById('modalActions');
const app = document.getElementById('app');

function save(){
  try {
    localStorage.setItem(NAME_KEY, JSON.stringify(names));
    localStorage.setItem(SEAT_KEY, JSON.stringify(seats));
  } catch(e){
    console.error('Error guardando en almacenamiento local', e);
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function textColor(hex){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (r*299+g*587+b*114)>150000 ? '#111827' : '#ffffff';
}

function showCustomModal(title, message, onConfirm = null){
  modalTitle.textContent = title;
  modalBody.innerHTML = `<p>${esc(message)}</p>`;
  modalActions.innerHTML = `<button class="close" id="closeModalBtn">Cerrar</button>`;
  if(onConfirm){
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'modal-confirm';
    confirmBtn.textContent = 'Confirmar';
    confirmBtn.addEventListener('click', () => {
      onConfirm();
      closeModal();
    });
    modalActions.appendChild(confirmBtn);
  }
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  modal.classList.add('show');
}

function closeModal(){
  modal.classList.remove('show');
}

function getAssignedNames(){
  const assigned = new Set();
  seats.forEach(s => {
    if(s && s.name) assigned.add(s.name);
  });
  return assigned;
}

function renderNames(){
  const current = nameSelect.value;
  const assignedNames = getAssignedNames();
  
  nameSelect.innerHTML = '<option value="">Seleccionar nombre disponible</option>';
  
  names.forEach((n) => {
    if(!assignedNames.has(n)){
      const o = document.createElement('option');
      o.value = n; 
      o.textContent = n;
      if(n === current) o.selected = true;
      nameSelect.appendChild(o);
    }
  });
}

function renderBoard(){
  board.innerHTML='';
  for(let r=0;r<4;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<5;c++){
      const i=r*5+c;
      const td=document.createElement('td');
      td.dataset.index=i;
      const a=seats[i];
      const div=document.createElement('div');
      div.className='seat'+(a?'':' empty');
      if(a){
        div.style.background=a.color;
        div.style.color=textColor(a.color);
        div.innerHTML='<div class="seat-content"><div class="seat-name">'+esc(a.name)+'</div></div>';
      }
      td.appendChild(div);
      td.addEventListener('click',()=>handleSeatClick(i));
      tr.appendChild(td);
    }
    board.appendChild(tr);
  }
}

function handleSeatClick(index){
  const selectedName = nameSelect.value;
  const color = colorSelect.value;
  
  if(!selectedName && !color){
    if(seats[index]){
      showCustomModal('Liberar Asiento', `¿Desea desasignar el asiento #${index + 1} (${seats[index].name})? El nombre volverá a estar disponible.`, () => {
        seats[index] = null;
        save();
        renderBoard();
        renderNames();
      });
    } else {
      showCustomModal('Aviso', 'Seleccione primero un nombre disponible y un color en los controles inferiores antes de asignar un asiento.');
    }
    return;
  }

  if(!selectedName){
    showCustomModal('Falta Nombre', 'Por favor seleccione un nombre disponible de la lista.');
    nameSelect.focus();
    return;
  }
  if(!color){
    showCustomModal('Falta Color', 'Por favor seleccione un color.');
    colorSelect.focus();
    return;
  }
  
  const colorName = colorSelect.options[colorSelect.selectedIndex].text;
  seats[index] = { name: selectedName, color, colorName };
  
  save(); 
  renderBoard();
  renderNames();
  nameSelect.value = "";
}

function addName(){
  const value=newName.value.trim();
  if(!value) return;
  if(names.some(n=>n.toLowerCase()===value.toLowerCase())){
    showCustomModal('Duplicado', 'Ese nombre ya se encuentra registrado.');
    return;
  }
  names.push(value);
  newName.value='';
  save(); 
  renderNames(); 
  nameSelect.value = value;
}

function renderNameManagementList(){
  modalTitle.textContent = 'Administrar nombres';
  modalBody.innerHTML = '<div class="name-list" id="nameListContainer"></div>';
  modalActions.innerHTML = '<button class="close" id="closeModalBtn">Cerrar</button>';
  
  const container = document.getElementById('nameListContainer');
  const assignedNames = getAssignedNames();

  if(!names.length){
    container.innerHTML='<div class="name-item">No hay nombres registrados.</div>';
  } else {
    names.forEach((n,i)=>{
      const isAssigned = assignedNames.has(n);
      const row=document.createElement('div');
      row.className='name-item';
      row.innerHTML=`<span>${esc(n)} ${isAssigned ? '<span style="font-size:10px;color:#60a5fa;margin-left:6px;">(Asignado)</span>' : ''}</span><button data-i="${i}">Borrar</button>`;
      row.querySelector('button').addEventListener('click',()=>{
        showCustomModal('Eliminar Nombre', `¿Desea borrar el nombre "${n}"? Se removerá permanentemente de la lista.`, () => {
          names.splice(i,1);
          seats = seats.map(s => s && s.name === n ? null : s);
          save(); 
          renderNames(); 
          renderBoard(); 
          renderNameManagementList();
        });
      });
      container.appendChild(row);
    });
  }
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  modal.classList.add('show');
}

document.getElementById('addBtn').addEventListener('click',addName);
newName.addEventListener('keydown',e=>{if(e.key==='Enter')addName();});

document.getElementById('clearBtn').addEventListener('click',()=>{
  showCustomModal('Borrar Todo', '¿Está seguro de limpiar todas las asignaciones de asientos?', () => {
    seats=[]; 
    save(); 
    renderBoard();
    renderNames();
  });
});

document.getElementById('clearSeatBtn').addEventListener('click',()=>{
  showCustomModal('Liberar Asiento', 'Haga clic directamente sobre el asiento en el tablero que desea dejar libre.');
});

document.getElementById('manageBtn').addEventListener('click', renderNameManagementList);

modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

document.getElementById('exportBtn').addEventListener('click', () => {
  let summary = "📋 Resumen de Asignación de Asientos (Salidas):\n\n";
  let assignedCount = 0;
  seats.forEach((s, idx) => {
    if(s) {
      summary += `Asiento #${idx + 1}: ${s.name} (${s.colorName})\n`;
      assignedCount++;
    }
  });
  if(assignedCount === 0) {
    summary += "No hay asientos asignados todavía.";
  }
  
  const textArea = document.createElement("textarea");
  textArea.value = summary;
  textArea.style.position = "fixed";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
    showCustomModal('Copiado', '¡El resumen de asientos se ha copiado al portapapeles con éxito!');
  } catch (err) {
    showCustomModal('Error', 'No se pudo copiar automáticamente.');
  }
  document.body.removeChild(textArea);
});

document.getElementById('themeBtn').addEventListener('click',()=>{
  app.classList.toggle('light');
  localStorage.setItem(THEME_KEY,app.classList.contains('light')?'light':'dark');
});

if(localStorage.getItem(THEME_KEY)==='light') app.classList.add('light');

renderNames();
renderBoard();
</script>
</body>
</html>
