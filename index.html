            { id: 'cr-disney', title: 'Radio Disney 101.1 FM', group: 'Pop / Éxitos', image: 'https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg', url: 'https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8' }

        const AudioVisualizerBanner = ({ isPlaying, stationTitle, mode, setMode, isOpen, setIsOpen }) => {
            const canvasRef = useRef(null);
            const animIdRef = useRef(null);
            const capsRef = useRef([]);
            const particlesRef = useRef([]);

            // Inicializar partículas para el modo Aura
            useEffect(() => {
                const particles = [];
                for (let i = 0; i < 40; i++) {
                    particles.push({
                        x: Math.random(),
                        y: Math.random(),
                        radius: Math.random() * 2 + 1,
                        angle: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.02 + 0.005,
                        color: ['#10B981', '#06B6D4', '#EC4899', '#F97316', '#8B5CF6'][Math.floor(Math.random() * 5)]
                    });
                }
                particlesRef.current = particles;
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let phase = Math.random() * 10;

                const draw = () => {
                    animIdRef.current = requestAnimationFrame(draw);
                    const width = canvas.width;
                    const height = canvas.height;

                    ctx.clearRect(0, 0, width, height);

                    if (isPlaying) phase += 0.08;

                    if (mode === 'espectro') {
                        // MODO ESPECTRO NEÓN ESTILIZADO (64 Barras ultrafinas y elegantes)
                        const barCount = 64;
                        const gap = 2;
                        const barWidth = Math.max(2, (width - (barCount * gap)) / barCount);

                        // Degradado Multicolor Neón Profesional (Esmeralda -> Cian -> Magenta -> Naranja)
                        const gradient = ctx.createLinearGradient(0, height, width, 0);
                        gradient.addColorStop(0.0, '#10B981'); // Esmeralda Spotify
                        gradient.addColorStop(0.25, '#06B6D4'); // Cian Eléctrico
                        gradient.addColorStop(0.60, '#EC4899'); // Rosa Neón
                        gradient.addColorStop(0.85, '#F97316'); // Naranja Fuego
                        gradient.addColorStop(1.0, '#8B5CF6'); // Púrpura

                        for (let i = 0; i < barCount; i++) {
                            let amplitude = 0.04;
                            if (isPlaying) {
                                const sin1 = Math.sin(phase + i * 0.25);
                                const sin2 = Math.cos(phase * 0.85 + i * 0.18);
                                const sin3 = Math.sin(phase * 1.5 + i * 0.4);
                                amplitude = Math.abs(sin1 * 0.45 + sin2 * 0.35 + sin3 * 0.2) * (0.3 + (i % 7) * 0.1) + Math.random() * 0.06;
                                amplitude = Math.min(1.0, Math.max(0.04, amplitude));
                            }

                            const barHeight = Math.max(2, amplitude * (height - 6));
                            const x = i * (barWidth + gap) + gap;
                            const y = height - barHeight;

                            ctx.fillStyle = gradient;
                            ctx.shadowBlur = isPlaying ? 10 : 0;
                            ctx.shadowColor = '#06B6D4';

                            ctx.beginPath();
                            if (ctx.roundRect) {
                                ctx.roundRect(x, y, barWidth, barHeight, [2, 2, 0, 0]);
                            } else {
                                ctx.rect(x, y, barWidth, barHeight);
                            }
                            ctx.fill();

                            // Puntas flotantes (Drop Caps) con física de caída libre
                            if (!capsRef.current[i]) capsRef.current[i] = 0;
                            if (barHeight > capsRef.current[i]) {
                                capsRef.current[i] = barHeight;
                            } else {
                                capsRef.current[i] = Math.max(0, capsRef.current[i] - 0.8);
                            }

                            const capY = height - capsRef.current[i] - 2;
                            ctx.fillStyle = '#FFFFFF';
                            ctx.shadowBlur = isPlaying ? 5 : 0;
                            ctx.shadowColor = '#FFFFFF';
                            ctx.fillRect(x, Math.max(0, capY), barWidth, 1.5);
                        }
                    } else if (mode === 'osciloscopio') {
                        // MODO OSCILOSCOPIO LÁSER MULTICOLOR
                        ctx.shadowBlur = isPlaying ? 12 : 0;
                        ctx.shadowColor = '#10B981';
                        ctx.lineWidth = 2.2;

                        // Línea principal Verde/Cian
                        ctx.strokeStyle = '#10B981';
                        ctx.beginPath();
                        const centerY = height / 2;
                        for (let x = 0; x < width; x += 2) {
                            const normX = x / width;
                            const amp = isPlaying ? Math.sin(phase * 2 + normX * 14) * 16 * Math.sin(normX * Math.PI) : 0;
                            const y = centerY + amp;
                            if (x === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();

                        // Línea secundaria Magenta
                        ctx.strokeStyle = '#EC4899';
                        ctx.shadowColor = '#EC4899';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        for (let x = 0; x < width; x += 2) {
                            const normX = x / width;
                            const amp = isPlaying ? Math.cos(phase * 1.6 + normX * 10) * 12 * Math.sin(normX * Math.PI) : 0;
                            const y = centerY + amp;
                            if (x === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    } else if (mode === 'aura') {
                        // MODO AURA PULSANTE MULTICOLOR
                        const centerX = width / 2;
                        const centerY = height / 2;
                        const pulse = isPlaying ? (Math.sin(phase * 3) * 0.35 + 0.65) : 0.2;

                        for (let r = 3; r >= 1; r--) {
                            const radius = (r * 12 + pulse * 12);
                            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                            grad.addColorStop(0, r === 3 ? 'rgba(16, 185, 129, 0.6)' : r === 2 ? 'rgba(236, 72, 153, 0.4)' : 'rgba(6, 182, 212, 0.2)');
                            grad.addColorStop(1, 'transparent');

                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        particlesRef.current.forEach(p => {
                            if (isPlaying) p.angle += p.speed;
                            const px = centerX + Math.cos(p.angle) * (width * 0.42 * p.x);
                            const py = centerY + Math.sin(p.angle) * (height * 0.38 * p.y);

                            ctx.fillStyle = p.color;
                            ctx.shadowBlur = isPlaying ? 6 : 0;
                            ctx.shadowColor = p.color;
                            ctx.beginPath();
                            ctx.arc(px, py, p.radius, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                };

                draw();

                return () => {
                    if (animIdRef.current) cancelAnimationFrame(animIdRef.current);
                };
            }, [isPlaying, mode]);

            if (!isOpen) {
                return (
                    <button 
                        onClick={() => setIsOpen(true)}
                        className="fixed top-16 md:top-4 right-4 z-50 bg-[#171c26]/90 border border-white/10 px-3 py-1.5 rounded-full text-xs font-bold text-white shadow-xl flex items-center gap-2 hover:bg-[#E50914] transition-all backdrop-blur-md animate-fade-in"
                    >

                        <span>Ver Animación Neón</span>
                    </button>
                );
            }

            return (
                <div className="w-full bg-[#0b0f19]/95 border-b border-white/10 p-3 shadow-2xl backdrop-blur-xl animate-slide-up relative z-40">
                    <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
                        <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 bg-[#10B981]/20 rounded-lg text-[#10B981] border border-[#10B981]/30">
                                    <Icon name="music" size={16} />
                                </div>
                                <div className="flex flex-col">
                                    <span className="text-[10px] uppercase tracking-widest text-[#10B981] font-black flex items-center gap-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-[#10B981] animate-pulse"></span>
                                        ECUALIZADOR NEÓN
                                    </span>
                                    <span className="text-xs font-bold text-white truncate max-w-[200px] sm:max-w-[300px]">{stationTitle || "Radio En Vivo"}</span>
                                </div>
                            </div>

                            {/* Selector de Modos */}
                            <div className="flex items-center gap-1 bg-[#1f2937]/80 p-1 rounded-xl border border-white/10 text-[10px] font-bold">
                                <button 
                                    onClick={() => setMode('espectro')} 
                                    className={`px-2.5 py-1 rounded-lg transition-all ${mode === 'espectro' ? 'bg-[#10B981] text-black shadow font-extrabold' : 'text-gray-400 hover:text-white'}`}
                                >
                                    Espectro
                                </button>
                                <button 
                                    onClick={() => setMode('osciloscopio')} 
                                    className={`px-2.5 py-1 rounded-lg transition-all ${mode === 'osciloscopio' ? 'bg-[#10B981] text-black shadow font-extrabold' : 'text-gray-400 hover:text-white'}`}
                                >
                                    Osciloscopio
                                </button>
                                <button 
                                    onClick={() => setMode('aura')} 
                                    className={`px-2.5 py-1 rounded-lg transition-all ${mode === 'aura' ? 'bg-[#10B981] text-black shadow font-extrabold' : 'text-gray-400 hover:text-white'}`}
                                >
                                    Aura
                                </button>
                            </div>
                        </div>

                        {/* Lienzo del Canvas Neón Ultrafino */}
                        <div className="w-full md:flex-1 h-12 bg-black/60 border border-white/10 rounded-xl overflow-hidden p-1 backdrop-blur-md flex items-center justify-center">
                            <canvas 
                                ref={canvasRef} 
                                width={600} 
                                height={44} 
                                className="w-full h-full block"
                            />
                        </div>

                        <button 
                            onClick={() => setIsOpen(false)}
                            className="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors hidden md:block"
                            title="Minimizar animación"
                        >
                            <Icon name="x" size={18} />
                        </button>
                    </div>
                </div>
            );
        };

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], animados: [] });
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false); 
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);

            // Estados de Radio
            const [currentRadioStation, setCurrentRadioStation] = useState(null);
            const [isRadioPlaying, setIsRadioPlaying] = useState(false);
            const [radioFavorites, setRadioFavorites] = useState([]);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [streamError, setStreamError] = useState(false);
            const [isLoadingRadio, setIsLoadingRadio] = useState(false);
            const [radioSearch, setRadioSearch] = useState('');
            const [visMode, setVisMode] = useState('espectro');
            const [isVisOpen, setIsVisOpen] = useState(true);
            const audioRef = useRef(null);
            const hlsRef = useRef(null);

            // Auto-activación del visualizador cuando comience el audio
            useEffect(() => {
                if (isRadioPlaying) {
                    setIsVisOpen(true);
                }
            }, [isRadioPlaying, currentRadioStation]);

            const navTabs = [
                { id: 'home', icon: 'search', label: 'Inicio' }, 
                { id: 'movies', icon: 'clapperboard', label: 'Cine' }, 
                { id: 'series', icon: 'film', label: 'Series' },
                { id: 'animados', icon: 'smile', label: 'Animados' },
                { id: 'tv', icon: 'tv', label: 'TV' }, 
                { id: 'radio', icon: 'radio', label: 'Radio' }, 
                { id: 'jorgeflix', icon: 'compass', label: 'JorgeFlix' },
                { id: 'spotify', icon: 'music', label: 'Música', isExternal: true, url: 'https://sejo48.github.io/Spotify-local/' },
                { id: 'favorites', icon: 'heart', label: 'Favs' }
            ];

            // Función auxiliar para intentar cargar desde array de URLs con fallback inteligente
            const fetchResourceWithFallback = async (urls) => {
                for (const u of urls) {
                    try {
                        const res = await fetch(u);
                        if (res && res.ok) return res;
                    } catch (e) { }
                }
                return null;
            };

            useEffect(() => {
                const init = async () => {
                    try {
                        setLoading(true);
                        const [resTV, resMovies, resSeries, resAnimados] = await Promise.all([ 
                            fetchResourceWithFallback(URLS.TV),
                            fetchResourceWithFallback(URLS.MOVIES),
                            fetchResourceWithFallback(URLS.SERIES),
                            fetchResourceWithFallback(URLS.ANIMADOS)
                        ]);

                        let tvChannels = [];
                        if (resTV) {
                            const textTV = await resTV.text();
                            tvChannels = parseM3U(textTV);
                        }
                        if (!tvChannels.length) tvChannels = DEMO_TV;

                        let moviesList = [];
                        if (resMovies) {
                            try {
                                const jsonMovies = await resMovies.json();
                                const rawMovies = Array.isArray(jsonMovies) ? jsonMovies : (jsonMovies.peliculas || jsonMovies.content || []);
                                moviesList = rawMovies.map((m, idx) => ({ 
                                    ...m, 
                                    id: `mov-${idx}`, 
                                    type: 'movies', 
                                    title: m.titulo || m.title || m.name, 
                                    description: m.descripcion || m.sinopsis || m.plot, 
                                    image: m.imagen || m.poster || m.image, 
                                    url: convertUrl(m.urlDrive || m.url),
                                    rawUrl: m.urlDrive || m.url
                                }));
                            } catch (e) {}
                        }
                        if (!moviesList.length) moviesList = DEMO_MOVIES;

                        let seriesList = [];
                        if (resSeries) {
                            try {
                                const jsonSeries = await resSeries.json();
                                const rawSeries = Array.isArray(jsonSeries) ? jsonSeries : [];
                                seriesList = rawSeries.map((s, idx) => ({
                                    ...s,
                                    id: `serie-${idx}`,
                                    type: 'series',
                                    title: s.tituloSerie || s.titulo || s.title || s.name,
                                    description: s.descripcion || s.sinopsis,
                                    image: s.imagen || s.poster || s.image,
                                    seasons: (s.temporadas || []).map((t, tIdx) => ({
                                        seasonNumber: t.numeroTemporada || (tIdx + 1),
                                        episodes: (t.episodios || []).map((ep, eIdx) => ({
                                            id: `ep-${idx}-${tIdx}-${eIdx}`,
                                            title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                            url: convertUrl(ep.urlDrive || ep.url)
                                        }))
                                    }))
                                }));
                            } catch(e) {}
                        }
                        if (!seriesList.length) seriesList = DEMO_SERIES;

                        let animadosList = [];
                        if (resAnimados) {
                            try {
                                const jsonAnimados = await resAnimados.json();
                                const rawAnimados = Array.isArray(jsonAnimados) ? jsonAnimados : (jsonAnimados.animados || []);
                                animadosList = rawAnimados.map((a, idx) => ({
                                    ...a,
                                    id: `anim-${idx}`,
                                    type: 'animados',
                                    title: a.titulo || a.tituloSerie || a.title || a.name,
                                    description: a.descripcion || a.sinopsis,
                                    image: a.imagen || a.poster || a.image,
                                    url: convertUrl(a.urlDrive || a.url),
                                    seasons: (a.temporadas || []).map((t, tIdx) => ({
                                        seasonNumber: t.numeroTemporada || (tIdx + 1),
                                        episodes: (t.episodios || []).map((ep, eIdx) => ({
                                            id: `ep-anim-${idx}-${tIdx}-${eIdx}`,
                                            title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                            url: convertUrl(ep.urlDrive || ep.url)
                                        }))
                                    }))
                                }));
                            } catch(e) {}
                        }
                        if (!animadosList.length) animadosList = DEMO_ANIMADOS;

                        setContent({ tv: tvChannels, movies: moviesList, series: seriesList, animados: animadosList });
                    } catch (err) {
                        console.error("Error en inicialización, aplicando respaldo demo", err);
                        setContent({ tv: DEMO_TV, movies: DEMO_MOVIES, series: DEMO_SERIES, animados: DEMO_ANIMADOS });
                    } finally {
                        setLoading(false);
                    }
                };

                const storedFavs = safeStorage.getItem('magistube_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }

                const storedRadioFavs = safeStorage.getItem('magis_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(JSON.parse(storedRadioFavs)); } catch(e) {} }

                init();
            }, []);

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    
                    audioRef.current.addEventListener('error', (e) => {
                        console.error("Error stream radio:", e);
                        setIsRadioPlaying(false);
                        setStreamError(true);
                        setIsLoadingRadio(false);
                    });
                    
                    audioRef.current.addEventListener('waiting', () => setIsLoadingRadio(true));
                    audioRef.current.addEventListener('playing', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                        setIsRadioPlaying(true);
                    });
                    audioRef.current.addEventListener('canplay', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    });
                }

                const audio = audioRef.current;
                audio.volume = radioVolume;

                if (currentRadioStation) {
                    const playAudio = () => {
                        const playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(e => {
                                console.error("Error autoplay radio:", e);
                                setIsRadioPlaying(false);
                                setStreamError(true);
                                setIsLoadingRadio(false);
                            });
                        }
                    };

                    if (audio.dataset.currentUrl !== currentRadioStation.url) {
                        setIsLoadingRadio(true);
                        setStreamError(false);
                        audio.dataset.currentUrl = currentRadioStation.url;
                        
                        if (hlsRef.current) {
                            hlsRef.current.destroy();
                            hlsRef.current = null;
                        }

                        if (currentRadioStation.url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls();
                            hlsRef.current = hls;
                            hls.loadSource(currentRadioStation.url);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                if (isRadioPlaying) playAudio();
                            });
                            hls.on(Hls.Events.ERROR, function (event, data) {
                                if (data.fatal) {
                                    setIsRadioPlaying(false);
                                    setStreamError(true);
                                    setIsLoadingRadio(false);
                                }
                            });
                        } else {
                            audio.src = currentRadioStation.url; 
                            audio.load();
                            if (isRadioPlaying) playAudio();
                        }
                    } else {
                        if (isRadioPlaying) playAudio();
                        else audio.pause();
                    }
                }
            }, [currentRadioStation, isRadioPlaying]);

            useEffect(() => {
                if (audioRef.current) audioRef.current.volume = radioVolume;
            }, [radioVolume]);

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo, group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const toggleFavorite = (item) => { 
                const itemId = item.id || item.title; 
                const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites]; 
                setFavorites(newFavs); 
                safeStorage.setItem('magistube_favs', JSON.stringify(newFavs)); 
            };

            const toggleRadioFavorite = (station, e) => {
                if (e) e.stopPropagation();
                const isFav = radioFavorites.some(f => f.id === station.id);
                let newFavs = isFav ? radioFavorites.filter(f => f.id !== station.id) : [station, ...radioFavorites];
                setRadioFavorites(newFavs);
                safeStorage.setItem('magis_radio_favs', JSON.stringify(newFavs));
            };

            const handlePlay = (item) => { 
                const code = item.codigo || item.password || item.pin; 
                if (code) { setSelectedItem(item); setIsLocked(true); } 
                else { setSelectedItem(item); setIsLocked(false); } 
                setExpandedSeason(0); 
                if (item.type === 'series' || item.type === 'animados') {
                    setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null); 
                } else {
                    setSelectedEpisode(null);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const handlePlayRadioStation = (station) => {
                if (currentRadioStation?.id === station.id) {
                    setIsRadioPlaying(!isRadioPlaying);
                } else {
                    setCurrentRadioStation(station);
                    setIsRadioPlaying(true);
                }
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' 
                    ? [...content.movies, ...content.series, ...content.animados, ...content.tv.slice(0,20)] 
                    : activeTab === 'favorites' 
                    ? favorites 
                    : content[activeTab] || []; 
                if (search && activeTab !== 'jorgeflix') return list.filter(i => (i.title || i.name || i.titulo || '').toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            const heroItem = useMemo(() => (content.movies.length ? content.movies[Math.floor(Math.random() * content.movies.length)] : null), [content]);

            const handleTabClick = (tab) => {
                if (tab.isExternal) {
                    window.open(tab.url, '_blank');
                } else {
                    setActiveTab(tab.id); 
                    setSelectedItem(null); 
                    setSearch(''); 
                    setIsLocked(false);
                }
            };

            if (showIntro) return <IntroScreen onEnter={() => setShowIntro(false)} />;

            return (
                <div className="min-h-screen bg-[#111827] text-white font-sans flex flex-col md:flex-row relative">
                    {/* Sidebar para Escritorio */}
                    <aside className="hidden md:flex w-24 flex-col items-center py-6 bg-[#0f1115] border-r border-[#1f2937] fixed h-full z-50">
                        <div className="mb-6 p-2 bg-[#E50914] rounded-xl shadow-lg cursor-pointer" onClick={() => handleTabClick(navTabs[0])}><Icon name="play" size={24} fill="white" className="text-white"/></div>
                        <div className="flex flex-col gap-1 w-full items-center">
                            {navTabs.map(tab => (
                                <button key={tab.id} onClick={() => handleTabClick(tab)} className={`flex flex-col items-center gap-1 transition-all w-full py-2.5 ${activeTab === tab.id && !tab.isExternal ? 'text-[#E50914] bg-white/5 font-bold border-l-4 border-[#E50914]' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                                    <Icon name={tab.icon} size={20} fill={activeTab === tab.id && tab.id === 'favorites' ? 'currentColor' : 'none'} className={activeTab === tab.id && tab.id === 'favorites' ? 'fill-current' : ''} /><span className="text-[10px] tracking-tight">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="mt-auto flex flex-col items-center gap-4 mb-4">
                            <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 to-yellow-600 flex items-center justify-center font-serif font-bold text-black text-xs border border-white/20">J</div>
                        </div>
                    </aside>

                    {/* Barra de Navegación Móvil Superior */}
                    <div className="md:hidden fixed top-0 w-full bg-[#111827]/95 backdrop-blur z-50 px-3 py-2.5 flex items-center justify-between border-b border-[#1f2937] gap-2">
                        <div className="flex items-center gap-1.5 font-black text-base tracking-tighter cursor-pointer flex-shrink-0" onClick={() => handleTabClick(navTabs[0])}>
                            <span className="text-[#E50914]">MAGIS</span> TUBE
                        </div>

                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                            <button
                                onClick={() => handleTabClick(navTabs.find(t=>t.id==='radio'))}
                                className={`flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs font-bold transition-all flex-shrink-0 ${activeTab === 'radio' ? 'bg-[#E50914] text-white border-[#E50914]' : 'bg-[#1f2937] text-gray-300 border-white/10'}`}
                            >
                                <Icon name="radio" size={15} />
                                <span>Radio</span>
                            </button>
                            <button
                                onClick={() => handleTabClick(navTabs.find(t=>t.id==='jorgeflix'))}
                                className={`flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs font-bold transition-all flex-shrink-0 ${activeTab === 'jorgeflix' ? 'bg-[#E50914] text-white border-[#E50914]' : 'bg-[#1f2937] text-gray-300 border-white/10'}`}
                            >
                                <Icon name="compass" size={15} />
                                <span>JorgeFlix</span>
                            </button>
                        </div>

                        <button onClick={() => handleTabClick(navTabs.find(t=>t.id==='favorites'))} className={`flex-shrink-0 transition-colors active:scale-90 p-1 ${activeTab === 'favorites' ? 'text-[#E50914]' : 'text-gray-400 hover:text-white'}`} aria-label="Favoritos">
                            <Icon name="heart" size={22} fill={activeTab === 'favorites' ? 'currentColor' : 'none'} />
                        </button>
                    </div>

                    {/* Barra Inferior Móvil */}
                    <div className="md:hidden fixed bottom-0 w-full bg-[#0f1115] border-t border-[#1f2937] z-50 flex py-2 pb-safe px-2 overflow-x-auto no-scrollbar snap-x items-center justify-around shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                        {navTabs.filter(t => !['jorgeflix', 'favorites', 'radio'].includes(t.id)).map(tab => (
                            <button key={tab.id} onClick={() => handleTabClick(tab)} className={`flex flex-col items-center justify-center flex-shrink-0 min-w-[56px] py-1 gap-1 snap-start transition-all active:scale-95 rounded-lg ${activeTab === tab.id && !tab.isExternal ? 'text-[#E50914] bg-white/5' : 'text-gray-400 hover:text-white'}`}>
                                <Icon name={tab.icon} size={18} />
                                <span className="text-[9px] font-medium tracking-wide">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Contenido Principal */}
                    <main className="flex-1 md:ml-24 min-h-screen pt-14 md:pt-0 pb-36 md:pb-0 relative z-10">
                        {/* Banner Visualizador Neón Multimodo Persistente */}
                        {currentRadioStation && (
                            <AudioVisualizerBanner 
                                isPlaying={isRadioPlaying && !streamError}
                                stationTitle={currentRadioStation.title}
                                mode={visMode}
                                setMode={setVisMode}
                                isOpen={isVisOpen}
                                setIsOpen={setIsVisOpen}
                            />
                        )}

                        {activeTab === 'radio' ? (
                            <RadioSection 
                                stations={RADIO_STATIONS} 
                                currentStation={currentRadioStation}
                                isPlaying={isRadioPlaying}
                                onPlayStation={handlePlayRadioStation}
                                favorites={radioFavorites}
                                onToggleFavorite={toggleRadioFavorite}
                                volume={radioVolume}
                                setVolume={setRadioVolume}
                                streamError={streamError}
                                isLoading={isLoadingRadio}
                                search={radioSearch}
                                setSearch={setRadioSearch}
                            />
                        ) : activeTab === 'jorgeflix' ? (
                            <JorgeFlixSearch />
                        ) : activeTab === 'favorites' && !selectedItem ? (
                            <div className="p-4 sm:p-8 animate-fade-in">
                                <div className="mb-6 flex items-center gap-3 border-b border-white/10 pb-3">
                                    <div className="p-2 bg-[#E50914]/20 rounded-lg text-[#E50914]"><Icon name="heart" size={20} fill="currentColor" /></div>
                                    <h2 className="text-xl font-bold text-white">Tus Favoritos</h2>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
                                    {favorites.map((item, i) => (<Card key={i} item={item} onClick={handlePlay} isFavorite={true} onToggleFavorite={toggleFavorite} />))}
                                </div>
                                {favorites.length === 0 && <div className="text-center py-20 text-gray-500 text-sm"><p>No tienes favoritos guardados aún.</p></div>}
                            </div>
                        ) : activeTab === 'tv' || (selectedItem && selectedItem.type === 'tv') ? (
                            <div className="flex flex-col lg:flex-row h-full lg:h-screen lg:overflow-hidden">
                                <div className="flex-1 bg-[#111827] relative flex flex-col lg:h-full">
                                    {selectedItem && selectedItem.type === 'tv' ? (
                                        <div className="relative aspect-video w-full bg-[#111827] lg:flex-1 overflow-hidden flex items-center justify-center">
                                            <button onClick={() => setSelectedItem(null)} className="absolute top-3 left-3 z-30 bg-black/60 p-2 rounded-full text-white lg:hidden"><Icon name="arrowLeft" size={18} /></button>
                                            <iframe src={selectedItem.url} className="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                        </div>
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-gray-500 text-sm"><p>Selecciona un canal de TV</p></div>
                                    )}
                                </div>
                                <div className="w-full lg:w-80 bg-[#111827] lg:border-l border-white/10 flex flex-col lg:h-full lg:overflow-hidden">
                                    <div className="p-3 sticky top-14 lg:top-0 bg-[#111827] z-20 border-b border-white/5">
                                        <div className="relative"><input type="text" placeholder="Buscar canal..." className="w-full bg-[#1f2937] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:border-[#E50914] outline-none pl-9" value={search} onChange={(e) => setSearch(e.target.value)}/><Icon name="search" size={16} className="absolute left-3 top-2.5 text-gray-400"/></div>
                                    </div>
                                    <div className="p-2 space-y-1 lg:overflow-y-auto lg:h-full">
                                        {content.tv.filter(c => !search || c.title.toLowerCase().includes(search.toLowerCase())).map(channel => (
                                            <TvListItem key={channel.id} channel={channel} isActive={selectedItem?.id === channel.id} isFavorite={favorites.some(f => f.id === channel.id)} onToggleFavorite={toggleFavorite} onClick={handlePlay} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : selectedItem ? (
                            <div className="animate-fade-in flex flex-col min-h-screen">
                                <div className="w-full bg-black relative aspect-video md:h-[65vh] flex items-center justify-center overflow-hidden">
                                    <div className="absolute top-3 left-3 z-30 flex gap-2">
                                        <button onClick={() => {setSelectedItem(null); setIsLocked(false);}} className="bg-black/70 hover:bg-[#E50914] text-white px-3.5 py-1.5 rounded-full backdrop-blur-md flex items-center gap-1.5 text-xs transition-colors border border-white/15 shadow-lg">
                                            <Icon name="arrowLeft" size={16} /> <span>Volver</span>
                                        </button>
                                    </div>
                                    {isLocked ? (
                                        <LockScreen correctCode={selectedItem.codigo || selectedItem.password || selectedItem.pin} onUnlock={() => setIsLocked(false)} onCancel={() => {setSelectedItem(null); setIsLocked(false);}} />
                                    ) : (selectedItem.type === 'movies' || selectedItem.type === 'movie') && selectedItem.url && selectedItem.url.includes('ok.ru') ? (
                                        <div className="relative w-full h-full flex flex-col items-center justify-center bg-[#090d16] p-6 text-center overflow-hidden">
                                            <img src={selectedItem.imagen || selectedItem.image} className="absolute inset-0 w-full h-full object-cover opacity-15 filter blur-xl" />
                                            <div className="relative z-10 max-w-lg bg-[#111827]/90 border border-white/10 p-6 sm:p-8 rounded-2xl backdrop-blur-md shadow-2xl flex flex-col items-center">
                                                <div className="w-14 h-14 bg-orange-600/20 text-orange-500 rounded-full flex items-center justify-center mb-4 border border-orange-500/30">
                                                    <Icon name="play" size={28} fill="currentColor"/>
                                                </div>
                                                <h2 className="text-xl sm:text-2xl font-black mb-2 text-white">{selectedItem.titulo || selectedItem.title}</h2>
                                                <p className="text-gray-400 text-xs sm:text-sm mb-6 leading-relaxed">
                                                    Esta película está alojada en OK.ru. Presiona el botón para iniciar la reproducción directamente en el servidor seguro.
                                                </p>
                                                <a href={selectedItem.rawUrl || selectedItem.url} target="_blank" rel="noopener noreferrer" className="w-full bg-[#E50914] hover:bg-red-700 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-xl transition-transform active:scale-95 flex items-center justify-center gap-2 text-sm">
                                                    <span>▶ REPRODUCIR EN OK.RU</span>
                                                </a>
                                            </div>
                                        </div>
                                    ) : (
                                        <iframe src={convertUrl((selectedItem.type === 'series' || selectedItem.type === 'animados') && selectedEpisode ? selectedEpisode.url : selectedItem.url)} className="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                    )}
                                </div>
                                {!isLocked && (
                                    <div className="p-4 sm:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6 pb-24">
                                        <div className="lg:col-span-2">
                                            <div className="flex items-start justify-between mb-3">
                                                <div>
                                                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-1">{selectedItem.titulo || selectedItem.title || selectedItem.name}</h1>
                                                    <div className="flex items-center gap-2.5 text-xs text-gray-400">
                                                        <span className="bg-[#1f2937] px-2 py-0.5 rounded text-white uppercase">{selectedItem.type}</span>
                                                    </div>
                                                </div>
                                                <button onClick={() => toggleFavorite(selectedItem)} className="p-2.5 bg-[#1f2937] rounded-full hover:bg-[#2d3748]">
                                                    <Icon name="heart" size={20} className={favorites.some(f => (f.id||f.title) === (selectedItem.id||selectedItem.title)) ? "text-[#E50914] fill-[#E50914]" : "text-gray-400"} fill={favorites.some(f => (f.id||f.title) === (selectedItem.id||selectedItem.title)) ? "#E50914" : "none"} />
                                                </button>
                                            </div>
                                            <p className="text-gray-300 text-xs sm:text-sm leading-relaxed mb-6">{selectedItem.descripcion || selectedItem.sinopsis || "Sin descripción disponible."}</p>
                                        </div>
                                        {((selectedItem.type === 'series' || selectedItem.type === 'animados') && selectedItem.seasons && selectedItem.seasons.length > 0) && (
                                            <div className="bg-[#171c26] border border-white/10 rounded-2xl p-4 flex flex-col h-[500px]">
                                                <h3 className="font-bold text-sm text-white mb-3">Episodios</h3>
                                                <div className="flex gap-2 mb-3 overflow-x-auto pb-2 no-scrollbar">
                                                    {selectedItem.seasons.map((season, sIdx) => (
                                                        <button key={sIdx} onClick={() => setExpandedSeason(sIdx)} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-colors ${expandedSeason === sIdx ? 'bg-[#E50914] text-white' : 'bg-black/40 text-gray-400 hover:text-white'}`}>
                                                            Temporada {season.seasonNumber}
                                                        </button>
                                                    ))}
                                                </div>
                                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1 pr-1">
                                                    {selectedItem.seasons[expandedSeason]?.episodes?.map((ep, eIdx) => (
                                                        <div key={eIdx} onClick={() => setSelectedEpisode(ep)} className={`p-2.5 rounded-xl cursor-pointer flex items-center justify-between text-xs transition-colors ${selectedEpisode?.url === ep.url ? 'bg-[#E50914]/20 text-white border border-[#E50914]/50' : 'hover:bg-white/5 text-gray-300'}`}>
                                                            <div className="flex items-center gap-2 truncate">
                                                                <span className="text-gray-500 font-bold">{eIdx + 1}.</span>
                                                                <span className="truncate">{ep.title}</span>
                                                            </div>
                                                            <Icon name="play" size={14} fill={selectedEpisode?.url === ep.url ? "#E50914" : "none"} />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (

        const JorgeFlixSearch = () => {
            const [lang, setLang] = useState("");
            const [query, setQuery] = useState("");
            const [typeVal, setTypeVal] = useState("");
            const [yearVal, setYearVal] = useState("");
            const [voiceStatus, setVoiceStatus] = useState("🎤 Pulse el micrófono y diga el nombre de la película o serie.");
            const [isListening, setIsListening] = useState(false);
            const [history, setHistory] = useState([]);
            const [engine, setEngine] = useState("yandex");
            const STORAGE_KEY = 'jorgeflix_history_v2';

            useEffect(() => {
                try {
                    const h = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                    setHistory(Array.isArray(h) ? h : []);
                } catch (e) { setHistory([]); }
            }, []);

            const buildQuery = () => {
                let s = 'site:ok.ru/video';
                if (query.trim()) s += ' "' + query.trim() + '"';
                if (yearVal.trim()) s += ' ' + yearVal.trim();
                if (typeVal) s += ' ' + typeVal;
                s += ' español';
                if (lang) s += ' ' + lang;
                return s;
            };

            const currentCmd = buildQuery();

            const startVoice = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setVoiceStatus("❌ El reconocimiento de voz no está disponible en este navegador.");
                    return;
                }
                const r = new SpeechRecognition();
                r.lang = "es-CR";
                r.continuous = false;
                r.interimResults = true;
                setIsListening(true);
                setVoiceStatus("🎙️ Escuchando... hable ahora.");
                r.onresult = (e) => {
                    let text = "";
                    for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
                    setQuery(text.trim());
                };
                r.onerror = (e) => {
                    let msg = "No se pudo usar el micrófono.";
                    if (e.error === "not-allowed") msg = "❌ Permiso de micrófono bloqueado.";
                    if (e.error === "no-speech") msg = "🎤 No detecté voz. Inténtelo nuevamente.";
                    setVoiceStatus(msg);
                };
                r.onend = () => {
                    setIsListening(false);
                    if (query.trim()) setVoiceStatus("✅ Texto reconocido.");
                    else setVoiceStatus("🎤 Pulse el micrófono y diga el nombre de la película o serie.");
                };
                try { r.start(); } catch (e) { r.onend(); }
            };

            const saveHistory = (title, y, t, l) => {
                try {
                    let h = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                    if (!Array.isArray(h)) h = [];
                    h = [{ title, y, t, l }, ...h.filter(x => !(x.title === title && x.y === y && x.t === t && x.l === l))].slice(0, 10);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
                    setHistory(h);
                } catch (e) { }
            };

            const executeSearch = (titleToSearch, year, type, language) => {
                let s = 'site:ok.ru/video';
                if (titleToSearch) s += ' "' + titleToSearch + '"';
                if (year) s += ' ' + year;
                if (type) s += ' ' + type;
                s += ' español';
                if (language) s += ' ' + language;

                let searchUrl = '';
                if (engine === 'okru') {
                    let okQuery = titleToSearch;
                    if (year) okQuery += ' ' + year;
                    if (type) okQuery += ' ' + type;
                    okQuery += ' español';
                    if (language) okQuery += ' ' + language;
                    searchUrl = 'https://ok.ru/video/search?st.search=' + encodeURIComponent(okQuery);
                } else if (engine === 'yandex') {
                    searchUrl = 'https://yandex.com/search/?text=' + encodeURIComponent(s);
                } else if (engine === 'bing') {
                    searchUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(s);
                } else {
                    searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(s);
                }
                window.open(searchUrl, '_blank');
            };

            const handleSearch = () => {
                if (!query.trim()) return;
                saveHistory(query.trim(), yearVal.trim(), typeVal, lang);
                executeSearch(query.trim(), yearVal.trim(), typeVal, lang);
            };

            const repeatHistory = (x) => {
                setQuery(x.title);
                setYearVal(x.y || "");
                setTypeVal(x.t || "");
                setLang(x.l || "");
                saveHistory(x.title, x.y, x.t, x.l);
                executeSearch(x.title, x.y, x.t, x.l);
            };

            const clearHistory = () => {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    setHistory([]);
                } catch (e) { }
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-8 animate-fade-in text-white pb-24">

                                <input placeholder="Nombre de película o serie..." value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSearch()} className="w-full bg-[#090c11] border border-[#29303b] rounded-xl px-4 py-3 text-sm text-white outline-none pr-12 focus:border-gray-500" autoFocus />
                                <button type="button" onClick={startVoice} title="Buscar por voz" className={`absolute right-2 top-2 w-9 h-9 rounded-lg flex items-center justify-center text-lg ${isListening ? 'bg-[#E50914] animate-pulse' : 'bg-[#252b35]'}`}>
                                    {isListening ? '🔴' : '🎤'}
                                </button>
                            </div>
                            <select value={typeVal} onChange={(e) => setTypeVal(e.target.value)} className="bg-[#090c11] border border-[#29303b] rounded-xl px-3 py-3 text-sm text-white outline-none">
                                <option value="">Películas y series</option>
                                <option value="película">Películas</option>
                                <option value="serie">Series</option>
                            </select>
                            <input inputMode="numeric" maxLength="4" placeholder="Año" value={yearVal} onChange={(e) => setYearVal(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSearch()} className="bg-[#090c11] border border-[#29303b] rounded-xl px-3 py-3 text-sm text-white outline-none text-center" />
                        </div>

                        <div className="flex flex-wrap gap-2 mb-4">
                            {[
                                { lang: "", label: "🇪🇸 Cualquier español" },
                                { lang: "latino", label: "🇲🇽 Español latino" },
                                { lang: "castellano", label: "🇪🇸 Castellano" },
                                { lang: "doblada", label: "🎙️ Doblada" },
                                { lang: "subtitulada", label: "💬 Subtitulada" }
                            ].map((f, i) => (
                                <button key={i} onClick={() => setLang(f.lang)} className={`px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors ${lang === f.lang ? 'bg-white text-black border-white' : 'bg-[#171c25] border-[#29303b] text-[#cbd2dc] hover:border-gray-500'}`}>
                                    {f.label}
                                </button>
                            ))}
                        </div>

                        <div className="text-xs text-gray-400 mb-4">{voiceStatus}</div>
                        <div className="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Comando de búsqueda generado</div>
                        <div className="bg-[#080a0e] p-3 rounded-lg font-mono text-xs text-red-400 overflow-x-auto mb-5 border border-[#29303b]">
                            {engine === 'okru' ? "Búsqueda directa en motor interno de OK.ru" : currentCmd}
                        </div>

                        <div className="mb-6">
                            <div className="text-[10px] text-gray-500 uppercase tracking-wider mb-2">Motor de búsqueda</div>
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                <button onClick={() => setEngine('yandex')} className={`py-2 rounded-lg text-xs font-bold transition-all ${engine === 'yandex' ? 'bg-[#ffcc00] text-black shadow-[0_0_10px_rgba(255,204,0,0.3)]' : 'bg-[#171c25] border border-[#29303b] text-gray-400 hover:text-white'}`}>Yandex (Recomendado)</button>
                                <button onClick={() => setEngine('okru')} className={`py-2 rounded-lg text-xs font-bold transition-all ${engine === 'okru' ? 'bg-[#f58220] text-white shadow-[0_0_10px_rgba(245,130,32,0.3)]' : 'bg-[#171c25] border border-[#29303b] text-gray-400 hover:text-white'}`}>Nativo OK.ru</button>
                                <button onClick={() => setEngine('google')} className={`py-2 rounded-lg text-xs font-bold transition-all ${engine === 'google' ? 'bg-white text-black shadow-[0_0_10px_rgba(255,255,255,0.3)]' : 'bg-[#171c25] border border-[#29303b] text-gray-400 hover:text-white'}`}>Google</button>
                                <button onClick={() => setEngine('bing')} className={`py-2 rounded-lg text-xs font-bold transition-all ${engine === 'bing' ? 'bg-[#00aad9] text-white shadow-[0_0_10px_rgba(0,170,217,0.3)]' : 'bg-[#171c25] border border-[#29303b] text-gray-400 hover:text-white'}`}>Bing</button>
                            </div>
                        </div>

                        <button onClick={handleSearch} className="w-full bg-[#E50914] text-white py-3.5 rounded-xl font-bold text-sm hover:bg-red-700 transition-colors shadow-lg flex items-center justify-center gap-2">
                            <Icon name="search" size={18} fill="none" className="text-white" />
                            <span>Buscar ahora en {engine === 'yandex' ? 'Yandex' : engine === 'okru' ? 'OK.ru' : engine === 'bing' ? 'Bing' : 'Google'}</span>
                        </button>
                    </div>

                    <div className="bg-[#11151d] border border-[#29303b] rounded-2xl p-4 sm:p-6 shadow-xl">
                        <h2 className="text-base font-bold mb-3 flex items-center gap-2">🕘 Historial de Búsqueda</h2>
                        {history.length === 0 ? (
                            <p className="text-xs text-gray-500">Todavía no hay búsquedas recientes.</p>
                        ) : (
                            <div className="flex flex-wrap gap-2 items-center">
                                {history.map((x, idx) => (
                                    <button key={idx} onClick={() => repeatHistory(x)} className="bg-[#181e28] border border-[#29303b] hover:border-gray-500 text-[#d8dde5] text-xs px-3.5 py-2 rounded-full transition-colors">
                                        {x.title} {x.y ? `· ${x.y}` : ''}
                                    </button>
                                ))}
                                <button onClick={clearHistory} className="text-xs text-red-400 underline ml-2 hover:text-red-300">Borrar historial</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const IntroScreen = ({ onEnter }) => (
            <div className="fixed inset-0 z-[100] bg-[#111827] flex items-center justify-center overflow-hidden font-sans p-4">

                <div className="relative z-10 text-center max-w-sm w-full animate-slide-up">
                    <div className="mb-3 inline-block bg-[#E50914] px-2.5 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase text-white">Premium Access</div>
                    <h1 className="text-5xl font-black text-white mb-2 tracking-tighter">MAGIS<span className="text-[#E50914]">Tube</span></h1>
                    <p className="text-sm text-gray-400 font-light mb-6 italic">"Donde la nostalgia se encuentra con la tecnología."</p>
                    <button onClick={onEnter} className="w-full bg-white text-black py-3.5 rounded-full font-bold text-base shadow-lg flex items-center justify-center gap-2 mb-8 active:scale-95 transition-transform"><span>Comenzar a Ver</span> <Icon name="play" size={18} fill="black" /></button>
                    <div className="opacity-80"><p className="text-[9px] text-gray-500 uppercase tracking-widest mb-0.5">DISEÑADO Y PROGRAMADO POR</p><h3 className="text-base font-serif text-gold-gradient font-bold mb-1">JORGE ARTURO HERNÁNDEZ MÉNDEZ</h3><p className="text-[9px] text-gray-600">Potenciado por <span className="text-blue-400">Gemini AI</span></p></div>
                </div>

        const HeroSection = ({ item, onPlay, isFavorite, onToggleFavorite }) => {
            if (!item) return null;
            const imgSource = item.imagen || item.image || item.poster;
            const titleSource = item.titulo || item.title || item.name;
            const descSource = item.descripcion || item.sinopsis || item.plot;
            const isMovie = item.type === 'movies' || item.type === 'movie';
            const isExternalMovie = isMovie && item.url && (item.url.includes('ok.ru') || item.url.includes('youtube.com') || item.url.includes('youtu.be'));
            
            return (
                <div className="relative w-full h-[320px] sm:h-[380px] bg-[#0b0f19] overflow-hidden rounded-3xl mb-8 group animate-fade-in shadow-2xl border border-white/5 flex items-center">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <img src={imgSource} alt="Hero BG" className="w-full h-full object-cover filter blur-md opacity-75 scale-125 brightness-125 contrast-125" onError={(e) => e.target.style.display='none'} />
                        <div className="absolute inset-0 bg-gradient-to-r from-[#0b0f19]/80 via-[#0b0f19]/40 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent"></div>
                    </div>
                    <div className="relative z-10 w-full h-full flex flex-col sm:flex-row items-center justify-start px-6 sm:px-12 max-w-7xl mx-auto gap-8">
                        <div className="w-32 sm:w-44 aspect-[2/3] rounded-xl overflow-hidden shadow-2xl border border-white/20 flex-shrink-0 bg-black/50 transform group-hover:scale-105 transition-transform duration-300 relative">
                            <img src={imgSource} alt={titleSource} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x450/1f2937/ffffff?text=Poster'} />
                            {isExternalMovie && (<span className="absolute bottom-2 right-2 bg-black/80 text-orange-400 text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1 shadow border border-orange-500/30">🌐 Externo</span>)}
                        </div>
                        <div className="flex-1 flex flex-col gap-2 items-start max-w-xl">
                            <span className="bg-[#E50914] text-white text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-wider shadow">Destacado</span>
                            <h1 className="text-2xl sm:text-4xl font-black text-white leading-tight drop-shadow-md line-clamp-1">{titleSource}</h1>
                            <p className="text-gray-100 text-xs sm:text-sm line-clamp-3 leading-relaxed drop-shadow">{descSource || "Disfruta del mejor contenido seleccionado para ti."}</p>
                            <div className="flex gap-3 mt-3">
                                <button onClick={() => onPlay(item)} className="bg-white text-black px-6 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 active:scale-95 transition-transform shadow-lg hover:bg-gray-200">
                                    <Icon name="play" size={16} fill="black"/> {isExternalMovie ? "Ver en OK.ru" : "Reproducir"}
                                </button>
                                <button onClick={() => onToggleFavorite(item)} className="bg-white/20 text-white p-2.5 rounded-xl flex items-center justify-center backdrop-blur-md border border-white/30 hover:bg-white/40">
                                    <Icon name="heart" size={18} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : "text-white"} fill={isFavorite ? "#E50914" : "none"} />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TvListItem = ({ channel, isActive, onClick, isFavorite, onToggleFavorite }) => (
            <div tabIndex="0" onClick={() => onClick(channel)} className={`group flex items-center gap-3 p-3 border-b border-white/5 cursor-pointer transition-colors ${isActive ? 'bg-[#1f2937] border-l-4 border-l-[#E50914]' : 'hover:bg-white/5'}`} > 
                <div className="w-10 h-7 rounded bg-black flex items-center justify-center overflow-hidden flex-shrink-0 border border-white/10"> 
                    {channel.image ? ( <img src={channel.image} alt={channel.title} loading="lazy" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} /> ) : ( <Icon name="tv" size={14} className="text-gray-400"/> )} 
                </div> 
                <div className="flex-1 min-w-0"> 
                    <p className={`text-xs sm:text-sm font-medium truncate ${isActive ? 'text-[#E50914]' : 'text-white'}`}>{channel.title}</p> 
                    <p className="text-[10px] text-gray-500 truncate">{channel.group || 'General'}</p> 
                </div> 
                <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(channel); }} className="p-2 rounded-full text-gray-400 hover:text-white"> 
                    <Icon name="heart" size={16} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : ""} fill={isFavorite ? "#E50914" : "none"} /> 
                </button> 
            </div> 
        );

        const Card = ({ item, onClick, isFavorite, onToggleFavorite }) => { 
            const isTv = item.type === 'tv'; 
            const hasLock = item.codigo || item.password || item.pin; 
            const isKids = item.isKids || item.type === 'animados';
            const isMovie = item.type === 'movies' || item.type === 'movie';
            const isExternalMovie = isMovie && item.url && (item.url.includes('ok.ru') || item.url.includes('youtube.com') || item.url.includes('youtu.be'));
            const imgSource = item.imagen || item.image || item.poster || item.logo;
            const titleSource = item.titulo || item.title || item.name;
            return ( 
                <div tabIndex="0" className="group relative flex flex-col gap-1.5 cursor-pointer active:scale-95 transition-transform" onClick={() => onClick(item)}> 
                    <div className={`relative overflow-hidden rounded-lg bg-[#1f2937] shadow-md ${isTv ? 'aspect-video' : 'aspect-[2/3]'}`}> 
                        <img src={imgSource} loading="lazy" className={`w-full h-full ${isTv ? 'object-contain p-3' : 'object-cover'}`} onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/300x450/1f2937/ffffff?text=X`; }} alt={titleSource} /> 
                        <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(item); }} className="absolute top-1.5 right-1.5 p-1.5 bg-black/60 rounded-full text-white"> 
                            <Icon name="heart" size={14} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : ""} fill={isFavorite ? "#E50914" : "none"} /> 
                        </button> 
                        <div className="absolute bottom-1.5 left-1.5 flex gap-1 flex-wrap"> 
                            {isTv && <span className="bg-[#E50914] text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow">LIVE</span>} 
                            {isKids && <span className="bg-blue-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow">KIDS</span>}
                            {isExternalMovie && <span className="bg-orange-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow flex items-center gap-0.5">🌐 Externo</span>}
                            {hasLock && <span className="bg-yellow-500 text-black text-[8px] font-bold px-1.5 py-0.5 rounded shadow flex items-center gap-0.5"><Icon name="lock" size={7}/> PIN</span>} 
                        </div> 
                    </div> 
                    <h3 className="text-xs font-bold text-gray-200 truncate">{titleSource}</h3> 
                </div> 
            ); 
        };

        const Icon = ({ name, size = 22, className, fill = "none" }) => {
            const icons = {
                search: <path d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 111.414-1.414 7.5 7.5 0 01-1.414 1.414z" />,
                x: <path d="M6 18L18 6M6 6l12 12" />,
                tv: <path d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />,
                film: <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                pause: <path d="M6 4h4v16H6zM14 4h4v16h-4z" />,
                heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />,
                arrowLeft: <path d="M19 12H5m7 7l-7-7 7-7" />,
                chevronDown: <path d="M6 9l6 6 6-6" />,
                chevronUp: <path d="M18 15l-6-6-6 6" />,
                clapperboard: <g><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.3 1.3-2.8l3.2-1.4c1.1-.5 2.3.2 2.8 1.3l.9 2.4l7.9-3l2 4.5Z"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></g>,
                lock: <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a7 7 0 00-14 0v2" />,
                smile: <g><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></g>,
                compass: <g><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></g>,
                music: <g><path d="M9 18V5l12-2v13"></path><path d="M9 9l12-2"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></g>,
                radio: <path d="M2 12a10 10 0 0110-10 10 10 0 0110 10M6 12a6 6 0 016-6 6 6 0 016 6M10 12a2 2 0 012-2 2 2 0 012 2v8a2 2 0 01-2 2 2 2 0 01-2-2v-8z" />,
                volume: <path d="M11 5L6 9H2v6h4l5 4V5z M15.54 8.46a5 5 0 010 7.07 M19.07 4.93a10 10 0 010 14.14" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.search}
                </svg>
            );
        };

        const LockScreen = ({ onUnlock, correctCode, onCancel }) => {
            const [input, setInput] = useState(''); const [error, setError] = useState(false);
            const handleSubmit = (e) => { e.preventDefault(); if (input === String(correctCode)) onUnlock(); else { setError(true); setInput(''); } };
            return (<div className="absolute inset-0 z-50 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 animate-fade-in"><div className="bg-[#1f2937] p-6 rounded-xl max-w-xs w-full text-center border border-white/10 shadow-2xl"><div className="mb-4 flex justify-center"><div className="p-3 bg-red-500/20 rounded-full text-red-500 border border-red-500/30"><Icon name="lock" size={28} /></div></div><h2 className="text-base font-bold text-white mb-2">Contenido Protegido</h2><form onSubmit={handleSubmit}><input type="password" maxLength="4" className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-2.5 text-center text-xl tracking-[0.4em] text-white focus:border-[#E50914] outline-none mb-3" value={input} onChange={(e) => { setInput(e.target.value); setError(false); }} placeholder="••••" autoFocus />{error && <p className="text-red-500 text-xs mb-3 font-bold">Código incorrecto</p>}<div className="flex gap-2"><button type="button" onClick={onCancel} className="flex-1 py-2 rounded-lg border border-white/10 text-gray-300 hover:bg-white/5 text-xs">Cancelar</button><button type="submit" className="flex-1 py-2 rounded-lg bg-[#E50914] text-white font-bold hover:bg-red-700 text-xs">Acceder</button></div></form></div></div>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
