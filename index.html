    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: #F8F9FC;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding-bottom: 80px;
        }
        .font-display { font-family: 'Outfit', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #FF3B71, #6366F1); 
            border-radius: 10px; 
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-fade-up { animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-slow { animation: pulse-slow 2.5s ease-in-out infinite; }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .glass {
            background: rgba(24, 26, 40, 0.72);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .grid-bg {
            background-image: 
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.10) 0%, transparent 55%),
                radial-gradient(circle at bottom right, rgba(255, 59, 113, 0.07) 0%, transparent 55%),
                radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 60%, 100% 60%, 40px 40px;
            background-repeat: no-repeat, no-repeat, repeat;
        }
        .card-hover {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-hover:active {
            transform: scale(0.97);
        }
        .card-hover:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(255, 59, 113, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(255, 59, 113, 0.15);
        }
        /* Equalizer */
        .eq-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 32px;
            width: 100%;
        }
        .eq-bar {
            width: 5px;
            background: linear-gradient(180deg, #FF3B71, #6366F1);
            border-radius: 3px;
            transform-origin: bottom;
            transition: transform 0.15s ease;
            will-change: transform;
            box-shadow: 0 0 8px rgba(255, 59, 113, 0.4);
        }
        .eq-playing .eq-bar:nth-child(1) { animation: eqBounce1 0.6s ease-in-out infinite alternate; }
        .eq-playing .eq-bar:nth-child(2) { animation: eqBounce2 0.5s ease-in-out infinite alternate; }
        .eq-playing .eq-bar:nth-child(3) { animation: eqBounce3 0.7s ease-in-out infinite alternate; }
        .eq-playing .eq-bar:nth-child(4) { animation: eqBounce4 0.45s ease-in-out infinite alternate; }
        .eq-playing .eq-bar:nth-child(5) { animation: eqBounce5 0.55s ease-in-out infinite alternate; }

        @keyframes eqBounce1 {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1.0); }
        }
        @keyframes eqBounce2 {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(0.9); }
        }
        @keyframes eqBounce3 {
            0% { transform: scaleY(0.1); }
            100% { transform: scaleY(1.1); }
        }
        @keyframes eqBounce4 {
            0% { transform: scaleY(0.6); }
            100% { transform: scaleY(0.8); }
        }
        @keyframes eqBounce5 {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.0); }
        }
        .radio-active {
            border-color: #FF3B71 !important;
            box-shadow: 0 0 30px rgba(255, 59, 113, 0.25), inset 0 0 30px rgba(255, 59, 113, 0.05);
        }
        /* bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 68px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom-nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 4px 0;
            gap: 2px;
            font-size: 10px;
            color: #9CA3AF;
            transition: color 0.2s;
            border: none;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav button i {
            font-size: 22px;
            line-height: 1;
        }
        .bottom-nav button.active {
            color: #FF3B71;
        }
        .bottom-nav button span {
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media (max-width: 640px) {
            .header-title { font-size: 0.9rem; }
            .poster-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        }
        @media (min-width: 641px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 0; }
        }
        .tv-list-scroll {
            scroll-behavior: smooth;
        }
        .tv-channel-active {
            background: rgba(255, 59, 113, 0.12) !important;
            border: 1px solid rgba(255, 59, 113, 0.5) !important;
            box-shadow: 0 0 20px rgba(255, 59, 113, 0.15);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-bg text-textMain min-h-screen grid-bg selection:bg-accent/30">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: ['./peliculas.json', './peliculas2.json'],
            ANIMADOS: './animados.json',
            RADIOS: './radios.json'
        };
        const RAW_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/playlist.json',
            MOVIES: [
                'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas.json',
                'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas2.json'
            ],
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/animados.json',
            RADIOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/radios.json'
        };
        const QR_IMAGE_URL = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgsPiFVGiGuwJ3smwIQGJ-25kEkpEZpmR4PNZLdRF0_3LVfWAj2xhWSHiK7pY-C3jera3PD_XpmEtNy0kaCW1m8dayT9ebTV3YNBmbzMZeHF_oIf2XlniVGt6pj6BqtTyWEaUts1Ll_vYx2RuJvlrF9rqIwWcYcwMkTcdLCI-bShcR_KhhoILWEkdJ4Z4w/s1600/mi-qr-pro.png';

        const DEFAULT_RADIO_STATIONS = [
            { id: 'cr-sinfonola', title: 'Radio Sinfonola 90.3 FM', group: 'Romántica / Clásicos', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://live.turadio.stream:7006/;' },
            { id: 'cr-hit', title: 'Hit 104.7 FM', group: 'Juvenil / Pop', image: 'https://static.mytuner.mobi/media/tvos_radios/164/radio-hit-1047-fm.1180f4a3.jpg', url: 'https://live.turadio.stream:7004/stream?nocache=596&type=http' },
            { id: 'cr-crc', title: 'CRC 94.7 FM', group: 'Alternativo / Rock', image: 'https://static.mytuner.mobi/media/tvos_radios/nAwNLxJbnm.png', url: 'https://23263.live.streamtheworld.com/CRC_947AAC_SC' },
            { id: 'cr-zeta', title: 'Zeta FM 95.1', group: 'Tropical / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/879/zeta-fm.feb3fb70.png', url: 'https://d5g44yionyslb.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-monumental', title: 'Radio Monumental 93.5 FM', group: 'Noticias / Deportes', image: 'https://static.mytuner.mobi/media/tvos_radios/574/radio-monumental.7303764d.png', url: 'https://d26gdpbozqq700.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-mejor', title: 'La Mejor 99.1 FM', group: 'Regional / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/575/la-mejor-991.95c72890.png', url: 'https://d3svz5xnvdysyz.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-r2', title: 'Radio Dos 99.5 FM', group: 'Clásicos / Rock', image: 'https://placehold.co/300x300/6366F1/ffffff?text=R2', url: 'https://icecasthd.teletica.com/radiodos' },
            { id: 'cr-los40', title: 'Los 40 Costa Rica 104.3 FM', group: 'Éxitos / Urbano', image: 'https://placehold.co/300x300/F59E0B/000000?text=LOS40', url: 'https://icecasthd.teletica.com/los40' },
            { id: 'cr-disney', title: 'Radio Disney 101.1 FM', group: 'Pop / Éxitos', image: 'https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg', url: 'https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8' },
            { id: 'cr-wao', title: 'WAO 92.3 FM', group: 'Urbano / Reggaeton', image: 'https://placehold.co/300x300/FF3B71/ffffff?text=WAO', url: 'https://icecasthd.teletica.com/wao' },
            { id: 'cr-musical', title: 'Radio Musical 97.5 FM', group: 'Romántica / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/085/radio-musical.fea3e089.jpg', url: 'https://live.turadio.stream:7005/stream/1/' }
        ];

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) fileId = url.split('/file/d/')[1]?.split('/')[0];
                else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE')) return isJson ? JSON.parse(text) : text;
                }
            } catch (e) {}
            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) return isJson ? await resRaw.json() : await resRaw.text();
            } catch (e) {}
            return null;
        };

        const parseM3U = (data) => {
            const lines = data.split('\n');
            const channels = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const url = lines[i + 1]?.trim() || '';
                    if (url.startsWith('http')) {
                        const logo = line.match(/tvg-logo="([^"]*)"/)?.[1] || '';
                        const group = line.match(/group-title="([^"]*)"/)?.[1] || 'Nacionales';
                        const title = line.slice(line.lastIndexOf(',') + 1).trim() || 'Canal en Vivo';
                        channels.push({ id: `tv-${i}`, title, image: logo || 'https://placehold.co/300x200/181A28/FF3B71?text=Magic+TV', group, url, type: 'tv' });
                    }
                }
            }
            return channels;
        };

        const Equalizer = ({ playing }) => (
            <div className={`eq-container ${playing ? 'eq-playing' : ''}`}>
                {[1,2,3,4,5].map(i => <div key={i} className="eq-bar" style={{ height: `${20 + (i * 10)}%` }} />)}
            </div>
        );

        const SplashScreen = () => (
            <div className="fixed inset-0 flex flex-col items-center justify-center z-50 bg-bg">
                <div className="relative mb-8">
                    <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-accent via-secondary to-accentLight p-1 animate-pulse-slow">
                        <div className="w-full h-full rounded-3xl bg-bg flex items-center justify-center">
                            <i className="ph-fill ph-play text-3xl text-accent ml-1"></i>
                        </div>
                    </div>
                    <div className="absolute -inset-3 rounded-full border border-accent/30 animate-[spin-slow_8s_linear_infinite]"></div>
                </div>
                <h1 className="font-display text-2xl font-extrabold tracking-tight">
                    MAGIC <span className="text-transparent bg-clip-text bg-gradient-to-r from-accent to-secondary">TV 3.0</span>
                </h1>
                <p className="text-textMuted text-xs mt-2 tracking-widest uppercase">Cargando experiencia...</p>
            </div>
        );

        // ------------------------------------------------------------
        // APP
        // ------------------------------------------------------------
        const App = () => {
            const [currentTab, setCurrentTab] = useState('home');
            const [activeMedia, setActiveMedia] = useState(null);
            const [favorites, setFavorites] = useState([]);
            const [activeRadio, setActiveRadio] = useState(null);
            const [isPlayingRadio, setIsPlayingRadio] = useState(false);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showAuthorModal, setShowAuthorModal] = useState(false);
            const [loading, setLoading] = useState(true);
            const [content, setContent] = useState({ tv: [], movies: [], series: [], animados: [], radios: DEFAULT_RADIO_STATIONS });
            
            const audioRef = useRef(null);
            const hlsRef = useRef(null);

            // Cargar datos
            useEffect(() => {
                const loadData = async () => {
                    try {
                        const moviePromises = URLS.MOVIES.map((p, i) => fetchSmart(p, RAW_URLS.MOVIES[i], true));
                        const [dataTV, dataSeries, dataAnimados, dataRadios, ...moviesResults] = await Promise.all([
                            fetchSmart(URLS.TV, RAW_URLS.TV, false),
                            fetchSmart(URLS.SERIES, RAW_URLS.SERIES, true),
                            fetchSmart(URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                            fetchSmart(URLS.RADIOS, RAW_URLS.RADIOS, true),
                            ...moviePromises
                        ]);

                        const tvChannels = dataTV ? parseM3U(dataTV) : [];
                        
                        const moviesList = [];
                        moviesResults.forEach((data, idx) => {
                            if (data) {
                                const raw = Array.isArray(data) ? data : (data.peliculas || data.content || []);
                                raw.map(m => moviesList.push({
                                    ...m,
                                    id: `mov-${idx}-${moviesList.length}`,
                                    type: 'movies',
                                    title: m.titulo || m.title || m.name,
                                    description: m.descripcion || m.sinopsis || m.plot,
                                    image: m.imagen || m.poster || m.image,
                                    url: convertUrl(m.urlDrive || m.url || m.urlOkRu),
                                    group: 'Cine Premium',
                                    rating: m.rating || '9.3'
                                }));
                            }
                        });

                        const seriesList = [];
                        if (dataSeries) {
                            const raw = Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || []);
                            raw.map((s, i) => seriesList.push({
                                ...s,
                                id: `serie-${i}`,
                                type: 'series',
                                title: s.tituloSerie || s.titulo || s.title || s.name,
                                description: s.descripcion || s.sinopsis,
                                image: s.imagen || s.poster || s.image,
                                group: 'Series',
                                seasons: (s.temporadas || []).map((t, ti) => ({
                                    seasonNumber: t.numeroTemporada || ti + 1,
                                    episodes: (t.episodios || []).map((ep, ei) => ({
                                        id: `ep-${i}-${ti}-${ei}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${ei + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        const animadosList = [];
                        if (dataAnimados) {
                            const raw = Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || []);
                            raw.map((a, i) => animadosList.push({
                                ...a,
                                id: `anim-${i}`,
                                type: 'animados',
                                title: a.titulo || a.tituloSerie || a.title || a.name,
                                description: a.descripcion || a.sinopsis,
                                image: a.imagen || a.poster || a.image,
                                group: 'Animados & Familia',
                                seasons: (a.temporadas || []).map((t, ti) => ({
                                    seasonNumber: t.numeroTemporada || ti + 1,
                                    episodes: (t.episodios || []).map((ep, ei) => ({
                                        id: `epanim-${i}-${ti}-${ei}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${ei + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        let radioList = DEFAULT_RADIO_STATIONS;
                        if (dataRadios) {
                            const list = Array.isArray(dataRadios) ? dataRadios : (dataRadios.radios || dataRadios.emisoras || []);
                            if (list.length) radioList = list;
                        }

                        setContent({ tv: tvChannels, movies: moviesList, series: seriesList, animados: animadosList, radios: radioList });
                    } catch (e) { console.error('Error cargando contenido:', e); }
                    finally { setLoading(false); }
                };
                loadData();
                const saved = safeStorage.getItem('magictv3_favs');
                if (saved) try { setFavorites(JSON.parse(saved)); } catch(e) {}
            }, []);

            const toggleFavorite = (item) => {
                const id = item.id || item.title;
                const updated = favorites.some(f => (f.id || f.title) === id)
                    ? favorites.filter(f => (f.id || f.title) !== id)
                    : [...favorites, item];
                setFavorites(updated);
                safeStorage.setItem('magictv3_favs', JSON.stringify(updated));
            };

            // Radio
            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.crossOrigin = 'anonymous';
                    audioRef.current.addEventListener('error', () => setIsPlayingRadio(false));
                }
                const audio = audioRef.current;
                audio.volume = radioVolume;
                if (activeRadio) {
                    const play = () => audio.play().catch(() => setIsPlayingRadio(false));
                    if (audio.dataset.currentUrl !== activeRadio.url) {
                        audio.dataset.currentUrl = activeRadio.url;
                        hlsRef.current?.destroy();
                        hlsRef.current = null;
                        if (activeRadio.url.includes('.m3u8') && Hls.isSupported()) {
                            const hls = new Hls();
                            hlsRef.current = hls;
                            hls.loadSource(activeRadio.url);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => isPlayingRadio && play());
                        } else {
                            audio.src = activeRadio.url;
                            audio.load();
                            isPlayingRadio && play();
                        }
                    } else {
                        isPlayingRadio ? play() : audio.pause();
                    }
                }
            }, [activeRadio, isPlayingRadio, radioVolume]);

            const handlePlayStation = (station) => {
                if (activeRadio?.id === station.id) setIsPlayingRadio(!isPlayingRadio);
                else { setActiveRadio(station); setIsPlayingRadio(true); }
            };

            if (loading) return <SplashScreen />;

            // ---------- Subcomponentes internos ----------
            const MediaViewer = ({ media }) => {
                const videoRef = useRef(null);
                const [season, setSeason] = useState(0);
                const [ep, setEp] = useState(media.seasons?.[0]?.episodes?.[0] || null);
                const isSeries = (media.type === 'series' || media.type === 'animados') && media.seasons?.length > 0;
                const url = isSeries && ep ? ep.url : media.url;
                const isEmbed = url && (url.includes('drive.google.com') || url.includes('ok.ru'));

                useEffect(() => {
                    const v = videoRef.current;
                    if (!v || !url) return;
                    if (url.includes('.m3u8')) {
                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(v);
                        } else if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = url;
                    } else v.src = url;
                }, [url]);

                return (
                    <div className="space-y-4 animate-fade-up">
                        <button onClick={() => setActiveMedia(null)} className="flex items-center gap-2 px-4 py-2 rounded-full glass-light hover:bg-white/10 transition-all text-sm">
                            <i className="ph-arrow-left"></i> Volver
                        </button>
                        <div className="aspect-video rounded-2xl overflow-hidden bg-black shadow-float border border-white/5">
                            {isEmbed ? <iframe src={url} className="w-full h-full border-0" allowFullScreen title={media.title} />
                            : <video ref={videoRef} controls autoPlay playsInline className="w-full h-full" />}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="md:col-span-2 glass rounded-2xl p-4 space-y-3">
                                <span className="px-3 py-1 rounded-full bg-accent/10 text-accent text-xs font-semibold inline-block">{media.group}</span>
                                <h1 className="font-display text-2xl md:text-3xl font-extrabold">{media.title}</h1>
                                <p className="text-textMuted text-sm leading-relaxed">{media.description || 'Disfruta de este contenido en calidad cristalina.'}</p>
                            </div>
                            {isSeries && (
                                <div className="glass rounded-2xl p-4 space-y-3 max-h-[350px] flex flex-col">
                                    <h3 className="font-bold text-sm">Temporadas y Episodios</h3>
                                    <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                        {media.seasons.map((t, i) => (
                                            <button key={i} onClick={() => setSeason(i)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap ${season === i ? 'bg-accent text-white' : 'bg-surface hover:bg-white/5'}`}>
                                                T {t.seasonNumber}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                                        {media.seasons[season].episodes.map((e, i) => (
                                            <div key={i} onClick={() => setEp(e)} className={`p-2 rounded-xl cursor-pointer text-xs ${ep?.url === e.url ? 'bg-accent/10 border border-accent/30' : 'hover:bg-white/5'}`}>
                                                {i + 1}. {e.title}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const HomeSection = () => {
                const featured = useMemo(() => content.movies.slice(-10)[Math.floor(Math.random() * 10)] || content.movies[0] || content.series[0], [content.movies, content.series]);
                return (
                    <div className="space-y-8 animate-fade-up">
                        {featured && (
                            <div className="relative rounded-2xl overflow-hidden glass shadow-float border border-white/5 p-4 md:p-8 flex flex-col md:flex-row gap-6 items-center">
                                <div className="absolute inset-0 -z-10">
                                    <img src={featured.image} alt="" className="w-full h-full object-cover blur-3xl opacity-20 scale-125" />
                                    <div className="absolute inset-0 bg-gradient-to-r from-bg via-bg/80 to-transparent"></div>
                                </div>
                                <div className="w-32 md:w-52 aspect-[2/3] rounded-xl overflow-hidden shadow-2xl border border-white/10 animate-float flex-shrink-0">
                                    <img src={featured.image} alt={featured.title} className="w-full h-full object-contain bg-black/40" />
                                </div>
                                <div className="flex-1 space-y-3 text-center md:text-left">
                                    <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 text-xs text-textMuted">
                                        <span className="px-2 py-0.5 rounded-full bg-accent/10 text-accent font-semibold">✨ Recomendado</span>
                                        <span>★ {featured.rating || '9.3'}</span>
                                    </div>
                                    <h2 className="font-display text-2xl md:text-4xl font-extrabold leading-tight">{featured.title}</h2>
                                    <p className="text-textMuted text-sm leading-relaxed max-w-2xl mx-auto md:mx-0">{featured.description || 'Disfruta de este contenido en calidad cristalina.'}</p>
                                    <div className="flex flex-wrap gap-3 pt-2 justify-center md:justify-start">
                                        <button onClick={() => setActiveMedia(featured)} className="px-5 py-2.5 rounded-full bg-gradient-to-r from-accent to-secondary text-white font-bold shadow-glow hover:shadow-glow-soft transition-all active:scale-95 text-sm">
                                            <i className="ph-fill ph-play mr-2"></i> Reproducir
                                        </button>
                                        <button onClick={() => toggleFavorite(featured)} className="w-10 h-10 rounded-full glass-light flex items-center justify-center hover:bg-white/10 transition-all">
                                            <i className={`ph-fill ph-heart ${favorites.some(f => f.id === featured.id) ? 'text-accent' : 'text-textMuted'}`}></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {[
                            { title: 'Películas', items: content.movies.slice(0, 4), tab: 'movies' },
                            { title: 'Series', items: content.series.slice(0, 4), tab: 'series' },
                            { title: 'Animados', items: content.animados.slice(0, 4), tab: 'animados' }
                        ].map(section => (
                            <section key={section.tab} className="animate-fade-up stagger-1">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="font-display text-lg font-bold">{section.title}</h3>
                                    <button onClick={() => setCurrentTab(section.tab)} className="text-accent text-xs font-semibold hover:underline">Ver todo →</button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    {section.items.map(item => (
                                        <div key={item.id} onClick={() => setActiveMedia(item)} className="glass rounded-xl p-2 card-hover cursor-pointer">
                                            <div className="aspect-[2/3] rounded-lg overflow-hidden mb-2 bg-black/50 relative group">
                                                <img src={item.image} alt={item.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={e => e.target.src='https://placehold.co/300x450/181A28/FF3B71?text=Magic+TV'} />
                                                <button onClick={e => { e.stopPropagation(); toggleFavorite(item); }} className="absolute top-1 right-1 w-7 h-7 rounded-full bg-black/60 flex items-center justify-center backdrop-blur-md">
                                                    <i className={`ph-fill ph-heart text-xs ${favorites.some(f => f.id === item.id) ? 'text-accent' : 'text-white/70'}`} />
                                                </button>
                                            </div>
                                            <h4 className="font-semibold text-xs truncate">{item.title}</h4>
                                            <p className="text-xs text-textMuted mt-0.5">★ {item.rating || '9.0'}</p>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        ))}
                    </div>
                );
            };

            // ---------- SECCIÓN TV CON SCROLL AUTOMÁTICO AL REPRODUCTOR ----------
            const TVSection = () => {
                const [selected, setSelected] = useState(content.tv[0] || null);
                const [filter, setFilter] = useState('ALL');
                const listRef = useRef(null);
                const playerRef = useRef(null); // <-- referencia al contenedor del reproductor

                const groups = useMemo(() => ['ALL', ...Array.from(new Set(content.tv.map(c => c.group || 'Nacionales')))], [content.tv]);
                const filtered = useMemo(() => content.tv.filter(c => filter === 'ALL' || c.group === filter), [content.tv, filter]);
                const isEmbed = selected?.url && (selected.url.includes('drive.google.com') || selected.url.includes('ok.ru'));

                // Función para seleccionar canal y hacer scroll al reproductor
                const selectChannel = (ch) => {
                    setSelected(ch);
                    // Desplazamiento suave hacia el reproductor
                    if (playerRef.current) {
                        playerRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                };

                // Efecto para hacer scroll dentro de la lista (mantener visible el canal activo)
                useEffect(() => {
                    if (listRef.current && selected) {
                        const activeEl = listRef.current.querySelector('.tv-channel-active');
                        if (activeEl) {
                            activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                }, [selected]);

                return (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 animate-fade-up">
                        <div className="md:col-span-2 space-y-4">
                            {/* Contenedor del reproductor con ref */}
                            <div ref={playerRef} className="aspect-video rounded-2xl overflow-hidden bg-black shadow-float border border-white/5">
                                {selected ? (
                                    isEmbed ? <iframe src={selected.url} className="w-full h-full border-0" allowFullScreen title={selected.title} />
                                    : <video src={selected.url} controls autoPlay playsInline className="w-full h-full" />
                                ) : <div className="flex flex-col items-center justify-center h-full text-textMuted"><i className="ph-tv text-4xl mb-2" /><p>Selecciona un canal</p></div>}
                            </div>
                            {selected && (
                                <div className="glass rounded-2xl p-3 flex items-center gap-3">
                                    <img src={selected.image} alt="" className="w-12 h-12 rounded-lg object-contain bg-black/40 p-1" />
                                    <div className="flex-1">
                                        <h3 className="font-bold text-base">{selected.title}</h3>
                                        <p className="text-accent text-xs flex items-center gap-2 mt-0.5">
                                            <span className="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span> En vivo · HD
                                        </p>
                                    </div>
                                    <button onClick={() => toggleFavorite(selected)} className="p-2 rounded-xl glass-light">
                                        <i className={`ph-fill ph-heart ${favorites.some(f => f.id === selected.id) ? 'text-accent' : 'text-textMuted'}`} />
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="glass rounded-2xl p-3 h-[400px] md:h-[calc(100vh-160px)] flex flex-col">
                            <div className="pb-3 border-b border-white/5 space-y-2">
                                <h2 className="font-display font-bold flex items-center gap-2 text-base"><i className="ph-tv text-accent" /> Canales</h2>
                                <select value={filter} onChange={e => setFilter(e.target.value)} className="w-full bg-surface border border-white/5 rounded-xl px-3 py-2 text-xs">
                                    {groups.map(g => <option key={g} value={g}>{g === 'ALL' ? 'Todos los canales' : g}</option>)}
                                </select>
                            </div>
                            {/* Lista con scroll automático al canal activo */}
                            <div ref={listRef} className="flex-1 overflow-y-auto space-y-2 mt-3 pr-1 tv-list-scroll">
                                {filtered.map(ch => {
                                    const isActive = selected?.id === ch.id;
                                    return (
                                        <div 
                                            key={ch.id} 
                                            onClick={() => selectChannel(ch)}  // <-- usa la nueva función
                                            className={`flex items-center gap-3 p-2 rounded-xl cursor-pointer transition-all ${
                                                isActive 
                                                    ? 'tv-channel-active' 
                                                    : 'hover:bg-white/5'
                                            }`}
                                        >
                                            <img src={ch.image} alt="" className="w-8 h-8 rounded-lg object-contain bg-black/40 p-1" />
                                            <div className="flex-1 min-w-0">
                                                <h4 className="font-medium text-xs truncate">{ch.title}</h4>
                                                <p className="text-[10px] text-textMuted">{ch.group}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const CategorySection = ({ title, items }) => (
                <div className="space-y-4 animate-fade-up">
                    <h1 className="font-display text-2xl font-extrabold">{title}</h1>
                    {items.length === 0 ? (
                        <div className="text-center py-20 text-textMuted">
                            <i className="ph-film-slate text-5xl mb-3 opacity-40"></i>
                            <p>No hay contenido disponible aún</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">
                            {items.map(item => (
                                <div key={item.id} onClick={() => setActiveMedia(item)} className="glass rounded-xl p-2 card-hover cursor-pointer">
                                    <div className="aspect-[2/3] rounded-lg overflow-hidden mb-2 bg-black/50 relative">
                                        <img src={item.image} alt={item.title} className="w-full h-full object-cover" onError={e => e.target.src='https://placehold.co/300x450/181A28/FF3B71?text=Poster'} />
                                        <button onClick={e => { e.stopPropagation(); toggleFavorite(item); }} className="absolute top-1 right-1 w-7 h-7 rounded-full bg-black/60 flex items-center justify-center backdrop-blur-md">
                                            <i className={`ph-fill ph-heart ${favorites.some(f => f.id === item.id) ? 'text-accent' : 'text-white/70'}`} />
                                        </button>
                                        {item.rating && <span className="absolute bottom-1 left-1 px-1.5 py-0.5 bg-yellow-400/90 text-black text-[10px] font-bold rounded">★ {item.rating}</span>}
                                    </div>
                                    <h4 className="font-semibold text-xs truncate">{item.title}</h4>
                                    <p className="text-[10px] text-textMuted mt-0.5">{item.group}</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            const RadioSection = () => (
                <div className="space-y-4 animate-fade-up">
                    <div>
                        <h1 className="font-display text-2xl font-extrabold">Radio en Alta Definición</h1>
                        <p className="text-textMuted text-sm mt-1">Emisoras de Costa Rica en directo</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {content.radios.map(st => {
                            const active = activeRadio?.id === st.id && isPlayingRadio;
                            return (
                                <div 
                                    key={st.id} 
                                    onClick={() => handlePlayStation(st)} 
                                    className={`glass rounded-2xl p-3 card-hover cursor-pointer transition-all duration-300 ${active ? 'radio-active bg-accent/5' : ''}`}
                                >
                                    <div className="flex items-center gap-3">
                                        <div className="w-16 h-16 rounded-xl overflow-hidden bg-black/50 relative flex-shrink-0">
                                            <img 
                                                src={st.image} 
                                                alt={st.title} 
                                                className="w-full h-full object-cover" 
                                                onError={e => e.target.src='https://placehold.co/300x300/181A28/FF3B71?text=Radio'} 
                                            />
                                            {active && (
                                                <div className="absolute inset-0 bg-black/50 backdrop-blur-[2px] flex items-center justify-center">
                                                    <Equalizer playing={true} />
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <h3 className="font-bold text-sm truncate">{st.title}</h3>
                                            <p className="text-xs text-textMuted truncate mt-0.5">{st.group}</p>
                                            {active && (
                                                <span className="inline-block mt-1 text-[10px] font-semibold text-accent animate-pulse">
                                                    ● Reproduciendo
                                                </span>
                                            )}
                                        </div>
                                        <button className="w-10 h-10 rounded-full bg-gradient-to-br from-accent to-secondary flex items-center justify-center text-white shadow-glow flex-shrink-0 transition-transform active:scale-90">
                                            <i className={`ph-fill ${active ? 'ph-pause' : 'ph-play ml-0.5'}`} />
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const FavoritesSection = () => (
                <div className="space-y-4 animate-fade-up">
                    <h1 className="font-display text-2xl font-extrabold">Mis Favoritos</h1>
                    {favorites.length === 0 ? (
                        <div className="text-center py-20 text-textMuted">
                            <i className="ph-heart-straight text-5xl mb-3 opacity-40"></i>
                            <p>No tienes favoritos guardados aún</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">
                            {favorites.map(item => (
                                <div key={item.id || item.title} onClick={() => setActiveMedia(item)} className="glass rounded-xl p-2 card-hover cursor-pointer">
                                    <div className="aspect-[2/3] rounded-lg overflow-hidden mb-2 bg-black/50">
                                        <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
                                    </div>
                                    <h4 className="font-semibold text-xs truncate">{item.title}</h4>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            // ---------- Render principal ----------
            const tabs = [
                { id: 'home', label: 'Inicio', icon: 'ph-house' },
                { id: 'movies', label: 'Cine', icon: 'ph-film-slate' },
                { id: 'series', label: 'Series', icon: 'ph-video-camera' },
                { id: 'animados', label: 'Animados', icon: 'ph-smiley' },
                { id: 'tv', label: 'TV', icon: 'ph-tv' },
                { id: 'radio', label: 'Radio', icon: 'ph-radio' },
                { id: 'favorites', label: 'Favoritos', icon: 'ph-heart' }
            ];

            return (
                <div className="flex flex-col min-h-screen">
                    {/* HEADER */}
                    <header className="fixed top-0 left-0 right-0 glass z-50 px-3 py-2 border-b border-white/5">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setCurrentTab('home'); setActiveMedia(null); }}>
                                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-accent to-secondary flex items-center justify-center shadow-glow">
                                    <i className="ph-fill ph-play text-white ml-0.5 text-sm"></i>
                                </div>
                                <span className="font-display font-extrabold text-sm hidden sm:block">Magic TV</span>
                            </div>
                            {/* Desktop nav */}
                            <nav className="hidden md:flex items-center gap-4 text-xs font-medium">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => { setCurrentTab(tab.id); setActiveMedia(null); }} className={`flex items-center gap-1.5 px-1 py-2 border-b-2 transition-all ${currentTab === tab.id ? 'border-accent text-white font-semibold' : 'border-transparent text-textMuted hover:text-white'}`}>
                                        <i className={`ph ${tab.icon}`}></i> {tab.label}
                                    </button>
                                ))}
                            </nav>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowQrModal(true)} className="p-2 rounded-xl glass-light hover:bg-white/10 transition-all" title="Código QR">
                                    <i className="ph-qr-code text-base"></i>
                                </button>
                                <button onClick={() => setShowAuthorModal(true)} className="px-3 py-1.5 rounded-full bg-gradient-to-r from-accent to-secondary text-white text-[10px] font-bold shadow-glow hover:shadow-glow-soft transition-all">
                                    Jorge Arturo ⚡
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN */}
                    <main className="flex-1 pt-14 pb-20 px-3 sm:px-6 max-w-7xl mx-auto w-full relative z-10">
                        {activeMedia ? (
                            <MediaViewer media={activeMedia} />
                        ) : (
                            <>
                                {currentTab === 'home' && <HomeSection />}
                                {currentTab === 'movies' && <CategorySection title="Películas" items={content.movies} />}
                                {currentTab === 'series' && <CategorySection title="Series" items={content.series} />}
                                {currentTab === 'animados' && <CategorySection title="Animados" items={content.animados} />}
                                {currentTab === 'tv' && <TVSection />}
                                {currentTab === 'radio' && <RadioSection />}
                                {currentTab === 'favorites' && <FavoritesSection />}
                            </>
                        )}
                    </main>

                    {/* BOTTOM NAV (mobile) */}
                    <nav className="bottom-nav md:hidden">
                        {tabs.map(tab => (
                            <button key={tab.id} onClick={() => { setCurrentTab(tab.id); setActiveMedia(null); }} className={currentTab === tab.id ? 'active' : ''}>
                                <i className={`ph ${tab.icon}`}></i>
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MODAL QR */}
                    {showQrModal && (
                        <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowQrModal(false)}>
                            <div className="glass rounded-3xl p-6 max-w-sm w-full text-center" onClick={e => e.stopPropagation()}>
                                <h2 className="font-display text-xl font-bold mb-3">Escanea el código QR</h2>
                                <img src={QR_IMAGE_URL} alt="QR" className="w-48 h-48 mx-auto rounded-2xl border border-white/10" />
                                <p className="text-textMuted text-sm mt-4">Abre este enlace en tu dispositivo móvil</p>
                                <button onClick={() => setShowQrModal(false)} className="mt-6 px-6 py-2 rounded-full bg-accent/20 text-accent font-semibold hover:bg-accent/30 transition-all text-sm">Cerrar</button>
                            </div>
                        </div>
                    )}

                    {/* MODAL AUTOR */}
                    {showAuthorModal && (
                        <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowAuthorModal(false)}>
                            <div className="glass rounded-3xl p-6 max-w-sm w-full" onClick={e => e.stopPropagation()}>
                                <h2 className="font-display text-2xl font-bold text-center">Jorge Arturo</h2>
                                <p className="text-textMuted text-center text-sm mt-1">Desarrollador de Magic TV 3.0</p>
                                <div className="flex justify-center mt-6">
                                    <img src="https://via.placeholder.com/100x100/6366F1/ffffff?text=JA" className="w-20 h-20 rounded-full border-2 border-accent/30" alt="Avatar" />
                                </div>
                                <p className="text-sm text-center text-textMuted mt-4">Apasionado por el entretenimiento digital y la tecnología.</p>
                                <button onClick={() => setShowAuthorModal(false)} className="mt-6 w-full py-2 rounded-full bg-accent text-white font-bold hover:bg-accentDark transition-all text-sm">Cerrar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Render
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
