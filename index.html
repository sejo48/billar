<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGIS Tube Pro</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Classic -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <!-- Force Babel classic runtime -->
    <script>
        if (typeof Babel !== 'undefined') {
            Babel.registerPreset('react-classic', {
                presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
            });
        }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --primary: #e11d48;
            --primary-hover: #be123c;
        }
        body { 
            background-color: var(--bg-base); 
            color: #fafafa; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }
        h1, h2, h3, h4, h5, .font-heading {
            font-family: 'Outfit', sans-serif;
        }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; border: 2px solid var(--bg-base); }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); } 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); } }
        
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scale-in { animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .glass-panel {
            background: rgba(24, 24, 27, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 1rem); }
        .pt-safe { padding-top: max(env(safe-area-inset-top), 1rem); }

        .iframe-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        /* Card Hover Effects */
        .media-card { transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .media-card:hover { transform: translateY(-4px) scale(1.02); z-index: 10; }
        .media-card:hover .play-overlay { opacity: 1; }
        
        button:focus, div[tabindex="0"]:focus, input:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#09090b;color:white;flex-direction:column;font-family:'Outfit', sans-serif;">
            <div style="width:48px;height:48px;border:4px solid rgba(225,29,72,0.2);border-top-color:#e11d48;border-radius:50%;animation:spin 1s ease-in-out infinite;margin-bottom:24px;"></div>
            <h2 style="font-weight:600;letter-spacing:1px;background:linear-gradient(to right, #fff, #a1a1aa);-webkit-background-clip:text;color:transparent;">Iniciando Experiencia...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        const envConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        const firebaseConfig = JSON.parse(envConfig);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'magis-tube-pro';

        // Keep existing Firebase logic
        let db = null; let auth = null; let currentUser = null;
        if (Object.keys(firebaseConfig).length > 0 && window.firebase) {
            try {
                const app = window.firebase.initializeApp(firebaseConfig);
                auth = window.firebase.auth();
                db = window.firebase.firestore();
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else { await auth.signInAnonymously(); }
                    } catch (e) { console.warn(e); }
                };
                initAuth();
                auth.onAuthStateChanged((user) => { currentUser = user; });
            } catch (e) { console.warn(e); }
        }

        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/retrom3u/refs/heads/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/jorgedrive/refs/heads/main/playlist.json',
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/animados./refs/heads/main/animados.json'
        };

        const cleanDriveUrl = (url) => { 
            if (!url) return ''; 
            if (url.includes('drive.google.com')) { 
                const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match) return `https://drive.google.com/file/d/${match[1]}/preview?usp=sharing&rm=minimal&autoplay=1`;
            } 
            return url; 
        };

        const STATIC_MOVIES = [
            { "titulo": "1923 - El Hombre Mosca", "descripcion": "Un joven de campo recién llegado a la ciudad debe tratar de escalar un edificio de 12 pisos.", "imagen": "https://m.media-amazon.com/images/M/MV5BM2EzYzA2NTgtODQzYy00N2UwLWE0ZGYtMDU3YmYwZTFlOTA5XkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1y9OJY2Se0PJdiUjIL-fcA32TszqwDaRd/view?usp=sharing", "codigo": null },
            { "titulo": "La Laguna Azul (1980)", "descripcion": "Dos niños que sobreviven a un naufragio, llegan a una isla tropical y crecen.", "imagen": "https://m.media-amazon.com/images/M/MV5BMTQ4ZjJlMjktYzA4My00MzJjLWIxNTAtZjhjYWQwYmNlNjE3XkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1eSZglGEJgj_lQtBkuC4FrnywqLFJUTvG/view?usp=sharing", "codigo": "8384" },
            { "titulo": "Caligula (1979)", "descripcion": "Drama de alto contenido erótico que narra el ascenso y caída del emperador romano Calígula.", "imagen": "https://m.media-amazon.com/images/M/MV5BYjllZjhiZWUtMTM1OC00YWJkLWJkOWUtMWZlNzBhNjM2M2QxXkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1ITEdxgIrOSNHTCjUgqAFnsIiVRl_sm1G/view?usp=sharing", "codigo": "8384" },
            { "titulo": "Tiburón 1975", "descripcion": "En la costa de un pequeño pueblo, un enorme tiburón blanco ataca a varias personas.", "imagen": "https://m.media-amazon.com/images/S/pv-target-images/db9eb3024ee3109c0345bdac8575df43989b81e457d26ab7895dbadee66a2b99.jpg", "urlDrive": "https://drive.google.com/file/d/1tGa2AjZYx8neW6e6z5wgc-zC5g0geQkP/view?usp=sharing", "codigo": null },
            { "titulo": "Naranja mecánica (1971)", "descripcion": "Alex es un joven muy agresivo que tiene dos pasiones: la violencia y Beethoven.", "imagen": "https://m.media-amazon.com/images/M/MV5BYjFiN2E5N2ItZjc1Yy00MzZmLThmZGQtNGIyYjljMzk1NmU4XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", "urlDrive": "https://drive.google.com/file/d/1ZJ2L0x5EzI3_lJ3c13Q2hBRNa5Askza2/view?usp=sharing", "codigo": "8384" },
            { "titulo": "Machete", "descripcion": "Machete es un ex federal mexicano que posee extraordinarias habilidades.", "imagen": "https://m.media-amazon.com/images/M/MV5BZTY0OTZmYTMtMjhmOC00NzM3LTk2Y2MtMDg1ODNlOTkyNTcwXkEyXkFqcGc@._V1_.jpg", "urlDrive": "https://drive.google.com/file/d/1oB1Um9GJK8mM2apNqa9tFgNtVY1H5RyI/view?usp=sharing", "codigo": null },
            { "titulo": "La mosca (1986)", "descripcion": "Un científico se utiliza a sí mismo como cobaya en un complejo experimento.", "imagen": "https://image.tmdb.org/t/p/original/mmJLkVX8CVRFVFnfRvjirzX16Oy.jpg", "urlDrive": "https://drive.google.com/file/d/1fJbsO9h6AnXf653IWHEilv249BugOPKD/view?usp=sharing", "codigo": null },
            { "titulo": "Escalofríos (Pesadillas)", "descripcion": "Serie antológica de terror dirigida a la audiencia juvenil e infantil.", "imagen": "https://m.media-amazon.com/images/M/MV5BMmY0YzU1M2QtYjdiYy00M2QzLTk3OTEtNzI1YjAxNTA4ZmEyXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", "urlDrive": "https://drive.google.com/file/d/10YWg29ZGYITqsp2vZqXJIJ7kP38LNllT/view?usp=sharing", "codigo": null },
            { "titulo": "Volver al Futuro III", "descripcion": "Aventura en el lejano oeste con Marty y Doc.", "imagen": "https://es.web.img3.acsta.net/c_310_420/pictures/14/04/28/11/11/012699.jpg", "urlDrive": "https://drive.google.com/file/d/1jgTK5lvRCQSMIDX9qggCb1ljXnjBMB9_/view?usp=sharing", "codigo": null },
            { "titulo": "Volver al futuro (1985)", "descripcion": "El inicio de la gran aventura en 1955.", "imagen": "https://mx.web.img3.acsta.net/pictures/18/06/19/03/59/0330518.jpg", "urlDrive": "https://drive.google.com/file/d/1q82yUlxny8geuVOIzXPbjc51O4WcBMsO/view?usp=sharing", "codigo": null },
            { "titulo": "El vuelo del Fénix (1965)", "descripcion": "Sobrevivir en pleno desierto del Sahara tras un aterrizaje forzoso.", "imagen": "https://i.blogs.es/8ea53a/fenix/400_300.jpg", "urlDrive": "https://drive.google.com/file/d/1hxnELDS6WG45fRR-yXSF2aiLc98a7_30/view?usp=sharing", "codigo": null },
            { "titulo": "El bueno, el malo y el feo", "descripcion": "Tres hombres violentos pelean por una caja con 200 000 dólares.", "imagen": "https://m.media-amazon.com/images/S/pv-target-images/27053c1cf4b53e9cc3a01bc00f2bea73e6ee7ce6f280e9b53e888d0667bb449f.jpg", "urlDrive": "https://drive.google.com/file/d/1Xn71eAiWv8lRSpXJINCfpRe4nlLl8NWV/view?usp=sharing", "codigo": null },
            { "titulo": "2001 Una odisea del espacio", "descripcion": "Obra maestra de la ciencia ficción de Stanley Kubrick.", "imagen": "https://m.media-amazon.com/images/I/71fCGy3H29L._AC_UF894,1000_QL80_.jpg", "urlDrive": "https://drive.google.com/file/d/1kYD0j9JCFfaJfnpHEuDJwNAh-w-XYlbM/view?usp=sharing", "codigo": null },
            { "titulo": "Depredador 1 (1987)", "descripcion": "Fuerzas especiales cazadas por un extraterrestre en la jungla.", "imagen": "https://www.cinecalidad.rs/wp-content/uploads/2017/07/depredador.jpg", "urlDrive": "https://drive.google.com/file/d/1qca85Ro5ho71aio185w7Qc3mQftzkOVo/view?usp=sharing", "codigo": null },
            { "titulo": "GREASE (1978)", "descripcion": "Musical romántico protagonizado por John Travolta y Olivia Newton John.", "imagen": "https://i.pinimg.com/736x/76/65/a0/7665a0f3298262e079b2d8fd3fa734a2.jpg", "urlDrive": "https://drive.google.com/file/d/1AfkegbTGrVEKXUN8Ninr54Kk0Mb037k2/view?usp=sharing", "codigo": null }
        ];

        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const icons = {
                search: <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />,
                tv: <path strokeLinecap="round" strokeLinejoin="round" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />,
                film: <path strokeLinecap="round" strokeLinejoin="round" d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 01-1.125-1.125M3.375 19.5h7.5c.621 0 1.125-.504 1.125-1.125m-9.75 0V5.625m0 12.75v-1.5c0-.621.504-1.125 1.125-1.125m18.375 2.625V5.625m0 12.75c0 .621-.504 1.125-1.125 1.125m1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125m0 3.75h-7.5A1.125 1.125 0 0112 18.375m9.75-12.75c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125m19.5 0v1.5c0 .621-.504 1.125-1.125 1.125M2.25 5.625v1.5c0 .621.504 1.125 1.125 1.125m0 0h17.25m-17.25 0h7.5c.621 0 1.125.504 1.125 1.125M3.375 8.25c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125m17.25-3.75h-7.5c-.621 0-1.125.504-1.125 1.125m8.625-1.125c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h7.5m-7.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125M12 10.875v-1.5m0 1.5c0 .621-.504 1.125-1.125 1.125M12 10.875c0 .621.504 1.125 1.125 1.125m-2.25 0c.621 0 1.125.504 1.125 1.125M13.125 12h7.5m-7.5 0c-.621 0-1.125.504-1.125 1.125M20.625 12c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h7.5M12 14.625v-1.5m0 1.5c0 .621-.504 1.125-1.125 1.125M12 14.625c0 .621.504 1.125 1.125 1.125m-2.25 0c.621 0 1.125.504 1.125 1.125m0 1.5v-1.5m0 0c0-.621.504-1.125 1.125-1.125m0 0h7.5" />,
                play: <path strokeLinecap="round" strokeLinejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347c-.75.412-1.667-.13-1.667-.986V5.653z" />,
                heart: <path strokeLinecap="round" strokeLinejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />,
                arrowLeft: <path strokeLinecap="round" strokeLinejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />,
                chevronDown: <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />,
                chevronUp: <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />,
                clapperboard: <path strokeLinecap="round" strokeLinejoin="round" d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 01-1.125-1.125M3.375 19.5h7.5c.621 0 1.125-.504 1.125-1.125m-9.75 0V5.625m0 12.75v-1.5c0-.621.504-1.125 1.125-1.125m18.375 2.625V5.625m0 12.75c0 .621-.504 1.125-1.125 1.125m1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125m0 3.75h-7.5A1.125 1.125 0 0112 18.375m9.75-12.75c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125m19.5 0v1.5c0 .621-.504 1.125-1.125 1.125M2.25 5.625v1.5c0 .621.504 1.125 1.125 1.125m0 0h17.25m-17.25 0h7.5c.621 0 1.125.504 1.125 1.125M3.375 8.25c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125m17.25-3.75h-7.5c-.621 0-1.125.504-1.125 1.125m8.625-1.125c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h7.5m-7.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125" />,
                lock: <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />,
                smile: <path strokeLinecap="round" strokeLinejoin="round" d="M15.182 15.182a4.5 4.5 0 01-6.364 0M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="1.5" className={className}>
                    {icons[name] || icons.search}
                </svg>
            );
        };

        const LockScreen = ({ onUnlock, correctCode, onCancel }) => {
            const [input, setInput] = useState(''); 
            const [error, setError] = useState(false);
            
            const handleSubmit = (e) => { 
                e.preventDefault(); 
                if (input === String(correctCode)) onUnlock(); 
                else { setError(true); setInput(''); } 
            };

            return (
                <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-4 animate-fade-in rounded-xl">
                    <div className="glass-panel p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-scale-in">
                        <div className="mb-6 flex justify-center">
                            <div className="p-4 bg-rose-500/10 rounded-full text-rose-500 shadow-[0_0_30px_rgba(225,29,72,0.3)]">
                                <Icon name="lock" size={32} />
                            </div>
                        </div>
                        <h2 className="text-xl font-heading font-bold text-white mb-2">Contenido Protegido</h2>
                        <p className="text-gray-400 text-sm mb-6">Ingresa el PIN para acceder a este contenido.</p>
                        
                        <form onSubmit={handleSubmit}>
                            <input 
                                type="password" 
                                maxLength="4" 
                                className={`w-full bg-black/50 border ${error ? 'border-red-500' : 'border-white/10'} rounded-xl px-4 py-3.5 text-center text-2xl tracking-[0.5em] text-white focus:border-rose-500 focus:ring-1 focus:ring-rose-500 outline-none mb-2 transition-all`} 
                                value={input} 
                                onChange={(e) => { setInput(e.target.value); setError(false); }} 
                                placeholder="••••" 
                                autoFocus 
                            />
                            <div className="h-6 mb-4">
                                {error && <p className="text-rose-500 text-xs font-medium animate-fade-in">PIN incorrecto. Intenta de nuevo.</p>}
                            </div>
                            <div className="flex gap-3">
                                <button type="button" onClick={onCancel} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:bg-white/5 text-sm font-semibold transition-colors">Cancelar</button>
                                <button type="submit" className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-semibold hover:bg-rose-700 text-sm shadow-lg shadow-rose-500/25 transition-all active:scale-95">Desbloquear</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const IntroScreen = ({ onEnter }) => (
            <div className="fixed inset-0 z-[100] bg-[#09090b] flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0">

                                    <Icon name="heart" size={18} className={isFavorite ? "text-rose-500" : ""} fill={isFavorite ? "#e11d48" : "none"} />

        const TvListItem = ({ channel, isActive, onClick, isFavorite, onToggleFavorite }) => (

                <div className="w-14 h-10 rounded-lg bg-[#18181b] flex items-center justify-center overflow-hidden flex-shrink-0 border border-white/5 p-1 shadow-inner"> 
                    {channel.image ? ( <img src={channel.image} alt={channel.title} loading="lazy" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} /> ) : ( <Icon name="tv" size={20} className="text-gray-500"/> )} 
                </div> 
                <div className="flex-1 min-w-0"> 
                    <p className={`text-sm font-semibold truncate ${isActive ? 'text-rose-400' : 'text-gray-200 group-hover:text-white'}`}>{channel.title}</p> 
                    <p className="text-[11px] text-gray-500 truncate mt-0.5">{channel.group || 'General'}</p> 
                </div> 
                <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(channel); }} className={`p-2 rounded-full transition-colors ${isFavorite ? 'bg-rose-500/10 text-rose-500' : 'text-gray-500 hover:text-white hover:bg-white/10'}`}> 
                    <Icon name="heart" size={18} fill={isFavorite ? "currentColor" : "none"} /> 
                </button> 
            </div> 
        );

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], animados: [] });
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false); 
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);

            // Fetch data on mount
            useEffect(() => {
                const init = async () => {
                    try {
                        setLoading(true);
                        const [resTV, resSeries, resAnimados] = await Promise.allSettled([ 
                            fetch(URLS.TV), 
                            fetch(URLS.SERIES), 
                            fetch(URLS.ANIMADOS) 
                        ]);

                        let tvChannels = [];
                        let seriesList = [];
                        let animadosList = [];

                        if (resTV.status === 'fulfilled') {
                            const textTV = await resTV.value.text();
                            tvChannels = parseM3U(textTV);
                        }

                        if (resSeries.status === 'fulfilled') {
                            const text = await resSeries.value.text();
                            const jsonSeries = safeParseJSON(text, []);
                            seriesList = (Array.isArray(jsonSeries) ? jsonSeries : []).map(s => ({ 
                                id: s.tituloSerie, title: s.tituloSerie || s.name, description: s.descripcion || s.description || s.sinopsis, image: s.imagen || s.image, type: 'series', codigo: s.codigo || s.password || s.pin, seasons: (s.temporadas || []).map(t => ({ season_number: t.numeroTemporada || 1, episodes: (t.episodios || []).map(e => ({ title: e.tituloEpisodio || e.title, url: cleanDriveUrl(e.urlDrive || e.url), image: s.imagen })) })) 
                            }));
                        }

                        if (resAnimados.status === 'fulfilled') {
                            const text = await resAnimados.value.text();
                            const jsonAnimados = safeParseJSON(text, []);
                            animadosList = (Array.isArray(jsonAnimados) ? jsonAnimados : []).map((a, i) => {
                                const hasSeasons = a.temporadas && a.temporadas.length > 0;
                                return {
                                    id: `anim-${i}`,
                                    title: a.titulo || a.tituloSerie || a.name,
                                    description: a.descripcion || a.sinopsis,
                                    image: a.imagen || a.image || a.poster,
                                    type: hasSeasons ? 'series' : 'movie',
                                    isKids: true,
                                    codigo: a.codigo || a.pin,
                                    url: cleanDriveUrl(a.urlDrive || a.url),
                                    seasons: hasSeasons ? a.temporadas.map(t => ({ season_number: t.numeroTemporada || 1, episodes: (t.episodios || []).map(e => ({ title: e.tituloEpisodio || e.title, url: cleanDriveUrl(e.urlDrive || e.url), image: a.imagen })) })) : []
                                };
                            });
                        }
                        
                        const moviesList = STATIC_MOVIES.map((m, idx) => ({ 
                            ...m, id: `mov-${idx}`, type: 'movie', title: m.titulo, description: m.descripcion, image: m.imagen, url: cleanDriveUrl(m.urlDrive) 
                        }));

                        setContent({ tv: tvChannels, series: seriesList, movies: moviesList, animados: animadosList });
                    } catch (err) { console.error("Error loading data:", err); } finally { setLoading(false); }
                };

                const storedFavs = safeStorage.getItem('magistube_pro_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                
                init();
            }, []);

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo, group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const safeParseJSON = (text, fallback) => {
                if (!text || text.trim() === '') return fallback;
                try { return JSON.parse(text); } 
                catch (e) {
                    try { return JSON.parse(text.replace(/,\s*([\]}])/g, '$1')); } 
                    catch (e2) { return fallback; }
                }
            };

            const toggleFavorite = (item) => { 
                const itemId = item.id || item.title; 
                const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites]; 
                setFavorites(newFavs); 
                safeStorage.setItem('magistube_pro_favs', JSON.stringify(newFavs)); 
            };
            
            const handlePlay = (item) => { 
                const code = item.codigo || item.password || item.pin; 
                if (code) { setSelectedItem(item); setIsLocked(true); } 
                else { setSelectedItem(item); setIsLocked(false); } 
                setExpandedSeason(0); 
                if (item.type === 'series') setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null); 
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' ? [...content.movies, ...content.series, ...content.animados, ...content.tv.slice(0,18)] : activeTab === 'favorites' ? favorites : content[activeTab] || []; 
                if (search) return list.filter(i => (i.title || i.name).toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            
            // Pick a random hero item from movies or series
            const heroItem = useMemo(() => {
                const combined = [...content.movies, ...content.series];
                return combined.length ? combined[Math.floor(Math.random() * combined.length)] : null;
            }, [content]);

            const tabs = [
                { id: 'home', icon: 'search', label: 'Inicio' }, 
                { id: 'series', icon: 'film', label: 'Series' }, 
                { id: 'animados', icon: 'smile', label: 'Animados' },
                { id: 'movies', icon: 'clapperboard', label: 'Cine' }, 
                { id: 'tv', icon: 'tv', label: 'TV en Vivo' }, 
                { id: 'favorites', icon: 'heart', label: 'Mi Lista' }
            ];

            if (showIntro) return <IntroScreen onEnter={() => setShowIntro(false)} />;

            return (
                <div className="min-h-screen bg-[#09090b] text-white flex flex-col font-sans">
                    {/* Top Navigation (Desktop & Tablet) */}

                                    <Icon name="play" size={16} fill="white" />
                                </div>
                                <span className="font-heading font-black text-xl tracking-tight">MAGIS<span className="text-rose-500">Pro</span></span>
                            </div>
                            <div className="flex items-center gap-6">
                                {tabs.map(tab => (
                                    <button 
                                        key={tab.id} 
                                        onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setSearch(''); setIsLocked(false); window.scrollTo(0,0); }} 
                                        className={`text-sm font-semibold transition-colors ${activeTab === tab.id ? 'text-white' : 'text-gray-400 hover:text-gray-200'}`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            {!selectedItem && (
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Icon name="search" size={16} className="text-gray-400 group-focus-within:text-rose-500 transition-colors" />
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Buscar contenido..." 
                                        className="bg-[#18181b] border border-white/10 rounded-full pl-10 pr-4 py-2 text-sm text-white focus:border-rose-500 focus:bg-[#27272a] outline-none transition-all w-48 focus:w-64"
                                        value={search} 
                                        onChange={(e) => setSearch(e.target.value)}
                                    />
                                </div>
                            )}
                            <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center font-heading font-bold text-white text-sm shadow-lg border border-white/20">
                                J
                            </div>
                        </div>
                    </nav>

                    {/* Mobile Top Bar */}
                    <div className="md:hidden fixed top-0 w-full glass-panel z-40 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => {setActiveTab('home'); setSelectedItem(null); setIsLocked(false);}}>
                            <span className="font-heading font-black text-lg tracking-tight">MAGIS<span className="text-rose-500">Pro</span></span>
                        </div>
                        {!selectedItem && (
                            <div className="flex-1 ml-4 relative">
                                <Icon name="search" size={14} className="absolute left-3 top-2.5 text-gray-400" />
                                <input type="text" placeholder="Buscar..." className="w-full bg-[#18181b] rounded-full pl-9 pr-3 py-1.5 text-xs text-white border border-white/10 focus:border-rose-500 outline-none" value={search} onChange={(e) => setSearch(e.target.value)}/>
                            </div>
                        )}
                    </div>

                    {/* Mobile Bottom Bar */}
                    <div className="md:hidden fixed bottom-0 w-full glass-panel z-50 flex justify-around py-2 pb-safe border-t border-white/10">
                        {tabs.filter(t => t.id !== 'favorites').map(tab => (
                            <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setIsLocked(false); window.scrollTo(0,0); }} className={`flex flex-col items-center gap-1 p-2 ${activeTab === tab.id ? 'text-rose-500' : 'text-gray-400'}`}>
                                <Icon name={tab.icon} size={20} fill={activeTab === tab.id && tab.id === 'movies' ? 'currentColor' : 'none'} />
                                <span className="text-[9px] font-semibold">{tab.label}</span>
                            </button>

                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 w-full pt-16 md:pt-20 pb-20 md:pb-8 relative z-10 mx-auto max-w-[1600px]">
                        
                        {/* Player View */}
                        {selectedItem && activeTab !== 'tv' && selectedItem.type !== 'tv' ? (

                                        {isLocked ? (
                                            <div className="aspect-video w-full relative"><LockScreen correctCode={selectedItem.codigo || selectedItem.password || selectedItem.pin} onUnlock={() => setIsLocked(false)} onCancel={() => {setSelectedItem(null); setIsLocked(false);}} /></div>
                                        ) : (
                                            <div className="iframe-container group">
                                                <iframe src={selectedItem.type === 'series' && selectedEpisode ? selectedEpisode.url : selectedItem.url} allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                                <div className="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <a href={selectedItem.type === 'series' && selectedEpisode ? selectedEpisode.url : selectedItem.url} target="_blank" rel="noopener noreferrer" className="bg-black/70 backdrop-blur text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 border border-white/10 hover:bg-rose-600 transition-colors shadow-lg">
                                                        Abrir Externo ↗
                                                    </a>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {!isLocked && (
                                        <div className="mt-8 flex flex-col lg:flex-row gap-8 items-start">
                                            {/* Details */}
                                            <div className="flex-1">
                                                <div className="flex items-start justify-between mb-4">
                                                    <div>
                                                        <h1 className="text-3xl sm:text-4xl font-heading font-black text-white mb-2">{selectedItem.title || selectedItem.name}</h1>
                                                        <div className="flex items-center gap-3 text-sm font-semibold">
                                                            <span className="text-rose-500 uppercase tracking-widest">{selectedItem.type}</span>
                                                            <span className="text-gray-500">•</span>
                                                            <span className="text-gray-300">HD Premium</span>
                                                            {selectedItem.type === 'series' && selectedEpisode && (
                                                                <>
                                                                    <span className="text-gray-500">•</span>
                                                                    <span className="text-white bg-white/10 px-2 py-0.5 rounded">{selectedEpisode.title}</span>
                                                                </>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <button onClick={() => toggleFavorite(selectedItem)} className={`p-3 rounded-xl border transition-all ${favorites.some(f => (f.id||f.title) === (selectedItem.id||selectedItem.title)) ? 'bg-rose-500/10 border-rose-500 text-rose-500' : 'bg-[#18181b] border-white/10 text-gray-400 hover:text-white'}`}>
                                                        <Icon name="heart" size={24} fill={favorites.some(f => (f.id||f.title) === (selectedItem.id||selectedItem.title)) ? "currentColor" : "none"} />
                                                    </button>
                                                </div>
                                                <p className="text-gray-300 text-base leading-relaxed">{selectedItem.description || selectedItem.plot || "Sin descripción disponible."}</p>
                                            </div>

                                            {/* Series Selector */}
                                            {selectedItem.type === 'series' && selectedItem.seasons && selectedItem.seasons.length > 0 && (
                                                <div className="w-full lg:w-80 bg-[#18181b] rounded-2xl p-4 border border-white/5 shadow-xl flex-shrink-0">
                                                    <h3 className="font-heading font-bold text-lg mb-4 flex items-center gap-2 border-b border-white/5 pb-3">
                                                        <Icon name="film" size={20} className="text-rose-500"/> Episodios
                                                    </h3>
                                                    <div className="space-y-2">
                                                        {selectedItem.seasons.map((season, idx) => (
                                                            <div key={idx} className="bg-[#27272a]/50 rounded-xl overflow-hidden border border-white/5">
                                                                <button type="button" onClick={() => setExpandedSeason(expandedSeason === idx ? null : idx)} className="w-full flex justify-between items-center p-3 text-sm font-bold hover:bg-white/5 transition-colors">
                                                                    <span>Temporada {season.season_number}</span>
                                                                    <Icon name={expandedSeason === idx ? "chevronUp" : "chevronDown"} size={16} className="text-gray-400"/>
                                                                </button>
                                                                {expandedSeason === idx && (
                                                                    <div className="flex flex-col bg-black/20 max-h-[300px] overflow-y-auto custom-scrollbar">
                                                                        {season.episodes.map((ep, eIdx) => (
                                                                            <div key={eIdx} onClick={() => { setSelectedEpisode(ep); window.scrollTo({top:0, behavior:'smooth'}); }} className={`text-sm p-3 cursor-pointer border-l-2 flex items-center gap-3 transition-colors ${selectedEpisode?.url === ep.url ? 'border-rose-500 bg-rose-500/10 text-white font-semibold' : 'border-transparent text-gray-400 hover:bg-white/5 hover:text-gray-200'}`}>
                                                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] ${selectedEpisode?.url === ep.url ? 'bg-rose-500 text-white' : 'bg-white/10 text-gray-400'}`}>
                                                                                    {selectedEpisode?.url === ep.url ? <Icon name="play" size={10} fill="currentColor"/> : eIdx + 1}
                                                                                </div>
                                                                                <span className="truncate flex-1">{ep.title}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : activeTab === 'tv' || (selectedItem && selectedItem.type === 'tv') ? (
                            // TV View (Split layout with modern aesthetic)
                            <div className="flex flex-col lg:flex-row h-[calc(100vh-64px)] lg:overflow-hidden w-full pt-2 md:pt-0">
                                <div className="flex-1 relative flex flex-col bg-[#09090b]">
                                    {selectedItem && selectedItem.type === 'tv' ? (
                                        <div className="relative w-full flex-1 flex flex-col justify-center bg-black">
                                            <div className="absolute top-4 left-4 z-30 lg:hidden">
                                                <button onClick={() => setSelectedItem(null)} className="glass-panel p-2 rounded-full text-white shadow-lg"><Icon name="arrowLeft" size={20} /></button>
                                            </div>
                                            <div className="absolute top-4 right-4 z-30">
                                                <span className="bg-rose-600 px-3 py-1 rounded-full text-xs font-bold shadow-lg shadow-rose-500/30 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-white animate-pulse"></span> EN VIVO</span>
                                            </div>
                                            <iframe src={selectedItem.url} className="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                            <div className="absolute bottom-0 inset-x-0 p-6 bg-gradient-to-t from-black to-transparent pointer-events-none">
                                                <h2 className="text-3xl font-heading font-black drop-shadow-lg">{selectedItem.title}</h2>
                                                <p className="text-sm text-gray-300 drop-shadow">{selectedItem.group}</p>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-[40vh] lg:h-full text-center p-6">
                                            <div className="w-24 h-24 rounded-full bg-white/5 flex items-center justify-center mb-4">
                                                <Icon name="tv" size={40} className="text-gray-500"/>
                                            </div>
                                            <h2 className="text-2xl font-heading font-bold text-white mb-2">Televisión en Vivo</h2>
                                            <p className="text-gray-400 text-sm max-w-sm">Selecciona un canal de la lista para comenzar a transmitir en vivo.</p>
                                        </div>
                                    )}
                                </div>
                                
                                {/* Channels Sidebar */}
                                <div className="w-full lg:w-96 bg-[#0f0f11] lg:border-l border-white/5 flex flex-col lg:h-full z-20">
                                    <div className="p-4 glass-panel border-b border-white/5 sticky top-[52px] md:top-[72px] lg:top-0 z-30">
                                        <h3 className="font-heading font-bold text-lg mb-3 flex items-center gap-2"><Icon name="tv" size={20} className="text-rose-500"/> Canales TV</h3>
                                        <div className="relative">
                                            <input type="text" placeholder="Buscar canal..." className="w-full bg-[#18181b] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:border-rose-500 outline-none pl-10" value={search} onChange={(e) => setSearch(e.target.value)}/>
                                            <Icon name="search" size={16} className="absolute left-3.5 top-3 text-gray-400"/>
                                        </div>
                                    </div>
                                    <div className="p-3 space-y-1 overflow-y-auto lg:h-full pb-24 lg:pb-4 custom-scrollbar">
                                        {content.tv.filter(c => !search || c.title.toLowerCase().includes(search.toLowerCase())).map(channel => (
                                            <TvListItem key={channel.id} channel={channel} isActive={selectedItem?.id === channel.id} isFavorite={favorites.some(f => f.id === channel.id)} onToggleFavorite={toggleFavorite} onClick={handlePlay} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            // Standard Views (Home, Series, Movies, Favs)
                            <>
                                {activeTab === 'home' && !search && heroItem && <HeroSection item={heroItem} onPlay={handlePlay} isFavorite={favorites.some(f=>(f.id||f.title)===(heroItem.id||heroItem.title))} onToggleFavorite={toggleFavorite}/>}
                                
                                <div className="px-4 sm:px-6 md:px-12">
                                    <div className="mb-6 flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className="w-1.5 h-6 bg-rose-600 rounded-full shadow-[0_0_10px_rgba(225,29,72,0.5)]"></div>
                                            <h2 className="text-2xl font-heading font-bold tracking-wide">
                                                {activeTab === 'home' ? (search ? 'Resultados de búsqueda' : 'Tendencias') : 
                                                 activeTab === 'favorites' ? 'Mi Lista' : 
                                                 activeTab.charAt(0).toUpperCase() + activeTab.slice(1)}
                                            </h2>
                                        </div>
                                        <div className="text-sm font-semibold text-gray-500">{displayedItems.length} títulos</div>
                                    </div>
                                    
                                    {loading ? (
                                        <div className="flex flex-col items-center justify-center py-24 gap-4">
                                            <div className="w-12 h-12 border-4 border-rose-500/20 border-t-rose-500 rounded-full animate-spin"></div>
                                            <p className="text-gray-400 text-sm font-semibold animate-pulse">Cargando catálogo premium...</p>
                                        </div>
                                    ) : displayedItems.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center py-24 text-center">
                                            <div className="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-4">
                                                <Icon name={activeTab === 'favorites' ? 'heart' : 'search'} size={32} className="text-gray-500" />
                                            </div>
                                            <h3 className="text-xl font-heading font-bold text-white mb-2">No hay contenido</h3>
                                            <p className="text-gray-400 text-sm max-w-sm">No encontramos resultados para tu búsqueda o aún no tienes favoritos guardados.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-4 sm:gap-5 animate-slide-up pb-12">
                                            {displayedItems.map((item, i) => (
                                                <div key={i} style={{animationDelay: `${i * 30}ms`}} className="animate-fade-in opacity-0" style={{animationFillMode: 'forwards'}}>
                                                    <Card item={item} onClick={handlePlay} isFavorite={favorites.some(f => (f.id||f.title) === (item.id||item.title))} onToggleFavorite={toggleFavorite} />
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
